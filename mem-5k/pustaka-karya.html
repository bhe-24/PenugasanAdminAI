<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Perpustakaan Karya Publik - Member 5K Cendekia</title>
    
    <link rel="icon" type="image/png" sizes="512x512" href="https://i.imgur.com/5Srjyo4.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="/mem-5k/central.css">

    <style>
        .filter-chip {
            padding: 5px 12px; border-radius: var(--radius-full); font-size: 0.7rem; font-weight: 700;
            background: white; border: 1.5px solid var(--border-soft); color: var(--text-body);
            cursor: pointer; white-space: nowrap; transition: all 0.2s ease;
        }
        .filter-chip.active {
            background: var(--primary); color: white; border-color: var(--primary);
        }
        .pustaka-card {
            background: white; border-radius: var(--radius-md); padding: 12px;
            border: 1.5px solid var(--border-soft); margin-bottom: 12px;
            display: flex; gap: 12px; cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: var(--shadow-sm);
        }
        .pustaka-card:hover {
            transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--primary);
        }
        .pustaka-cover {
            width: 78px; height: 110px; border-radius: 6px; overflow: hidden;
            background: linear-gradient(135deg, #003366 0%, #001f3f 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; flex-shrink: 0; position: relative; text-align: center;
        }
        .pustaka-cover img {
            width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0;
        }
    </style>
</head>
<body>

    <div class="mobile-app-wrapper">

        <!-- HEADER -->
        <header class="app-header">
            <div style="display:flex; align-items:center; gap:10px;">
                <a href="/mem-5k/index.html" class="btn-header-back" title="Kembali ke Beranda">
                    <i data-lucide="arrow-left" style="width:18px; height:18px;"></i>
                </a>
                <div>
                    <h1 class="header-brand-title" style="display:flex; align-items:center; gap:6px;">
                        <i data-lucide="library" style="width:18px; height:18px; color:var(--accent-dark);"></i> Perpustakaan Karya Publik
                    </h1>
                    <div class="header-brand-sub">Jelajahi Karya Orisinal Siswa Cendekia</div>
                </div>
            </div>
            <a href="/mem-5k/berkarya.html" class="btn-primary-challenge" style="padding:6px 12px; font-size:0.7rem; width:auto; text-decoration:none;">
                <i data-lucide="pen-tool" style="width:12px; height:12px;"></i> Tulis
            </a>
        </header>

        <main class="app-body">

            <!-- PENCARIAN & FILTER -->
            <div style="background:white; border-radius:var(--radius-md); padding:12px; border:1.5px solid var(--border-soft); margin-bottom:14px;">
                <!-- SEARCH INPUT -->
                <div style="position:relative; margin-bottom:10px;">
                    <i data-lucide="search" style="position:absolute; left:10px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:#94a3b8;"></i>
                    <input type="text" id="searchInput" placeholder="Cari judul, penulis, atau tagar cerita..." style="width:100%; padding:8px 10px 8px 34px; border:1.5px solid var(--border-soft); border-radius:var(--radius-sm); font-size:0.75rem; outline:none; font-family:inherit;">
                </div>

                <!-- GENRE CHIPS -->
                <div style="display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:8px; scrollbar-width:none;">
                    <button type="button" class="filter-chip active" onclick="setGenreFilter('all', this)">Semua Genre</button>
                    <button type="button" class="filter-chip" onclick="setGenreFilter('cerpen', this)">Cerpen</button>
                    <button type="button" class="filter-chip" onclick="setGenreFilter('puisi', this)">Puisi</button>
                    <button type="button" class="filter-chip" onclick="setGenreFilter('novel', this)">Novel</button>
                    <button type="button" class="filter-chip" onclick="setGenreFilter('artikel', this)">Artikel</button>
                    <button type="button" class="filter-chip" onclick="setGenreFilter('drama', this)">Drama</button>
                </div>

                <!-- SORT ROW -->
                <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px dashed #e2e8f0; padding-top:8px;">
                    <span style="font-size:0.68rem; color:var(--text-muted);">
                        Ditemukan: <b id="resultsCount">0</b> Karya
                    </span>
                    <div style="display:flex; align-items:center; gap:4px; font-size:0.68rem;">
                        <span style="color:var(--text-muted);">Urutkan:</span>
                        <select id="sortSelect" onchange="applyFiltersAndSort()" style="border:1px solid var(--border-soft); border-radius:4px; padding:3px 6px; font-size:0.68rem; outline:none; background:white; color:var(--primary); font-weight:700;">
                            <option value="newest">Terbaru</option>
                            <option value="reads">Pembaca Terbanyak</option>
                            <option value="likes">Suka Terbanyak</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- CONTAINER LIST KARYA -->
            <div id="pustakaListContainer"></div>

            <!-- COPYRIGHT FOOTER -->
            <div class="app-footer-copyright">
                &copy; 2026 PT Cendekia Aksara Edukasi. Seluruh Hak Cipta Dilindungi.
            </div>

        </main>

    </div>

    <!-- ENGINE SCRIPTS -->
    <script src="/mem-5k/central.js"></script>
    <script>
        let currentGenre = 'all';
        let isInitialLoad = true;

        function setGenreFilter(genre, btnEl) {
            currentGenre = genre;
            document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
            if (btnEl) btnEl.classList.add('active');
            applyFiltersAndSort();
        }

        function applyFiltersAndSort() {
            const query = (document.getElementById('searchInput').value || '').toLowerCase().trim();
            const sortBy = document.getElementById('sortSelect').value;
            const container = document.getElementById('pustakaListContainer');

            // 100% DATA RIIL DARI DATABASE FIRESTORE
            const allStories = CendekiaApp.getPublicStories() || [];

            let filtered = allStories.filter(s => {
                const matchGenre = currentGenre === 'all' || (s.genre || 'cerpen') === currentGenre;
                const matchQuery = !query || 
                    (s.title && s.title.toLowerCase().includes(query)) ||
                    (s.author && s.author.toLowerCase().includes(query)) ||
                    (s.tags && s.tags.toLowerCase().includes(query)) ||
                    (s.synopsis && s.synopsis.toLowerCase().includes(query));
                return matchGenre && matchQuery;
            });

            // SORTIR
            if (sortBy === 'reads') {
                filtered.sort((a, b) => (b.reads || 0) - (a.reads || 0));
            } else if (sortBy === 'likes') {
                filtered.sort((a, b) => (b.likes || 0) - (a.likes || 0));
            } else {
                filtered.sort((a, b) => new Date(b.publishedAt || b.createdAt || 0) - new Date(a.publishedAt || a.createdAt || 0));
            }

            document.getElementById('resultsCount').textContent = filtered.length;

            if (filtered.length === 0) {
                if (isInitialLoad && allStories.length === 0) {
                    container.innerHTML = `
                        <div style="background:white; border-radius:var(--radius-md); padding:30px 16px; border:1px solid #e2e8f0; text-align:center;">
                            <i data-lucide="loader-2" style="width:28px; height:28px; color:#0284c7; animation:spin 1s linear infinite; display:inline-block; margin-bottom:8px;"></i>
                            <div style="font-size:0.78rem; color:#475569; font-weight:600;">Memuat seluruh arsip karya dari database Cendekia...</div>
                        </div>
                    `;
                    if (window.lucide) lucide.createIcons();
                    return;
                }

                container.innerHTML = `
                    <div style="background:white; border-radius:var(--radius-md); padding:32px 16px; border:1.5px dashed #cbd5e1; text-align:center;">
                        <i data-lucide="book-open" style="width:36px; height:36px; color:#94a3b8; margin-bottom:8px;"></i>
                        <strong style="font-size:0.88rem; color:var(--primary); display:block;">Tidak Ada Karya yang Cocok</strong>
                        <p style="font-size:0.72rem; color:var(--text-muted); margin:4px 0 14px;">Coba gunakan kata kunci pencarian lain atau pilih kategori genre berbeda.</p>
                        <a href="/mem-5k/berkarya.html" class="btn-primary-challenge" style="display:inline-flex; width:auto; text-decoration:none; padding:8px 16px;">
                            Mulai Tulis Karya
                        </a>
                    </div>
                `;
                if (window.lucide) lucide.createIcons();
                return;
            }

            isInitialLoad = false;
            container.innerHTML = '';
            filtered.forEach(s => {
                const chaptersCount = (s.chapters && Array.isArray(s.chapters) && s.chapters.length > 0) ? s.chapters.length : 1;
                const likes = s.likes || 0;
                const reads = s.reads || 0;
                const genre = (s.genre || 'cerpen').toUpperCase();
                const coverSrc = s.coverUrl || s.coverBase64 || '';

                const card = document.createElement('div');
                card.className = 'pustaka-card';
                card.onclick = () => {
                    window.location.href = `/mem-5k/baca.html?id=${s.id}`;
                };

                card.innerHTML = `
                    <div class="pustaka-cover">
                        ${coverSrc ? `
                            <img src="${coverSrc}" alt="Cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                            <div style="display:none; height:100%; width:100%; flex-direction:column; align-items:center; justify-content:center; padding:4px;">
                                <i data-lucide="${s.genre === 'puisi' ? 'feather' : 'book-text'}" style="width:20px; height:20px; margin-bottom:4px; color:#fef08a;"></i>
                                <span style="font-size:0.5rem; text-transform:uppercase; font-weight:800; color:#f8fafc;">${genre}</span>
                            </div>
                        ` : `
                            <i data-lucide="${s.genre === 'puisi' ? 'feather' : 'book-text'}" style="width:22px; height:22px; margin-bottom:4px; color:#fef08a;"></i>
                            <span style="font-size:0.52rem; text-transform:uppercase; font-weight:800; color:#f8fafc;">${genre}</span>
                        `}
                    </div>

                    <div style="flex:1; min-width:0; display:flex; flex-direction:column; justify-content:space-between;">
                        <div>
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;">
                                <span style="font-size:0.58rem; font-weight:800; color:var(--accent-dark); text-transform:uppercase;">
                                    ${genre}
                                </span>
                                <span style="font-size:0.62rem; color:#e11d48; font-weight:700; display:flex; align-items:center; gap:2px;">
                                    <i data-lucide="heart" style="width:10px; height:10px; fill:#e11d48;"></i> ${likes}
                                </span>
                            </div>
                            <strong style="font-size:0.86rem; color:var(--primary); display:block; white-space:nowrap; text-overflow:ellipsis; overflow:hidden; margin-bottom:3px;">
                                ${s.title || 'Naskah Tanpa Judul'}
                            </strong>
                            <div style="font-size:0.66rem; color:var(--text-muted); margin-bottom:4px;">
                                Oleh: <b style="color:#0284c7;">${s.author || 'Siswa Cendekia'}</b> &bull; <span style="color:#15803d; font-weight:700;">${s.authorTier || 'Database'}</span>
                            </div>
                            <p style="font-size:0.7rem; color:#475569; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin:0 0 6px;">
                                ${s.synopsis || (s.body ? s.body.slice(0, 90) : 'Karya orisinal pilihan tersimpan di database Cendekia...')}
                            </p>
                        </div>

                        <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px dashed #f1f5f9; padding-top:6px;">
                            <span style="font-size:0.62rem; color:var(--text-muted);">
                                <i data-lucide="eye" style="width:10px; height:10px; display:inline-block; vertical-align:middle;"></i> ${reads} &bull; ${chaptersCount} Bab &bull; ${s.words || 0} Kata
                            </span>
                            <span style="font-size:0.68rem; font-weight:800; color:var(--primary); display:inline-flex; align-items:center; gap:2px;">
                                Baca <i data-lucide="chevron-right" style="width:12px; height:12px;"></i>
                            </span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            if (window.lucide) lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', () => {
            CendekiaApp.renderBottomNav('beranda');
            applyFiltersAndSort();
            document.getElementById('searchInput').addEventListener('input', applyFiltersAndSort);

            // Ambil data riil langsung dari database Firestore
            CendekiaApp.fetchPublicStoriesFromDatabase().then(() => {
                isInitialLoad = false;
                applyFiltersAndSort();
            });

            window.addEventListener('cendekia:stories_updated', () => {
                isInitialLoad = false;
                applyFiltersAndSort();
            });
        });
    
    </script>
</body>
</html>
