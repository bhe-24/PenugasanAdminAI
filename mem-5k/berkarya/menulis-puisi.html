<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menulis Puisi - Member 5K Cendekia</title>
    
    <link rel="icon" type="image/png" sizes="512x512" href="https://i.imgur.com/5Srjyo4.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/mem-5k/central.css">

    <style>
        .poem-pad {
            background: #fffdfa; border: 1.5px solid var(--accent); border-radius: var(--radius-md);
            padding: 18px; box-shadow: var(--shadow-sm);
        }
        .poem-title-input {
            width: 100%; border: none; border-bottom: 2px solid rgba(212,175,55,0.4);
            padding: 8px 0; font-size: 1.15rem; font-weight: 800; color: #78350f;
            outline: none; background: transparent; font-family: 'Poppins', serif;
            text-align: center; margin-bottom: 14px;
        }
        .poem-textarea {
            width: 100%; min-height: 240px; border: none; background: transparent;
            font-family: 'Poppins', serif; font-size: 0.92rem; color: #451a03; line-height: 1.8;
            outline: none; resize: vertical; text-align: center;
        }
    </style>
</head>
<body>

    <div class="mobile-app-wrapper">

        <header class="app-header">
            <div style="display:flex; align-items:center; gap:10px;">
                <a href="/mem-5k/berkarya.html" class="btn-header-back" title="Kembali">
                    <i data-lucide="arrow-left" style="width:18px; height:18px;"></i>
                </a>
                <div>
                    <h1 class="header-brand-title" style="display:flex; align-items:center; gap:6px;">
                        <i data-lucide="feather" style="width:18px; height:18px; color:var(--accent);"></i> Menulis Puisi
                    </h1>
                    <div class="header-brand-sub">Studio Rima &amp; Diksi Estetis</div>
                </div>
            </div>
            <button type="button" class="btn-primary-challenge" style="padding:6px 12px; font-size:0.72rem; width:auto;" onclick="savePoem()">
                <i data-lucide="save" style="width:13px; height:13px;"></i> Simpan
            </button>
        </header>

        <main class="app-body">

            <div class="poem-pad">
                <input type="text" id="poemTitle" class="poem-title-input" placeholder="Ketikkan Judul Puisi...">
                
                <textarea id="poemBody" class="poem-textarea" placeholder="Tuliskan bait puisimu di sini...&#10;&#10;Contoh:&#10;Di lengkung senja yang memerah&#10;kubasuh rindu yang tersisa&#10;antara hembusan angin basah&#10;dan jejak langkah tanpa suara."></textarea>
            </div>

            <!-- BANTUAN RIMA & CITRAAN -->
            <div style="background:white; border-radius:var(--radius-md); padding:14px; border:1px solid var(--border-soft);">
                <div style="font-size:0.78rem; font-weight:800; color:var(--primary); margin-bottom:6px; display:flex; align-items:center; gap:6px;">
                    <i data-lucide="sparkles" style="width:16px; height:16px; color:var(--accent-dark);"></i> Panduan Citraan Rasa:
                </div>
                <div style="font-size:0.72rem; color:var(--text-body); line-height:1.45;">
                    Perkuat puisimu dengan melibatkan <b>citraan penglihatan</b> (warna, cahaya), <b>citraan pendengaran</b> (derau, desau), dan <b>citraan rabaan</b> (dingin, lembut).
                </div>
            </div>

            <div class="app-footer-copyright">
                &copy; 2026 PT Cendekia Aksara Edukasi. Seluruh Hak Cipta Dilindungi.
            </div>

        </main>

    </div>

    <script src="/mem-5k/central.js"></script>
    <script>
        function savePoem() {
            const title = document.getElementById('poemTitle').value.trim() || 'Puisi Tanpa Judul';
            const body = document.getElementById('poemBody').value.trim();

            if (!body) {
                alert('Tuliskan bait puisimu terlebih dahulu sebelum menyimpan.');
                return;
            }

            const saved = CendekiaApp.saveWork({
                title,
                body,
                genre: 'puisi',
                words: body.split(/\s+/).length
            });

            CendekiaApp.addXP(20, 'Gubahan Puisi Selesai');
            alert('Puisimu telah tersimpan di Karyaku!');
            window.location.href = '/mem-5k/berkarya/karyaku.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            CendekiaApp.renderBottomNav('berkarya');
        });
    </script>
</body>
</html>
