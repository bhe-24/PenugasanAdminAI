<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tanya Asisten (AksaBot AI) - Member 5K Cendekia</title>
    
    <link rel="icon" type="image/png" sizes="512x512" href="https://i.imgur.com/5Srjyo4.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="/mem-5k/central.css">

    <style>
        /* WHATSAPP-STYLE ROOM LAYOUT */
        .mobile-app-wrapper.wa-mode {
            padding-bottom: 0 !important;
            height: 100dvh;
            max-height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        @media (min-width: 480px) {
            .mobile-app-wrapper.wa-mode {
                height: min(92vh, 840px);
                min-height: 600px;
                max-height: 840px;
            }
        }

        /* WA HEADER BAR */
        .wa-header {
            background: linear-gradient(135deg, #075e54 0%, #0d7a6e 100%);
            color: white;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            box-shadow: 0 2px 10px rgba(7, 94, 84, 0.25);
            flex-shrink: 0;
            z-index: 20;
        }
        .wa-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
        }
        .wa-back-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.14);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            flex-shrink: 0;
            transition: background 0.15s;
        }
        .wa-back-btn:hover { background: rgba(255, 255, 255, 0.25); }
        .wa-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: white;
            color: #075e54;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
            border: 2px solid #99f6e4;
        }
        .wa-online-dot {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #25d366;
            border: 2px solid #075e54;
        }
        .wa-title {
            font-size: 0.94rem;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .wa-status {
            font-size: 0.68rem;
            color: #ccfbf1;
            font-weight: 500;
            margin-top: 1px;
        }
        .wa-action-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.14);
            border: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        .wa-action-btn:hover { background: rgba(255, 255, 255, 0.25); }

        /* WA CHAT WALLPAPER BODY */
        .wa-chat-body {
            flex: 1;
            overflow-y: auto;
            padding: 12px 12px 14px;
            background-color: #efeae2;
            background-image:
                radial-gradient(rgba(7, 94, 84, 0.06) 1px, transparent 1px),
                radial-gradient(rgba(212, 175, 55, 0.06) 1px, transparent 1px);
            background-size: 24px 24px;
            background-position: 0 0, 12px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            scroll-behavior: smooth;
        }

        .wa-date-pill {
            align-self: center;
            background: rgba(255, 255, 255, 0.92);
            color: #54656f;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
            margin: 4px 0 6px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* CHAT BUBBLES GAYA WHATSAPP */
        .wa-msg-row {
            display: flex;
            flex-direction: column;
            max-width: 84%;
            animation: waFadeIn 0.2s ease;
        }
        @keyframes waFadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .wa-msg-row.bot { align-self: flex-start; }
        .wa-msg-row.user { align-self: flex-end; }

        .wa-bubble {
            padding: 8px 11px 6px;
            border-radius: 12px;
            font-size: 0.8rem;
            line-height: 1.5;
            color: #111b21;
            box-shadow: 0 1px 1.5px rgba(11, 20, 26, 0.13);
            position: relative;
            word-wrap: break-word;
        }
        .wa-msg-row.bot .wa-bubble {
            background: #ffffff;
            border-top-left-radius: 3px;
        }
        .wa-msg-row.user .wa-bubble {
            background: #d9fdd3;
            border-top-right-radius: 3px;
        }
        .wa-sender-tag {
            font-size: 0.65rem;
            font-weight: 800;
            color: #075e54;
            margin-bottom: 3px;
            display: block;
        }
        .wa-bubble p { margin: 0 0 6px 0; }
        .wa-bubble p:last-of-type { margin-bottom: 0; }
        .wa-bubble ul, .wa-bubble ol { padding-left: 18px; margin: 4px 0; }
        .wa-bubble li { margin-bottom: 3px; }

        .wa-meta {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 3px;
            font-size: 0.6rem;
            color: #667781;
            margin-top: 3px;
        }
        .wa-ticks {
            color: #53bdeb;
            font-size: 0.72rem;
            font-weight: 800;
            line-height: 1;
        }

        /* TYPING BUBBLE */
        .wa-typing {
            align-self: flex-start;
            background: #ffffff;
            border-radius: 12px;
            border-top-left-radius: 3px;
            padding: 10px 14px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 1px 1.5px rgba(11, 20, 26, 0.13);
        }
        .wa-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #8696a0;
            animation: waBounce 1.2s infinite ease-in-out;
        }
        .wa-dot:nth-child(2) { animation-delay: 0.2s; }
        .wa-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes waBounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-5px); }
        }

        /* QUICK CHIPS BAR */
        .wa-chips-bar {
            background: #f0f2f5;
            padding: 7px 10px 4px;
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
            border-top: 1px solid #e2e8f0;
            flex-shrink: 0;
        }
        .wa-chips-bar::-webkit-scrollbar { display: none; }
        .wa-chip {
            background: white;
            border: 1px solid #cbd5e1;
            color: #075e54;
            padding: 5px 11px;
            border-radius: 999px;
            font-size: 0.68rem;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.15s;
        }
        .wa-chip:hover { background: #ecfdf5; border-color: #10b981; }

        /* WA FOOTER INPUT BAR */
        .wa-footer {
            background: #f0f2f5;
            padding: 6px 10px 12px;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            flex-shrink: 0;
        }
        .wa-input-pill {
            flex: 1;
            background: white;
            border-radius: 22px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
        }
        .wa-textarea {
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            font-family: inherit;
            font-size: 0.82rem;
            line-height: 1.35;
            max-height: 96px;
            min-height: 20px;
            color: #111b21;
            background: transparent;
        }
        .wa-send-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: #00a884;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0, 168, 132, 0.35);
            transition: transform 0.15s, background 0.15s;
        }
        .wa-send-btn:active { transform: scale(0.92); }
        .wa-send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="mobile-app-wrapper wa-mode">

        <!-- WHATSAPP-STYLE TOP HEADER -->
        <header class="wa-header">
            <div class="wa-header-left">
                <a href="/mem-5k/index.html" class="wa-back-btn" title="Kembali ke Beranda Member 5K">
                    <i data-lucide="arrow-left" style="width:18px; height:18px;"></i>
                </a>
                <div class="wa-avatar">
                    <i data-lucide="bot" style="width:22px; height:22px;"></i>
                    <span class="wa-online-dot"></span>
                </div>
                <div style="min-width:0; flex:1;">
                    <div class="wa-title">AksaBot &bull; Asisten Pintar</div>
                    <div class="wa-status" id="waStatusText">online &bull; Asisten AI Member 5K</div>
                </div>
            </div>
            <button type="button" class="wa-action-btn" onclick="clearAksaChat()" title="Bersihkan Riwayat Obrolan">
                <i data-lucide="trash-2" style="width:16px; height:16px;"></i>
            </button>
        </header>

        <!-- WHATSAPP-STYLE CHAT ROOM -->
        <div class="wa-chat-body" id="chatContainer">
            <div class="wa-date-pill">HARI INI</div>
        </div>

        <!-- QUICK PROMPT CHIPS -->
        <div class="wa-chips-bar">
            <button type="button" class="wa-chip" onclick="fillPrompt('Tolong cek kaidah EYD V pada kalimat ini: ')">
                <i data-lucide="spell-check" style="width:12px; height:12px;"></i> Cek EYD V
            </button>
            <button type="button" class="wa-chip" onclick="fillPrompt('Bantu aku buat diksi puitis dan majas untuk tema: ')">
                <i data-lucide="sparkles" style="width:12px; height:12px;"></i> Diksi Puitis
            </button>
            <button type="button" class="wa-chip" onclick="fillPrompt('Berikan ide pembuka cerpen yang bikin penasaran tentang: ')">
                <i data-lucide="book-open" style="width:12px; height:12px;"></i> Ide Cerpen
            </button>
            <button type="button" class="wa-chip" onclick="fillPrompt('Jelaskan perbedaan majas metafora, simile, dan personifikasi beserta contohnya!')">
                <i data-lucide="help-circle" style="width:12px; height:12px;"></i> Tanya Materi
            </button>
        </div>

        <!-- WHATSAPP-STYLE INPUT BAR -->
        <div class="wa-footer">
            <div class="wa-input-pill">
                <textarea id="chatInput" class="wa-textarea" rows="1" placeholder="Ketik pesan ke AksaBot..." oninput="autoGrow(this)" onkeydown="handleKeyDown(event)"></textarea>
            </div>
            <button type="button" id="btnSendChat" class="wa-send-btn" onclick="submitMessage()" title="Kirim Pesan">
                <i data-lucide="send" style="width:18px; height:18px;"></i>
            </button>
        </div>

    </div>

    <script src="/mem-5k/central.js"></script>
    <script>
        const STORAGE_KEY_AKSABOT_5K = 'cendekia_5k_aksabot_chats';
        let chatHistory = [];
        let isSending = false;

        function formatMessageHTML(text) {
            if (!text) return '';
            let safe = String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
            safe = safe.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
            safe = safe.replace(/\*(.*?)\*/g, '<i>$1</i>');
            safe = safe.replace(/^[•\-\*]\s+(.*)$/gm, '<li>$1</li>');
            safe = safe.replace(/(<li>[\s\S]*?<\/li>)/g, '<ul>$1</ul>');
            safe = safe.replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>');
            return `<p>${safe}</p>`;
        }

        function nowTimeStr() {
            return new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        }

        function scrollToBottom() {
            const box = document.getElementById('chatContainer');
            if (box) box.scrollTop = box.scrollHeight;
        }

        function appendBubble(role, content, timeStr) {
            const box = document.getElementById('chatContainer');
            if (!box) return;

            const isUser = role === 'user';
            const row = document.createElement('div');
            row.className = `wa-msg-row ${isUser ? 'user' : 'bot'}`;

            row.innerHTML = `
                <div class="wa-bubble">
                    ${!isUser ? '<span class="wa-sender-tag">AksaBot AI</span>' : ''}
                    ${formatMessageHTML(content)}
                    <div class="wa-meta">
                        <span>${timeStr || nowTimeStr()}</span>
                        ${isUser ? '<span class="wa-ticks">✓✓</span>' : ''}
                    </div>
                </div>
            `;
            box.appendChild(row);
            scrollToBottom();
        }

        function renderWelcomeGreeting() {
            const user = CendekiaApp.getUser();
            const firstName = (user.name || 'Teman').split(' ')[0];
            appendBubble(
                'assistant',
                `Halo ${firstName}! Aku **AksaBot**, asisten pintar pribadimu di Member 5K 🤖✨\n\nTanya apa saja santai seperti chat WhatsApp biasa:\n- Bedah ejaan EYD V & kalimat efektif\n- Cari diksi puitis, majas, & ide cerpen/puisi\n- Tanya materi Pengetahuan Umum, Inti, maupun Khusus\n\nAda yang lagi kamu kerjakan atau tanyakan hari ini?`,
                nowTimeStr()
            );
        }

        function loadChatHistory() {
            const box = document.getElementById('chatContainer');
            box.innerHTML = '<div class="wa-date-pill">HARI INI</div>';
            try {
                const raw = localStorage.getItem(STORAGE_KEY_AKSABOT_5K);
                chatHistory = raw ? JSON.parse(raw) : [];
            } catch (e) {
                chatHistory = [];
            }

            if (chatHistory.length === 0) {
                renderWelcomeGreeting();
            } else {
                chatHistory.forEach(item => appendBubble(item.role, item.content, item.time));
            }
            if (window.lucide) lucide.createIcons();
        }

        function saveChatHistory() {
            try {
                if (chatHistory.length > 40) chatHistory = chatHistory.slice(-40);
                localStorage.setItem(STORAGE_KEY_AKSABOT_5K, JSON.stringify(chatHistory));
            } catch (e) {}
        }

        function autoGrow(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(96, el.scrollHeight) + 'px';
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                submitMessage();
            }
        }

        function fillPrompt(txt) {
            const inp = document.getElementById('chatInput');
            inp.value = txt;
            inp.focus();
            autoGrow(inp);
        }

        function clearAksaChat() {
            Swal.fire({
                title: 'Bersihkan Obrolan?',
                text: 'Riwayat chat dengan AksaBot akan dimulai dari awal.',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#075e54',
                confirmButtonText: 'Ya, Bersihkan',
                cancelButtonText: 'Batal'
            }).then((res) => {
                if (res.isConfirmed) {
                    chatHistory = [];
                    localStorage.removeItem(STORAGE_KEY_AKSABOT_5K);
                    loadChatHistory();
                }
            });
        }

        async function submitMessage() {
            if (isSending) return;
            const inp = document.getElementById('chatInput');
            const message = inp.value.trim();
            if (!message) return;

            isSending = true;
            inp.value = '';
            inp.style.height = 'auto';
            document.getElementById('btnSendChat').disabled = true;

            const statusEl = document.getElementById('waStatusText');
            if (statusEl) statusEl.textContent = 'mengetik...';

            const tNow = nowTimeStr();
            appendBubble('user', message, tNow);
            chatHistory.push({ role: 'user', content: message, time: tNow });
            saveChatHistory();

            // Typing indicator gaya WhatsApp
            const box = document.getElementById('chatContainer');
            const typing = document.createElement('div');
            typing.id = 'waTypingBubble';
            typing.className = 'wa-typing';
            typing.innerHTML = '<span class="wa-dot"></span><span class="wa-dot"></span><span class="wa-dot"></span>';
            box.appendChild(typing);
            scrollToBottom();

            try {
                const context = chatHistory.slice(-8).map(h => ({ role: h.role, content: h.content }));
                const result = await CendekiaApp.askAksaBotAI(message, context);
                const reply = result?.reply || 'Halo! AksaBot siap membantumu. Coba tanyakan kembali ya!';

                const tBubble = document.getElementById('waTypingBubble');
                if (tBubble) tBubble.remove();

                const aiTime = nowTimeStr();
                appendBubble('assistant', reply, aiTime);
                chatHistory.push({ role: 'assistant', content: reply, time: aiTime });
                saveChatHistory();

                // Catat aktivitas konsultasi asisten
                CendekiaApp.logActivity('Tanya Asisten AksaBot AI', 'bot', 'chat');
            } catch (err) {
                const tBubble = document.getElementById('waTypingBubble');
                if (tBubble) tBubble.remove();
                appendBubble('assistant', 'Maaf, jaringan ke server AksaBot sedang sibuk. Coba kirim pesan lagi dalam sesaat ya! 🙏', nowTimeStr());
            } finally {
                isSending = false;
                document.getElementById('btnSendChat').disabled = false;
                if (statusEl) statusEl.textContent = 'online • Asisten AI Member 5K';
                inp.focus();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadChatHistory();
            if (window.lucide) lucide.createIcons();
        });
    </script>
</body>
</html>
