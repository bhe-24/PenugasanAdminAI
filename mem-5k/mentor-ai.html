<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Asisten Pintar - Member 5K Cendekia</title>

    <link rel="icon" type="image/png" sizes="512x512" href="https://i.imgur.com/5Srjyo4.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="/mem-5k/central.css">

    <style>
        /* PROPORTIONAL FULL-HEIGHT ROOM LAYOUT (LOCKED TO MOBILE SCREEN) */
        html, body {
            height: 100% !important;
            height: 100dvh !important;
            max-height: 100dvh !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
            position: fixed !important;
            width: 100% !important;
            top: 0;
            left: 0;
            background: #0b1329;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .mobile-app-wrapper.wa-mode {
            position: fixed !important;
            top: 0 !important;
            bottom: 0 !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            width: 100% !important;
            max-width: 480px !important;
            height: 100% !important;
            height: 100dvh !important;
            max-height: 100dvh !important;
            padding: 0 !important;
            margin: 0 !important;
            overflow: hidden !important;
            display: flex !important;
            flex-direction: column !important;
            background: #efeae2;
            box-shadow: 0 0 24px rgba(0, 0, 0, 0.3);
        }

        /* HEADER BAR (SELALU TERKUNCI DI ATAS) */
        .wa-header {
            background: linear-gradient(135deg, #075e54 0%, #0d7a6e 100%);
            color: white;
            padding: 0 12px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            box-shadow: 0 2px 8px rgba(7, 94, 84, 0.25);
            flex-shrink: 0;
            z-index: 30;
        }
        .wa-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
        }
        .wa-back-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.14);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            flex-shrink: 0;
            transition: background 0.15s;
        }
        .wa-back-btn:hover { background: rgba(255, 255, 255, 0.25); }
        .wa-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #ffffff;
            color: #075e54;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
            border: 2px solid #99f6e4;
        }
        .wa-online-dot {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #25d366;
            border: 2px solid #075e54;
        }
        .wa-title {
            font-size: 0.92rem;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .wa-status {
            font-size: 0.66rem;
            color: #ccfbf1;
            font-weight: 500;
            margin-top: 1px;
        }
        .wa-action-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.14);
            border: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        .wa-action-btn:hover { background: rgba(255, 255, 255, 0.25); }

        /* CHAT WALLPAPER BODY (SATU-SATUNYA YANG SCROLL DI TENGAH) */
        .wa-chat-body {
            flex: 1 1 0% !important;
            min-height: 0 !important;
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch;
            padding: 12px 12px 14px;
            background-color: #efeae2;
            background-image:
                radial-gradient(rgba(7, 94, 84, 0.05) 1px, transparent 1px),
                radial-gradient(rgba(212, 175, 55, 0.05) 1px, transparent 1px);
            background-size: 24px 24px;
            background-position: 0 0, 12px 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
        }

        .wa-date-pill {
            align-self: center;
            background: rgba(255, 255, 255, 0.94);
            color: #54656f;
            font-size: 0.64rem;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
            margin: 2px 0 6px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* CHAT BUBBLES GAYA WHATSAPP DENGAN SPASING RAPI */
        .wa-msg-row {
            display: flex;
            flex-direction: column;
            max-width: 86%;
            animation: waFadeIn 0.18s ease;
        }
        @keyframes waFadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .wa-msg-row.bot { align-self: flex-start; }
        .wa-msg-row.user { align-self: flex-end; }

        .wa-bubble {
            padding: 9px 12px 7px;
            border-radius: 12px;
            font-size: 0.8rem;
            color: #111b21;
            box-shadow: 0 1px 2px rgba(11, 20, 26, 0.12);
            position: relative;
            word-wrap: break-word;
        }
        .wa-msg-row.bot .wa-bubble {
            background: #ffffff;
            border-top-left-radius: 3px;
        }
        .wa-msg-row.user .wa-bubble {
            background: #d9fdd3;
            border-top-right-radius: 3px;
        }
        .wa-sender-tag {
            font-size: 0.65rem;
            font-weight: 800;
            color: #075e54;
            margin-bottom: 5px;
            display: block;
        }

        /* FORMAT PARAGRAF, POIN, DAN JUDUL AGAR RAPI TIDAK MENUMPUK */
        .wa-bubble .wa-para {
            margin: 0 0 10px 0;
            line-height: 1.6;
            font-size: 0.81rem;
            color: #111b21;
        }
        .wa-bubble .wa-para:last-child {
            margin-bottom: 2px;
        }
        .wa-bubble .wa-heading {
            font-size: 0.86rem;
            font-weight: 800;
            color: #075e54;
            margin: 10px 0 5px 0;
            line-height: 1.35;
        }
        .wa-msg-row.user .wa-bubble .wa-heading {
            color: #064e3b;
        }
        .wa-bubble .wa-ul, .wa-bubble .wa-ol {
            margin: 6px 0 10px 0;
            padding-left: 18px;
            font-size: 0.8rem;
            line-height: 1.55;
        }
        .wa-bubble li {
            margin-bottom: 5px;
        }
        .wa-bubble li:last-child {
            margin-bottom: 2px;
        }
        .wa-bubble .wa-blockquote {
            margin: 8px 0 10px;
            padding: 6px 10px;
            border-left: 3.5px solid #00a884;
            background: rgba(0, 168, 132, 0.08);
            border-radius: 0 8px 8px 0;
            font-style: italic;
            color: #334155;
            line-height: 1.5;
        }
        .wa-bubble .wa-code {
            background: rgba(0,0,0,0.06);
            padding: 1px 5px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.76rem;
            color: #b91c1c;
        }

        .wa-meta {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 3px;
            font-size: 0.58rem;
            color: #667781;
            margin-top: 4px;
        }
        .wa-ticks {
            color: #53bdeb;
            font-size: 0.72rem;
            font-weight: 800;
            line-height: 1;
        }

        /* TYPING INDICATOR */
        .wa-typing {
            align-self: flex-start;
            background: #ffffff;
            border-radius: 12px;
            border-top-left-radius: 3px;
            padding: 10px 14px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 1px 1.5px rgba(11, 20, 26, 0.13);
        }
        .wa-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #8696a0;
            animation: waBounce 1.2s infinite ease-in-out;
        }
        .wa-dot:nth-child(2) { animation-delay: 0.2s; }
        .wa-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes waBounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-5px); }
        }

        /* QUICK CHIPS BAR */
        .wa-chips-bar {
            background: #f0f2f5;
            padding: 6px 10px 4px;
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
            border-top: 1px solid #e2e8f0;
            flex-shrink: 0;
            z-index: 20;
        }
        .wa-chips-bar::-webkit-scrollbar { display: none; }
        .wa-chip {
            background: white;
            border: 1px solid #cbd5e1;
            color: #075e54;
            padding: 5px 11px;
            border-radius: 999px;
            font-size: 0.67rem;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.15s;
            font-family: inherit;
        }
        .wa-chip:hover { background: #ecfdf5; border-color: #10b981; }

        /* FOOTER INPUT BAR (SELALU TERKUNCI DI BAWAH) */
        .wa-footer {
            background: #f0f2f5;
            padding: 6px 10px;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            display: flex;
            align-items: flex-end;
            gap: 8px;
            flex-shrink: 0;
            border-top: 1px solid rgba(0,0,0,0.06);
            z-index: 20;
        }
        .wa-input-pill {
            flex: 1;
            background: white;
            border-radius: 22px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
            min-height: 40px;
        }
        .wa-textarea {
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            font-family: inherit;
            font-size: 0.82rem;
            line-height: 1.35;
            max-height: 90px;
            min-height: 20px;
            color: #111b21;
            background: transparent;
        }
        .wa-send-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: #00a884;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0, 168, 132, 0.35);
            transition: transform 0.15s, background 0.15s;
        }
        .wa-send-btn:active { transform: scale(0.92); }
        .wa-send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="mobile-app-wrapper wa-mode">

        <!-- HEADER ASISTEN PINTAR -->
        <header class="wa-header">
            <div class="wa-header-left">
                <a href="/mem-5k/index.html" class="wa-back-btn" title="Kembali ke Beranda Member 5K">
                    <i data-lucide="arrow-left" style="width:18px; height:18px;"></i>
                </a>
                <div class="wa-avatar">
                    <i data-lucide="user-round" style="width:20px; height:20px; color:#075e54;"></i>
                    <span class="wa-online-dot"></span>
                </div>
                <div style="min-width:0; flex:1;">
                    <div class="wa-title">Asisten Pintar</div>
                    <div class="wa-status" id="waStatusText">online &bull; Member 5K</div>
                </div>
            </div>
            <button type="button" class="wa-action-btn" onclick="clearAksaChat()" title="Bersihkan Obrolan">
                <i data-lucide="trash-2" style="width:16px; height:16px;"></i>
            </button>
        </header>

        <!-- CHAT BODY ROOM -->
        <div class="wa-chat-body" id="chatContainer">
            <div class="wa-date-pill">HARI INI</div>
        </div>

        <!-- QUICK PROMPT CHIPS -->
        <div class="wa-chips-bar">
            <button type="button" class="wa-chip" onclick="fillPrompt('Tolong cek kaidah EYD V pada kalimat ini: ')">
                <i data-lucide="spell-check" style="width:12px; height:12px;"></i> Cek EYD V
            </button>
            <button type="button" class="wa-chip" onclick="fillPrompt('Bantu aku buat diksi puitis dan majas untuk tema: ')">
                <i data-lucide="sparkles" style="width:12px; height:12px;"></i> Diksi Puitis
            </button>
            <button type="button" class="wa-chip" onclick="fillPrompt('Berikan ide pembuka cerpen yang menarik tentang: ')">
                <i data-lucide="book-open" style="width:12px; height:12px;"></i> Ide Cerpen
            </button>
            <button type="button" class="wa-chip" onclick="fillPrompt('Jelaskan materi majas dan kaidah ejaan bahasa!')">
                <i data-lucide="help-circle" style="width:12px; height:12px;"></i> Tanya Materi
            </button>
        </div>

        <!-- INPUT BAR (SELALU TERKUNCI DI BAWAH) -->
        <div class="wa-footer">
            <div class="wa-input-pill">
                <textarea id="chatInput" class="wa-textarea" rows="1" placeholder="Ketik pesan ke Asisten Pintar..." oninput="autoGrow(this)" onkeydown="handleKeyDown(event)"></textarea>
            </div>
            <button type="button" id="btnSendChat" class="wa-send-btn" onclick="submitMessage()" title="Kirim Pesan">
                <i data-lucide="send" style="width:17px; height:17px;"></i>
            </button>
        </div>

    </div>

    <script src="/mem-5k/central.js"></script>
    <script>
        const STORAGE_KEY_AKSABOT_5K = 'cendekia_5k_aksabot_chats';
        let chatHistory = [];
        let isSending = false;

        // FORMATTER CERDAS: MEMISAHKAN PARAGRAF & DAFTAR DENGAN SPASI RAPI
        function formatMessageHTML(text) {
            if (!text) return '';
            let s = String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

            s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            s = s.replace(/__(.+?)__/g, '<strong>$1</strong>');
            s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
            s = s.replace(/_(.+?)_/g, '<em>$1</em>');
            s = s.replace(/`([^`]+)`/g, '<code class="wa-code">$1</code>');

            const lines = s.split(/\r?\n/);
            let resultHtml = '';
            let currentList = null;
            let paragraphBuffer = [];

            const flushParagraph = () => {
                if (paragraphBuffer.length > 0) {
                    resultHtml += `<p class="wa-para">${paragraphBuffer.join('<br>')}</p>`;
                    paragraphBuffer = [];
                }
            };

            const closeList = () => {
                if (currentList) {
                    resultHtml += `</${currentList}>`;
                    currentList = null;
                }
            };

            lines.forEach(rawLine => {
                const line = rawLine.trim();

                if (!line) {
                    flushParagraph();
                    closeList();
                    return;
                }

                const headingMatch = line.match(/^#{1,4}\s+(.+)$/);
                if (headingMatch) {
                    flushParagraph();
                    closeList();
                    resultHtml += `<h4 class="wa-heading">${headingMatch[1]}</h4>`;
                    return;
                }

                const quoteMatch = line.match(/^>\s*(.+)$/);
                if (quoteMatch) {
                    flushParagraph();
                    closeList();
                    resultHtml += `<blockquote class="wa-blockquote">${quoteMatch[1]}</blockquote>`;
                    return;
                }

                const bulletMatch = line.match(/^[-*•]\s+(.+)$/);
                if (bulletMatch) {
                    flushParagraph();
                    if (currentList !== 'ul') {
                        closeList();
                        resultHtml += `<ul class="wa-ul">`;
                        currentList = 'ul';
                    }
                    resultHtml += `<li>${bulletMatch[1]}</li>`;
                    return;
                }

                const numMatch = line.match(/^(\d+)[\.\)]\s+(.+)$/);
                if (numMatch) {
                    flushParagraph();
                    if (currentList !== 'ol') {
                        closeList();
                        resultHtml += `<ol class="wa-ol">`;
                        currentList = 'ol';
                    }
                    resultHtml += `<li>${numMatch[2]}</li>`;
                    return;
                }

                closeList();
                paragraphBuffer.push(line);
            });

            flushParagraph();
            closeList();

            return resultHtml || `<p class="wa-para">${s}</p>`;
        }

        function nowTimeStr() {
            return new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        }

        function scrollToBottom() {
            const box = document.getElementById('chatContainer');
            if (box) box.scrollTop = box.scrollHeight;
        }

        function appendBubble(role, content, timeStr) {
            const box = document.getElementById('chatContainer');
            if (!box) return;

            const isUser = role === 'user';
            const row = document.createElement('div');
            row.className = `wa-msg-row ${isUser ? 'user' : 'bot'}`;

            row.innerHTML = `
                <div class="wa-bubble">
                    ${!isUser ? '<span class="wa-sender-tag">Asisten Pintar</span>' : ''}
                    ${formatMessageHTML(content)}
                    <div class="wa-meta">
                        <span>${timeStr || nowTimeStr()}</span>
                        ${isUser ? '<span class="wa-ticks">✓✓</span>' : ''}
                    </div>
                </div>
            `;
            box.appendChild(row);
            scrollToBottom();
        }

        function renderWelcomeGreeting() {
            const user = CendekiaApp.getUser();
            const firstName = (user.name || 'Teman').split(' ')[0];
            appendBubble(
                'assistant',
                `Halo ${firstName}! Aku **Asisten Pintar** pribadimu di Member 5K ✨\n\nTanya apa saja santai seputar literasi:\n- Bedah ejaan EYD V & kalimat efektif\n- Cari diksi puitis, majas, & ide cerpen/puisi\n- Diskusi materi kurikulum membaca & menulis\n\nAda ide tulisan atau materi yang ingin kamu bahas hari ini?`,
                nowTimeStr()
            );
        }

        function loadChatHistory() {
            const box = document.getElementById('chatContainer');
            box.innerHTML = '<div class="wa-date-pill">HARI INI</div>';
            try {
                const raw = localStorage.getItem(STORAGE_KEY_AKSABOT_5K);
                chatHistory = raw ? JSON.parse(raw) : [];
            } catch (e) {
                chatHistory = [];
            }

            if (chatHistory.length === 0) {
                renderWelcomeGreeting();
            } else {
                chatHistory.forEach(item => appendBubble(item.role, item.content, item.time));
            }
            if (window.lucide) lucide.createIcons();
        }

        function saveChatHistory() {
            try {
                if (chatHistory.length > 40) chatHistory = chatHistory.slice(-40);
                localStorage.setItem(STORAGE_KEY_AKSABOT_5K, JSON.stringify(chatHistory));
            } catch (e) {}
        }

        function autoGrow(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(90, el.scrollHeight) + 'px';
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                submitMessage();
            }
        }

        function fillPrompt(txt) {
            const inp = document.getElementById('chatInput');
            inp.value = txt;
            inp.focus();
            autoGrow(inp);
        }

        function clearAksaChat() {
            Swal.fire({
                title: 'Bersihkan Obrolan?',
                text: 'Riwayat chat dengan Asisten Pintar akan dimulai dari awal.',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#075e54',
                confirmButtonText: 'Ya, Bersihkan',
                cancelButtonText: 'Batal'
            }).then((res) => {
                if (res.isConfirmed) {
                    chatHistory = [];
                    localStorage.removeItem(STORAGE_KEY_AKSABOT_5K);
                    loadChatHistory();
                }
            });
        }

        async function submitMessage() {
            if (isSending) return;
            const inp = document.getElementById('chatInput');
            const message = inp.value.trim();
            if (!message) return;

            isSending = true;
            inp.value = '';
            inp.style.height = 'auto';
            document.getElementById('btnSendChat').disabled = true;

            const statusEl = document.getElementById('waStatusText');
            if (statusEl) statusEl.textContent = 'mengetik...';

            const tNow = nowTimeStr();
            appendBubble('user', message, tNow);
            chatHistory.push({ role: 'user', content: message, time: tNow });
            saveChatHistory();

            const box = document.getElementById('chatContainer');
            const typing = document.createElement('div');
            typing.id = 'waTypingBubble';
            typing.className = 'wa-typing';
            typing.innerHTML = '<span class="wa-dot"></span><span class="wa-dot"></span><span class="wa-dot"></span>';
            box.appendChild(typing);
            scrollToBottom();

            try {
                const context = chatHistory.slice(-8).map(h => ({ role: h.role, content: h.content }));
                const result = await CendekiaApp.askAksaBotAI(message, context);
                const reply = result?.reply || 'Halo! Asisten Pintar siap membantumu. Coba tanyakan kembali ya!';

                const tBubble = document.getElementById('waTypingBubble');
                if (tBubble) tBubble.remove();

                const aiTime = nowTimeStr();
                appendBubble('assistant', reply, aiTime);
                chatHistory.push({ role: 'assistant', content: reply, time: aiTime });
                saveChatHistory();

                CendekiaApp.logActivity('Tanya Asisten Pintar', 'user-round', 'chat');
            } catch (err) {
                const tBubble = document.getElementById('waTypingBubble');
                if (tBubble) tBubble.remove();
                appendBubble('assistant', 'Maaf, jaringan sedang sibuk. Silakan coba kirim pesan lagi dalam sesaat ya! 🙏', nowTimeStr());
            } finally {
                isSending = false;
                document.getElementById('btnSendChat').disabled = false;
                if (statusEl) statusEl.textContent = 'online • Member 5K';
                inp.focus();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadChatHistory();
            if (window.lucide) lucide.createIcons();
        });
    </script>
</body>
</html>
