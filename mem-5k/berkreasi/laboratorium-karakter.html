<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Laboratorium Karakter - Member 5K Cendekia</title>
    
    <link rel="icon" type="image/png" sizes="512x512" href="https://i.imgur.com/5Srjyo4.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/mem-5k/central.css">

    <style>
        .char-form-group {
            margin-bottom: 10px; text-align: left;
        }
        .char-form-group label {
            display: block; font-size: 0.68rem; font-weight: 700; color: var(--text-muted); margin-bottom: 4px;
        }
        .char-input {
            width: 100%; border: 1.5px solid var(--border-soft); border-radius: var(--radius-sm);
            padding: 8px 10px; font-size: 0.78rem; font-family: inherit; outline: none; background: #ffffff;
        }
    </style>
</head>
<body>

    <div class="mobile-app-wrapper">

        <header class="app-header">
            <div style="display:flex; align-items:center; gap:10px;">
                <a href="/mem-5k/berkreasi.html" class="btn-header-back" title="Kembali">
                    <i data-lucide="arrow-left" style="width:18px; height:18px;"></i>
                </a>
                <div>
                    <h1 class="header-brand-title" style="display:flex; align-items:center; gap:6px;">
                        <i data-lucide="users" style="width:18px; height:18px; color:var(--purple);"></i> Lab Karakter
                    </h1>
                    <div class="header-brand-sub">Bedah Dimensi Watak Tokoh</div>
                </div>
            </div>
            <button type="button" class="btn-modal-secondary" style="padding:4px 10px; font-size:0.68rem;" onclick="randomizeCharacter()">
                <i data-lucide="sparkles" style="width:12px; height:12px; display:inline-block; vertical-align:middle;"></i> Acak
            </button>
        </header>

        <main class="app-body">

            <div style="background:white; border-radius:var(--radius-md); padding:16px; border:1px solid var(--border-soft); box-shadow:var(--shadow-sm);">
                <div class="char-form-group">
                    <label>Nama Karakter:</label>
                    <input type="text" id="cName" class="char-input" value="Raka Danapati">
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                    <div class="char-form-group">
                        <label>Usia &amp; Profesi:</label>
                        <input type="text" id="cRole" class="char-input" value="28 Tahun / Pemulung Arsip">
                    </div>
                    <div class="char-form-group">
                        <label>Ciri Fisik Khas:</label>
                        <input type="text" id="cTrait" class="char-input" value="Bekas luka bakar di lengan kanan">
                    </div>
                </div>

                <div class="char-form-group">
                    <label>Ambisi Lahiriah (Want):</label>
                    <input type="text" id="cWant" class="char-input" value="Mencari buku harian ayahnya yang hilang di stasiun tua">
                </div>

                <div class="char-form-group">
                    <label>Kebutuhan Batiniah (Need):</label>
                    <input type="text" id="cNeed" class="char-input" value="Belajar memaafkan dirinya sendiri atas masa lalu">
                </div>

                <div class="char-form-group">
                    <label>Kelemahan Fatal (Flaw):</label>
                    <input type="text" id="cFlaw" class="char-input" value="Sangat sukar mempercayai orang lain dan keras kepala">
                </div>

                <button type="button" class="btn-primary-challenge" style="width:100%; margin-top:8px;" onclick="saveCharacter()">
                    <i data-lucide="save" style="width:14px; height:14px;"></i> Simpan Lembar Karakter ke Arsip
                </button>
            </div>

            <div class="app-footer-copyright">
                &copy; 2026 PT Cendekia Aksara Edukasi. Seluruh Hak Cipta Dilindungi.
            </div>

        </main>

    </div>

    <script src="/mem-5k/central.js"></script>
    <script>
        const randomNames = ["Kirana Larasati", "Teguh Wicaksana", "Senja Lestari", "Genta Pratama"];
        const randomRoles = ["Pustakawan Malam", "Restorator Lukisan", "Wartawan Lepas", "Mekanik Jam Antik"];
        const randomFlaws = ["Takut pada ruang gelap", "Terlalu naif mempercayai janji", "Sering menunda keputusan penting"];

        function randomizeCharacter() {
            document.getElementById('cName').value = randomNames[Math.floor(Math.random() * randomNames.length)];
            document.getElementById('cRole').value = randomRoles[Math.floor(Math.random() * randomRoles.length)];
            document.getElementById('cFlaw').value = randomFlaws[Math.floor(Math.random() * randomFlaws.length)];
        }

        function saveCharacter() {
            const name = document.getElementById('cName').value.trim() || 'Tokoh Baru';
            const role = document.getElementById('cRole').value.trim();
            const want = document.getElementById('cWant').value.trim();

            const text = `Profil Karakter: ${name}\nProfesi: ${role}\nAmbisi: ${want}`;
            CendekiaApp.saveIdea({
                title: 'Karakter: ' + name,
                content: text,
                category: 'Laboratorium Karakter'
            });
            alert('Karakter berhasil disimpan ke Arsip Ide!');
        }

        document.addEventListener('DOMContentLoaded', () => {
            CendekiaApp.renderBottomNav('beranda');
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const incomingChar = urlParams.get('char');
                if (incomingChar) {
                    document.getElementById('cName').value = incomingChar;
                }
            } catch (_) {}
        });
    </script>
</body>
</html>
