<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Biodata & Kontrol Siswa - Cendekia Aksara</title>
    
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Aleo:wght@700&family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <style>
        /* --- 1. GLOBAL & RESET --- */
        :root { 
            --nav-bg: #001f3f;       /* Navy Sangat Gelap (Admin) */
            --nav-border: #11998e;   /* Hijau Emerald (Admin) */
            --primary: #003366; 
            --accent: #11998e;
            --accent-dark: #0f766e;
            --bg-color: #f4f7f6; 
            --text-dark: #1e293b; 
            --text-gray: #64748b;
            --danger: #dc2626; 
            --warning: #ea580c; 
            --gold: #d4af37;
        }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent;}
        
        body { 
            font-family: 'Poppins', sans-serif; background-color: var(--bg-color); 
            margin: 0; color: var(--text-dark); padding-bottom: 50px; padding-top: 80px; 
        }
        .container { max-width: 1400px; width: 95%; margin: 0 auto; padding: 15px; position: relative;}

        /* --- 2. FIXED NAVBAR --- */
        .top-navbar {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
            background: var(--nav-bg); border-bottom: 3px solid var(--nav-border);
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 20px; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .nav-brand { display: flex; align-items: center; gap: 12px; }
        .nav-brand img { 
            width: 40px; height: 40px; border-radius: 50%; 
            background: white; padding: 2px; border: 2px solid var(--nav-border);
        }
        .nav-brand h1 { 
            font-family: 'Aleo', serif; font-size: 1.3rem; 
            color: white; margin: 0; font-weight: 700; letter-spacing: 0.5px;
        }

        .btn-back-nav {
            background: rgba(255,255,255,0.1); color: white; text-decoration: none;
            padding: 8px 16px; border-radius: 50px; font-weight: 600; font-size: 0.85rem;
            transition: 0.3s; display: inline-flex; align-items: center; gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .btn-back-nav:hover { background: var(--nav-border); color: white; }

        /* --- 3. HERO BANNER --- */
        .hero-banner {
            background: linear-gradient(135deg, #001f3f 0%, #003366 100%);
            border-radius: 16px; padding: 25px; color: white;
            display: flex; flex-direction: column; justify-content: center;
            box-shadow: 0 10px 20px rgba(0, 31, 63, 0.15);
            margin-bottom: 25px; position: relative; overflow: hidden;
        }
        .hero-banner::after {
            content: '\f2c2'; font-family: "Font Awesome 6 Free"; font-weight: 900;
            position: absolute; right: -10px; top: -20px; font-size: 8rem;
            color: rgba(17, 153, 142, 0.1); transform: rotate(-15deg); pointer-events: none;
        }
        .hero-title { font-size: 1.5rem; font-weight: 700; margin: 0 0 5px 0; color: #5eead4; z-index: 2; display: flex; align-items: center; gap: 10px;}
        .hero-subtitle { font-size: 0.9rem; color: #cbd5e1; margin: 0; z-index: 2; line-height: 1.5;}

        /* --- 4. KONTROL PENCARIAN --- */
        .control-panel {
            background: white; padding: 20px; border-radius: 16px; margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid #e2e8f0;
        }
        .search-wrapper { position: relative; width: 100%; max-width: 600px;}
        .search-wrapper i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
        .control-panel input {
            width: 100%; padding: 14px 15px 14px 40px; border: 2px solid #e2e8f0; border-radius: 10px; 
            font-family: 'Poppins'; font-size: 0.95rem; outline: none; transition: 0.3s; 
            color: var(--text-dark); background: #f8fafc;
        }
        .control-panel input:focus { border-color: var(--accent); background: white; box-shadow: 0 0 0 3px rgba(17, 153, 142, 0.15);}

        /* --- 5. GRID & KARTU BIODATA --- */
        .student-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
            gap: 20px; align-items: start;
        }

        .biodata-card {
            background: white; padding: 20px; border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            border: 1px solid #e2e8f0; border-left: 6px solid var(--accent);
            display: flex; flex-direction: column; gap: 15px;
            transition: transform 0.2s, box-shadow 0.2s; position: relative; overflow: hidden;
        }
        .biodata-card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.08); }
        
        /* Pewarnaan Status Khusus */
        .biodata-card.is-osis { border-left-color: var(--gold); }
        .biodata-card.is-osis::before { content: '\f3ed'; font-family: 'Font Awesome 6 Free'; font-weight: 900; position: absolute; top: -10px; right: -10px; font-size: 5rem; color: var(--gold); opacity: 0.05; pointer-events: none;}
        .biodata-card.suspended { border-left-color: var(--warning); background: #fff8f0; }
        .biodata-card.inactive { border-left-color: var(--danger); background: #fef2f2; border: 2px solid #fca5a5; border-left: 6px solid var(--danger); }
        .biodata-card.status-cuti { border-left-color: #3b82f6; background: #eff6ff; }
        .biodata-card.status-withdrawal { border-left-color: #f97316; background: #fff7ed; }
        .biodata-card.status-dropout { border-left-color: #dc2626; background: #fef2f2; }

        /* --- 6. BAGIAN PROFIL DALAM KARTU --- */
        .profile-section {
            display: flex; gap: 15px; align-items: flex-start;
        }
        .profile-photo {
            width: 90px; height: 120px; flex-shrink: 0;
            border-radius: 8px; overflow: hidden;
            border: 2px solid #e2e8f0; background: #f1f5f9;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .profile-photo img { width: 100%; height: 100%; object-fit: cover; }
        
        .profile-basic { flex: 1; display: flex; flex-direction: column; gap: 6px;}
        .profile-basic h3 { margin: 0; color: #1e293b; font-size: 1.2rem; font-family: 'Aleo', serif; line-height: 1.2;}
        
        /* Tombol Kontak Cepat */
        .contact-btns { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap;}
        .btn-contact { padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; color: white; transition: 0.2s;}
        .btn-contact.wa { background: #25D366; }
        .btn-contact.wa:hover { background: #16a34a; }
        .btn-contact.mail { background: #3b82f6; }
        .btn-contact.mail:hover { background: #2563eb; }

        /* Badges & Status */
        .badges-wrapper { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px;}
        .status-label { font-weight: 700; font-size: 0.7rem; padding: 4px 8px; border-radius: 4px; letter-spacing: 0.5px; }
        .status-active { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0;}
        .status-suspend { background: #fef08a; color: #9a3412; border: 1px solid #fde68a;}
        .status-inactive { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5;}
        .status-cuti-badge { background: #dbeafe; color: #1e40af; }
        .status-withdrawal-badge { background: #fed7aa; color: #92400e; }
        .status-dropout-badge { background: #fecaca; color: #7f1d1d; }
        .badge-osis { background: linear-gradient(135deg, #d4af37, #f59e0b); color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; box-shadow: 0 2px 4px rgba(212,175,55,0.3); }

        /* --- 7. BAGIAN DETAIL BIODATA --- */
        .profile-details {
            background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0;
            font-size: 0.85rem; color: #475569; display: flex; flex-direction: column; gap: 6px;
        }
        .profile-details p { margin: 0; display: flex; align-items: flex-start; gap: 8px;}
        .profile-details p i { width: 15px; color: var(--accent); margin-top: 3px;}
        .profile-details strong { color: var(--text-dark); min-width: 65px; display: inline-block;}
        .bio-text { font-style: italic; color: #64748b; border-left: 2px solid #cbd5e1; padding-left: 8px; margin-top: 4px; max-height: 55px; overflow-y: auto; scrollbar-width: thin;}
        
        .divider { height: 1px; background: #cbd5e1; margin: 5px 0; border: none;}

        /* Kotak Peringatan */
        .status-warning-box {
            background: linear-gradient(135deg, rgba(255,255,255,0.8), rgba(255,255,255,0.6));
            border-left: 4px solid; padding: 10px 12px; border-radius: 6px;
            display: flex; gap: 10px; align-items: center; z-index: 2; position: relative;
        }
        .status-warning-box.cuti { border-left-color: #3b82f6; background: #eff6ff; }
        .status-warning-box.withdrawal { border-left-color: #f97316; background: #fff7ed; }
        .status-warning-box.dropout { border-left-color: #dc2626; background: #fef2f2; }
        .status-warning-box i { font-size: 1.2rem; }
        .status-warning-box.cuti i { color: #3b82f6; }
        .status-warning-box.withdrawal i { color: #f97316; }
        .status-warning-box.dropout i { color: #dc2626; }
        .status-warning-text { font-size: 0.8rem; font-weight: 500; line-height: 1.4; color: var(--text-dark);}

        /* --- 8. TOMBOL AKSI ADMIN --- */
        .admin-actions { display: flex; gap: 8px; margin-top: auto; z-index: 2; position: relative; flex-wrap: wrap;}
        .btn-admin { 
            flex: 1; min-width: 100px; border: none; padding: 8px; border-radius: 6px; cursor: pointer; 
            color: white; font-weight: 600; font-size: 0.8rem; display: flex; align-items: center; 
            justify-content: center; gap: 5px; transition: 0.2s; font-family: 'Poppins';
        }
        .btn-admin:active { transform: scale(0.95); }
        .btn-suspend { background: var(--warning); }
        .btn-suspend:hover { background: #c2410c; }
        .btn-activate { background: var(--accent); }
        .btn-activate:hover { background: var(--accent-dark); }
        .btn-delete { background: white; color: var(--danger); border: 1px solid #fca5a5; }
        .btn-delete:hover { background: var(--danger); color: white; }

        .btn-lantik-osis { background: #f1f5f9; color: #64748b; border: 1px solid #cbd5e1; }
        .btn-lantik-osis:hover { background: #e2e8f0; color: #334155; }
        .btn-cabut-osis { background: var(--gold); color: white; box-shadow: 0 2px 5px rgba(212,175,55,0.3); border: 1px solid #c5a02e;}
        .btn-cabut-osis:hover { filter: brightness(1.1); }

        /* LOADING */
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--nav-bg); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; transition: 0.4s; }

        @media (max-width: 768px) {
            .student-grid { grid-template-columns: 1fr; }
            .nav-brand h1 { font-size: 1.1rem; }
            .btn-back-nav span { display: none; }
            .hero-title { font-size: 1.3rem; }
            .profile-photo { width: 80px; height: 106px; } /* 3x4 ratio */
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <i class="fa-solid fa-id-card-clip fa-bounce" style="font-size: 3rem; margin-bottom: 20px; color: var(--accent);"></i>
        <h3 style="font-family: 'Poppins', sans-serif; font-size: 1.1rem; font-weight: 400; color: #cbd5e1; margin: 0;">Membuka Database Siswa...</h3>
    </div>

    <!-- NAVBAR FIXED -->
    <header class="top-navbar">
        <div class="nav-brand">
            <img src="https://i.imgur.com/5Srjyo4.png" alt="Logo">
            <h1>Panel Administrator</h1>
        </div>
        <a href="index.html" class="btn-back-nav">
            <i class="fa-solid fa-arrow-left"></i> <span>Dasbor Utama</span>
        </a>
    </header>

    <main class="container" style="display: none;" id="main-content">
        
        <!-- HERO BANNER -->
        <div class="hero-banner">
            <h2 class="hero-title"><i class="fa-solid fa-id-card-clip"></i> Biodata & Kontrol Siswa</h2>
            <p class="hero-subtitle">Kelola status keaktifan, pantau informasi detail profil, dan hubungi siswa dalam keadaan darurat.</p>
        </div>

        <div class="control-panel">
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search" placeholder="Cari nama, email, atau nomor HP siswa..." oninput="window.searchSiswa()" autocomplete="off">
            </div>
        </div>

        <div id="student-grid" class="student-grid">
            <!-- Loading Grid -->
            <div style="grid-column: 1/-1; text-align: center; padding: 50px; color: #666; background: white; border-radius: 12px; border: 1px dashed #cbd5e1;">
                <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 3rem; color: var(--accent);"></i>
                <p style="margin-top: 15px; font-weight:500;">Menyelaraskan data siswa...</p>
            </div>
        </div>

    </main>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0", 
            authDomain: "mading-cf676.firebaseapp.com", 
            projectId: "mading-cf676", 
            storageBucket: "mading-cf676.firebasestorage.app", 
            messagingSenderId: "72175203671", 
            appId: "1:72175203671:web:7a0676a55beb64bc96ba12" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let allStudents = [];

        onAuthStateChanged(auth, async (user) => {
            if (!user) await signInAnonymously(auth);
            
            document.getElementById('loading-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                loadData();
            }, 400);
        });

        async function loadData() {
            try {
                const q = query(collection(db, 'users'), where('role', '==', 'siswa'));
                const snap = await getDocs(q);
                allStudents = [];
                snap.forEach(d => allStudents.push({id: d.id, ...d.data()}));
                
                allStudents.sort((a,b) => (a.name || "").localeCompare(b.name || ""));
                
                render(allStudents);
            } catch(e) {
                document.getElementById('student-grid').innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #ef4444; padding: 20px; background: white; border-radius: 12px;">Gagal memuat data dari server.</div>';
            }
        }

        window.searchSiswa = () => {
            const key = document.getElementById('search').value.toLowerCase();
            const filtered = allStudents.filter(s => 
                (s.name && s.name.toLowerCase().includes(key)) || 
                (s.email && s.email.toLowerCase().includes(key)) ||
                (s.noHp && s.noHp.toLowerCase().includes(key))
            );
            render(filtered);
        };

        function escapeString(str) {
            if (!str) return "";
            return str.replace(/'/g, "\\'").replace(/"/g, "&quot;");
        }

        function getStatusWarning(status) {
            switch(status) {
                case 'cuti':
                    return { badgeClass: 'status-cuti-badge', badgeText: '🔵 SEDANG CUTI', warningClass: 'cuti', icon: 'fa-hourglass-end', title: 'Siswa Sedang Cuti', message: 'Tidak dapat mengakses sistem pembelajaran.' };
                case 'mengundurkan_diri':
                    return { badgeClass: 'status-withdrawal-badge', badgeText: '🔶 MENGUNDURKAN DIRI', warningClass: 'withdrawal', icon: 'fa-person-hiking', title: 'Mengundurkan Diri', message: 'Akun telah dikunci karena pengunduran diri.' };
                case 'dropout':
                    return { badgeClass: 'status-dropout-badge', badgeText: '❌ DROPOUT', warningClass: 'dropout', icon: 'fa-ban', title: 'Siswa Dropout', message: 'Ditetapkan dropout, tidak terdaftar aktif.' };
                default:
                    return null;
            }
        }

        function render(list) {
            const container = document.getElementById('student-grid');
            container.innerHTML = '';
            
            if(list.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; color: #888; padding: 60px; background:white; border-radius:12px; border:2px dashed #cbd5e1;">
                        <i class="fa-regular fa-folder-open" style="font-size: 4rem; margin-bottom: 15px; color:#e2e8f0;"></i>
                        <h3 style="margin:0; color:#64748b;">Tidak ada data yang cocok</h3>
                    </div>`; 
                return;
            }

            let htmlBuffer = '';

            list.forEach(s => {
                // 1. MENGHITUNG TUGAS SELESAI
                let totalTugasTerisi = 0;
                for(let i=1; i<=8; i++) {
                    if (s[`nilai_t${i}`] !== undefined && s[`nilai_t${i}`] !== null && s[`nilai_t${i}`] !== "") totalTugasTerisi++;
                }
                if (s.nilai_uts !== undefined && s.nilai_uts !== null && s.nilai_uts !== "") totalTugasTerisi++;
                if (s.nilai_uas !== undefined && s.nilai_uas !== null && s.nilai_uas !== "") totalTugasTerisi++;

                const isInactive = totalTugasTerisi < 5; 
                const isSuspended = s.status === 'suspended';
                const isOsis = s.is_osis === true;

                // 2. MENGHITUNG HARI TERAKHIR AKTIF
                const timeFields = [s.updatedAt, s.timestamp, s.lastLogin, s.last_login, s.lastActive, s.createdAt, s.waktuDaftar];
                let newestTime = 0;
                const now = new Date().getTime();

                timeFields.forEach(field => {
                    if (field) {
                        let t = 0;
                        if (typeof field === 'object') {
                            if (typeof field.toDate === 'function') t = field.toDate().getTime();
                            else if (field.seconds) t = field.seconds * 1000;
                        } else if (typeof field === 'string') {
                            t = new Date(field).getTime();
                            if (isNaN(t)) {
                                const parts = field.split(/[-/]/);
                                if (parts.length === 3 && parts[0].length <= 2) {
                                    t = new Date(`${parts[2]}-${parts[1]}-${parts[0]}T00:00:00`).getTime();
                                }
                            }
                        } else if (typeof field === 'number') {
                            t = field > 9999999999 ? field : field * 1000;
                        }
                        
                        if (!isNaN(t) && t > newestTime && t <= now + 86400000) newestTime = t;
                    }
                });

                let lastActiveDate = newestTime > 0 ? new Date(newestTime) : new Date();
                const diffTime = Math.abs(new Date() - lastActiveDate);
                const inactiveDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                let lastActiveText = inactiveDays === 0 ? "Hari ini" : (inactiveDays === 1 ? "Kemarin" : `${inactiveDays} hari lalu`);
                
                // 3. REKOMENDASI DETEKSI AKUN MATI
                let recommendationHtml = '';
                let forceShowDeleteBtn = false;

                if (inactiveDays >= 90) {
                    forceShowDeleteBtn = true; 
                    if (totalTugasTerisi === 0) {
                         recommendationHtml = `
                            <div class="status-warning-box dropout">
                                <i class="fa-solid fa-ghost"></i>
                                <div class="status-warning-text"><strong>Akun Bodong / Pasif Total</strong><br>0 Tugas & Mati ${inactiveDays} hari. Rekomendasi: Hapus.</div>
                            </div>`;
                    } else {
                         recommendationHtml = `
                            <div class="status-warning-box dropout">
                                <i class="fa-solid fa-skull-crossbones"></i>
                                <div class="status-warning-text"><strong>Akun Mati Kritis</strong><br>Selesai ${totalTugasTerisi} Tugas, mati ${inactiveDays} hari. Rekomendasi: Hapus.</div>
                            </div>`;
                    }
                } else if (inactiveDays >= 75) {
                     recommendationHtml = `
                        <div class="status-warning-box withdrawal">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                            <div class="status-warning-text"><strong>Peringatan Pasif</strong><br>Menghilang ${inactiveDays} hari. Mendekati batas kritis 90 hari.</div>
                        </div>`;
                }

                // 4. PEMBENTUKAN TAMPILAN KARTU
                const specialStatus = s.status;
                const statusWarning = getStatusWarning(specialStatus);

                let cardClass = 'biodata-card';
                if (isOsis) cardClass += ' is-osis';
                if (statusWarning) cardClass += ` status-${specialStatus === 'mengundurkan_diri' ? 'withdrawal' : specialStatus}`;

                let statusHtml = `<span class="status-label status-active">AKTIF</span>`;
                if (statusWarning) {
                    statusHtml = `<span class="status-label ${statusWarning.badgeClass}">${statusWarning.badgeText}</span>`;
                } else if (isSuspended) {
                    cardClass += ' suspended';
                    statusHtml = `<span class="status-label status-suspend">DIBEKUKAN</span>`;
                } else if (isInactive) {
                    cardClass += ' inactive';
                    statusHtml = `<span class="status-label status-inactive"><i class="fa-solid fa-triangle-exclamation"></i> PASIF (< 5 Tugas)</span>`;
                }
                
                let osisBadgeHtml = isOsis ? `<span class="badge-osis"><i class="fa-solid fa-shield-halved"></i> OSIS</span>` : '';
                const safeName = escapeString(s.name);

                let warningBoxHtml = '';
                if (statusWarning) {
                    warningBoxHtml = `
                        <div class="status-warning-box ${statusWarning.warningClass}">
                            <i class="fa-solid ${statusWarning.icon}"></i>
                            <div class="status-warning-text"><strong>${statusWarning.title}</strong><br>${statusWarning.message}</div>
                        </div>`;
                }

                const finalWarningHtml = warningBoxHtml + recommendationHtml;

                // Siapkan Data Profil Siswa Lengkap
                const noWA = s.noHp || s.phone || s.whatsapp || "";
                let waClean = noWA.replace(/\D/g, ''); 
                if (waClean.startsWith('08')) waClean = '628' + waClean.substring(2);
                const waLink = waClean.length >= 9 ? `https://wa.me/${waClean}` : '#';
                const waDisabled = waClean.length < 9 ? 'style="opacity:0.5; pointer-events:none;"' : '';

                const emailLink = s.email ? `mailto:${s.email}` : '#';

                const photoSrc = s.photoURL ? s.photoURL : `https://ui-avatars.com/api/?name=${encodeURIComponent(s.name || 'Siswa')}&background=003366&color=fff&size=200`;
                const dob = s.tanggalLahir || '-';
                const alamat = s.alamat || '-';
                const bio = s.bioSingkat || 'Tidak ada bio.';

                // Tombol Admin
                const suspendBtn = isSuspended 
                    ? `<button onclick="window.toggleSuspend('${s.id}', false, '${safeName}')" class="btn-admin btn-activate"><i class="fa-solid fa-check"></i> Aktifkan</button>`
                    : `<button onclick="window.toggleSuspend('${s.id}', true, '${safeName}')" class="btn-admin btn-suspend"><i class="fa-solid fa-ban"></i> Bekukan</button>`;

                const deleteBtn = isInactive || isSuspended || statusWarning || forceShowDeleteBtn
                    ? `<button onclick="window.deleteSiswa('${s.id}', '${safeName}')" class="btn-admin btn-delete"><i class="fa-solid fa-trash-can"></i> Hapus</button>`
                    : '';

                const osisBtn = isOsis
                    ? `<button onclick="window.toggleOsis('${s.id}', false, '${safeName}')" class="btn-admin btn-cabut-osis"><i class="fa-solid fa-user-minus"></i> Cabut OSIS</button>`
                    : `<button onclick="window.toggleOsis('${s.id}', true, '${safeName}')" class="btn-admin btn-lantik-osis"><i class="fa-solid fa-user-tie"></i> Lantik OSIS</button>`;

                htmlBuffer += `
                    <div class="${cardClass}">
                        ${finalWarningHtml}
                        
                        <div class="profile-section">
                            <div class="profile-photo">
                                <img src="${photoSrc}" alt="Foto ${safeName}" loading="lazy">
                            </div>
                            <div class="profile-basic">
                                <h3>${s.name}</h3>
                                <div class="badges-wrapper">${osisBadgeHtml} ${statusHtml}</div>
                                <div class="contact-btns">
                                    <a href="${waLink}" target="_blank" class="btn-contact wa" ${waDisabled}><i class="fa-brands fa-whatsapp"></i> Chat WA</a>
                                    <a href="${emailLink}" class="btn-contact mail"><i class="fa-regular fa-envelope"></i> Email</a>
                                </div>
                            </div>
                        </div>

                        <div class="profile-details">
                            <p><i><i class="fa-solid fa-graduation-cap"></i></i> <strong>Semester:</strong> ${s.semester || 1} &nbsp;|&nbsp; <strong>IPS:</strong> ${parseFloat(s.ips||0).toFixed(2)}</p>
                            <p><i><i class="fa-solid fa-phone"></i></i> <strong>No. HP:</strong> ${noWA || '-'}</p>
                            <p><i><i class="fa-solid fa-cake-candles"></i></i> <strong>Lahir:</strong> ${dob}</p>
                            <p><i><i class="fa-solid fa-location-dot"></i></i> <strong>Alamat:</strong> ${alamat}</p>
                            <div class="bio-text">"${bio}"</div>
                            <hr class="divider">
                            <p><i><i class="fa-solid fa-list-check"></i></i> <strong>Tugas:</strong> <b>${totalTugasTerisi} / 10 Selesai</b></p>
                            <p><i><i class="fa-solid fa-stopwatch"></i></i> <strong>Aktif:</strong> <b style="color: ${inactiveDays >= 75 ? '#dc2626' : '#1e293b'}">${lastActiveText}</b></p>
                        </div>
                        
                        <div class="admin-actions">
                            ${osisBtn}
                            ${suspendBtn}
                            ${deleteBtn}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = htmlBuffer;
        }

        // ==========================================
        // FUNGSI AKSI ADMIN MENGGUNAKAN SWEETALERT2
        // ==========================================
        window.toggleOsis = (id, isPromoting, name) => {
            const pesan = isPromoting 
                ? `Anak ini akan mendapatkan akses eksklusif ke Ruang Markas OSIS.` 
                : `Akses Ruang OSIS anak ini akan dicabut secara permanen.`;
            
            Swal.fire({
                title: isPromoting ? `Lantik ${name} jadi OSIS?` : `Cabut Jabatan ${name}?`,
                text: pesan,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#003366',
                cancelButtonColor: '#94a3b8',
                confirmButtonText: 'Ya, Lanjutkan!',
                cancelButtonText: 'Batal'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                        await updateDoc(doc(db, 'users', id), { is_osis: isPromoting });
                        loadData(); 
                        Swal.fire('Berhasil!', `Status kepengurusan OSIS untuk ${name} diperbarui.`, 'success');
                    } catch(e) { Swal.fire('Error', e.message, 'error'); }
                }
            });
        };

        window.toggleSuspend = (id, shouldSuspend, name) => {
            const text = shouldSuspend ? `Anda akan membekukan akses login dan sistem untuk ${name}.` : `Akses akun ${name} akan diaktifkan kembali.`;
            
            Swal.fire({
                title: 'Konfirmasi Akses',
                text: text,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: shouldSuspend ? '#ea580c' : '#11998e',
                cancelButtonColor: '#94a3b8',
                confirmButtonText: shouldSuspend ? 'Ya, Bekukan!' : 'Ya, Aktifkan!',
            }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                        await updateDoc(doc(db, 'users', id), { status: shouldSuspend ? 'suspended' : 'active' });
                        loadData(); 
                        Swal.fire('Berhasil!', `Status akun ${name} berhasil diperbarui.`, 'success');
                    } catch(e) { Swal.fire('Error', e.message, 'error'); }
                }
            });
        };

        window.deleteSiswa = (id, name) => {
            Swal.fire({
                title: 'Hapus Permanen?',
                text: `Anda akan membumihanguskan data profil, foto, dan nilai siswa "${name}" dari sistem secara permanen. Aksi ini tidak dapat dibatalkan!`,
                icon: 'error',
                showCancelButton: true,
                confirmButtonColor: '#dc2626',
                cancelButtonColor: '#94a3b8',
                confirmButtonText: 'Ya, Hapus Permanen!',
            }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                        await deleteDoc(doc(db, 'users', id));
                        loadData();
                        Swal.fire('Terhapus!', `Data siswa ${name} telah dihapus permanen.`, 'success');
                    } catch(e) { Swal.fire('Error', e.message, 'error'); }
                }
            }); 
        };
    </script>
</body>
</html>
