<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pendaftaran Lisensi - Cendekia Aksara</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Aleo:wght@700&family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root { --primary: #003366; --gold: #d4af37; --bg-color: #f1f5f9; --text-dark: #1e293b; --text-gray: #64748b; }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-color); color: var(--text-dark); margin: 0; padding-top: 70px; min-height: 100vh; }
        .app-wrapper { width: 100%; max-width: 700px; margin: 0 auto; background-color: white; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); overflow: hidden; }
        
        .top-navbar { position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; background: #001f3f; display: flex; align-items: center; padding: 15px 20px; border-bottom: 2px solid var(--gold); box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .nav-title { font-family: 'Aleo', serif; font-size: 1.2rem; color: white; margin: 0 0 0 15px; }
        .btn-back { color: white; font-size: 1.2rem; text-decoration: none; }

        .header-banner { background: linear-gradient(135deg, #f8fafc, #e2e8f0); padding: 30px; text-align: center; border-bottom: 1px solid #cbd5e1; }
        .header-banner h2 { margin: 0 0 10px 0; color: var(--primary); font-family: 'Playfair Display', serif; font-size: 1.6rem; }
        .header-banner p { margin: 0; color: var(--text-gray); font-size: 0.9rem; line-height: 1.5; }

        .form-section { padding: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; color: var(--text-dark); }
        .form-control { width: 100%; padding: 12px 15px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: 'Poppins'; font-size: 0.95rem; background: #f8fafc; transition: 0.3s; }
        .form-control:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 3px rgba(0, 51, 102, 0.1); }
        
        .btn-submit { width: 100%; background: linear-gradient(135deg, var(--primary), #0f4c81); color: white; border: none; padding: 15px; border-radius: 10px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 10px; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 51, 102, 0.2); }
        
        #hidden-canvas { position: absolute; visibility: hidden; z-index: -9999; }
    </style>
</head>
<body>

    <canvas id="hidden-canvas"></canvas>

    <header class="top-navbar">
        <a href="/admin/index.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i></a>
        <h1 class="nav-title">Pra-Lisensi Naskah</h1>
    </header>

    <div class="app-wrapper">
        <div class="header-banner">
            <h2>Langkah 1: Permintaan Data Penulis</h2>
            <p>Sistem akan membuat Surat Resmi berstempel Cendekia Aksara untuk memohon kelengkapan data diri penulis (KTP, NPWP, Rekening) sebelum kontrak 15 halaman diterbitkan.</p>
        </div>

        <form id="praLisensiForm" class="form-section">
            <div class="form-group">
                <label class="form-label">Nama Penulis (Tujuan Surat)</label>
                <input type="text" id="p_nama" class="form-control" placeholder="Contoh: Budi Santoso" required>
            </div>
            <div class="form-group">
                <label class="form-label">Judul Naskah / Karya</label>
                <input type="text" id="n_judul" class="form-control" placeholder="Masukkan judul naskah yang lolos kurasi..." required>
            </div>
            
            <button type="submit" id="btn-submit" class="btn-submit">
                <i class="fa-solid fa-file-arrow-down"></i> Unduh Surat Permintaan Data & Lanjut
            </button>
        </form>
    </div>

    <script type="module">
        import { db, checkAuth } from "/js/firebase-config.js";

        const LOGO_CA = "https://i.imgur.com/5Srjyo4.png"; 
        const CAP_CA = "https://i.imgur.com/YvrNYRw.png"; 

        const fontCache = {};
        async function getFontBase64(url) {
            if (fontCache[url]) return fontCache[url];
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const base64 = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result.split(',')[1]);
                    reader.readAsDataURL(blob);
                });
                fontCache[url] = base64;
                return base64;
            } catch (error) { return null; }
        }

        function getBase64Image(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = 'Anonymous'; 
                img.onload = () => {
                    const canvas = document.getElementById('hidden-canvas');
                    canvas.width = img.width; canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    resolve(canvas.toDataURL('image/png'));
                };
                img.onerror = () => resolve(null);
                img.src = url;
            });
        }

        (async () => {
            const user = await checkAuth('admin'); 
            if(!user) window.location.href = '../index.html';
        })();

        document.getElementById('praLisensiForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyusun Surat...';
            btn.disabled = true;

            try {
                const p_nama = document.getElementById('p_nama').value.trim();
                const n_judul = document.getElementById('n_judul').value.trim();

                const [base64Logo, base64Cap, fontTnrReg, fontTnrBold] = await Promise.all([
                    getBase64Image(LOGO_CA), getBase64Image(CAP_CA),
                    getFontBase64('/fonts/times.ttf'), getFontBase64('/fonts/timesbd.ttf')
                ]);

                if (fontTnrReg) {
                    pdfMake.vfs = { ...pdfMake.vfs, 'times.ttf': fontTnrReg, 'timesbd.ttf': fontTnrBold };
                    pdfMake.fonts = {
                        Roboto: { normal: 'Roboto-Regular.ttf', bold: 'Roboto-Medium.ttf' },
                        TimesNewRoman: { normal: 'times.ttf', bold: 'timesbd.ttf' }
                    };
                }

                const d = new Date();
                const romawi = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"];
                const noSurat = `.../.../CA/${romawi[d.getMonth()]}/${d.getFullYear()}`;
                const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
                const tanggalSurat = `Temanggung, ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;

                const docDefinition = {
                    pageSize: 'A4',
                    pageMargins: [40, 40, 40, 50],
                    content: [
                        {
                            margin: [0, 0, 0, 10],
                            columns: [
                                base64Logo ? { image: base64Logo, width: 60, margin: [10, 0, 15, 0] } : { text: '', width: 75 },
                                {
                                    stack: [
                                        { text: 'KOMUNITAS LITERASI INDONESIA', fontSize: 11, alignment: 'center', margin: [0,0,0,2] },
                                        { text: 'CENDEKIA AKSARA', fontSize: 16, bold: true, alignment: 'center', margin: [0,0,0,2] },
                                        { text: 'Jl. Dusun Delok, No. 22 Karangtejo, Kedu, Kab. Temanggung', fontSize: 9, alignment: 'center', margin: [0,0,0,2] },
                                        { text: 'Telp/WA: +62 889-561-5630 | +62 859-3918-8592 | Email: cendekia.aksara25@gmail.com', fontSize: 9, alignment: 'center' }
                                    ]
                                }
                            ]
                        },
                        { canvas: [{ type: 'line', x1: 0, y1: 0, x2: 515, y2: 0, lineWidth: 2 }] },
                        { canvas: [{ type: 'line', x1: 0, y1: 2, x2: 515, y2: 2, lineWidth: 0.5 }], margin: [0,0,0,20] },
                        
                        {
                            columns: [
                                {
                                    width: '60%',
                                    stack: [
                                        { columns: [{ text: 'Nomor', width: 60 }, { text: `: ${noSurat}` }] },
                                        { columns: [{ text: 'Lampiran', width: 60 }, { text: `: -` }], margin: [0,2,0,2] },
                                        { columns: [{ text: 'Perihal', width: 60 }, { text: `: Permohonan Kelengkapan Data Kontrak Lisensi` }] }
                                    ]
                                },
                                { width: '40%', text: tanggalSurat, alignment: 'right' }
                            ],
                            margin: [0, 0, 0, 30]
                        },

                        {
                            stack: [
                                { text: 'Kepada Yth.', margin: [0,0,0,2] },
                                { text: `Sdr/i. ${p_nama}`, bold: true, margin: [0,0,0,30] } 
                            ]
                        },

                        { text: 'Dengan hormat,\n\n\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0Sehubungan dengan proses kurasi dan penilaian karya literasi pada sistem kami, kami sampaikan ucapan selamat karena naskah Saudara/i yang berjudul "' + n_judul + '" telah dinyatakan layak untuk dipublikasikan dan dikelola oleh Cendekia Aksara.\n\n\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0Untuk menindaklanjuti hal tersebut, kami bermaksud menerbitkan Perjanjian Lisensi Eksklusif yang mengikat secara hukum guna menjamin Hak Moral dan Hak Ekonomi (Royalti) dari karya tersebut. Oleh karena itu, kami memohon kesediaan Saudara/i untuk segera melengkapi data diri yang terdiri dari Kartu Tanda Penduduk (KTP), Nomor Pokok Wajib Pajak (NPWP - jika ada), dan Rekening Bank atas nama pribadi.\n\n\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0Demikian surat permohonan ini kami sampaikan. Atas perhatian dan kerja sama Saudara/i, kami ucapkan terima kasih.', alignment: 'justify', margin: [0,0,0,40], lineHeight: 1.5 },

                        {
                            unbreakable: true,
                            columns: [
                                { width: '*', text: '' }, 
                                {
                                    width: 250, 
                                    stack: [
                                        { text: 'Hormat kami,', alignment: 'center', margin: [0,0,0,2] },
                                        { text: 'Administrator Cendekia Aksara', alignment: 'center', margin: [0,0,0,5] },
                                        {
                                            margin: [0, 5, 0, 5],
                                            stack: [
                                                base64Cap ? { image: base64Cap, width: 95, alignment: 'center', margin: [0, 10, 0, 10], opacity: 0.85 } : { text: '\n\n\n' }
                                            ].filter(Boolean)
                                        },
                                        { text: 'Sistem Terotomasi CA', alignment: 'center', bold: true, decoration: 'underline' }
                                    ]
                                }
                            ]
                        }
                    ],
                    defaultStyle: { font: fontTnrReg ? 'TimesNewRoman' : 'Roboto', fontSize: 12, color: '#000000', lineHeight: 1.2 }
                };

                const fileName = `Surat_Pengantar_Data_${p_nama.replace(/\s+/g,'_')}.pdf`;
                pdfMake.createPdf(docDefinition).download(fileName, () => {
                    // SETELAH DOWNLOAD, REDIRECT KE HALAMAN PEMBUATAN KONTRAK 15 HALAMAN
                    Swal.fire({
                        title: 'Surat Terunduh!',
                        text: 'Mengarahkan ke halaman Generator Perjanjian Lisensi 15 Halaman...',
                        icon: 'success',
                        timer: 2500,
                        showConfirmButton: false
                    }).then(() => {
                        // Bawa parameter via URL agar admin gak ngetik ulang
                        window.location.href = `lisensi-create.html?nama=${encodeURIComponent(p_nama)}&judul=${encodeURIComponent(n_judul)}`;
                    });
                });

            } catch (err) {
                console.error(err);
                Swal.fire('Gagal', 'Terjadi kesalahan sistem.', 'error');
                btn.innerHTML = '<i class="fa-solid fa-file-arrow-down"></i> Unduh Surat Permintaan Data & Lanjut';
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
