<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
    <title>Kalender Kegiatan Mingguan - Admin Cendekia</title>
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Aleo:wght@700&family=Playfair+Display:ital,wght@0,700;1,700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- PUSTAKA PDFMAKE -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>

    <style>
        :root { --primary: #002244; --accent: #d4af37; --bg: #f4f7f6; --text-dark: #1e293b; --text-gray: #64748b; --header-h: 84px; }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent;}
        html { -webkit-text-size-adjust: 100%; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg); margin: 0; color: var(--text-dark); padding-bottom: 50px; padding-top: var(--header-h);}
        .container { max-width: 1200px; width: 94%; margin: 0 auto; padding: 16px 0 20px; }

        .brand-header {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
            background: linear-gradient(135deg, #001f3f 0%, #003366 100%);
            color: white; padding: 10px 4%; box-shadow: 0 4px 20px rgba(0, 31, 63, 0.4);
            display: flex; justify-content: space-between; align-items: center; gap: 10px; border-bottom: 4px solid var(--accent);
            min-height: var(--header-h);
        }
        .header-content-wrapper { display: flex; align-items: center; gap: clamp(8px, 2vw, 15px); min-width: 0; }
        .header-logo-circle { width: clamp(38px, 8vw, 55px); height: clamp(38px, 8vw, 55px); background: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); flex-shrink: 0; padding: 6px; box-sizing: border-box; }
        .header-logo-circle img { width: 100%; height: 100%; object-fit: contain; }
        .header-info { min-width: 0; }
        .header-brand-name { font-family: 'Aleo', serif; font-size: clamp(0.95rem, 3.6vw, 1.5rem); margin: 0; color: white; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .header-greeting { font-size: clamp(0.62rem, 2.4vw, 0.85rem); margin: 0; color: rgba(255,255,255,0.75); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .btn-back { background: rgba(255,255,255,0.15); color: white; text-decoration: none; padding: 8px 14px; border-radius: 50px; font-weight: 600; font-size: clamp(0.72rem, 2.6vw, 0.9rem); border: 1px solid rgba(255,255,255,0.3); display: inline-flex; align-items: center; gap: 6px; transition: 0.3s; flex-shrink: 0; white-space: nowrap; }
        .btn-back:hover { background: white; color: var(--primary); }

        .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 6px; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
        .nav-tabs::-webkit-scrollbar { height: 5px; }
        .nav-tabs::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .tab-btn { background: white; border: 1px solid #cbd5e1; padding: 10px 16px; border-radius: 50px; font-weight: 600; color: #64748b; cursor: pointer; transition: 0.3s; white-space: nowrap; font-family: 'Poppins', sans-serif; display: inline-flex; align-items: center; gap: 7px; text-decoration: none; font-size: 0.85rem; flex-shrink: 0; }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 10px rgba(0, 51, 102, 0.2); }

        .admin-card { background: white; border-radius: 16px; padding: clamp(14px, 4vw, 30px); box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid #e2e8f0; margin-bottom: 30px;}
        .section-title { font-family: 'Aleo', serif; color: var(--primary); font-size: clamp(1.05rem, 4vw, 1.3rem); margin-bottom: 18px; display: flex; align-items: center; gap: 10px; border-bottom: 2px dashed #f1f5f9; padding-bottom: 14px; }
        
        .filter-area { display: flex; gap: 14px; margin-bottom: 22px; align-items: flex-end; background: #f8fafc; padding: 14px; border-radius: 12px; border: 1px solid #e2e8f0; flex-wrap: wrap;}
        .form-select { width: 100%; padding: 12px 15px; border: 1px solid #cbd5e1; border-radius: 10px; font-family: 'Poppins', sans-serif; font-size: 0.9rem; background: #fff; transition: 0.3s; }
        
        .btn-word, .btn-pdf { padding: 11px 16px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; font-family: 'Poppins', sans-serif; transition: 0.3s; font-size: 0.82rem; white-space: nowrap; }
        .btn-word { background: #2563eb; color: white; }
        .btn-pdf { background: #b91c1c; color: white; }
        .btn-word:disabled, .btn-pdf:disabled { opacity: 0.6; cursor: not-allowed; }

        .karya-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
        .karya-card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; transition: 0.3s;}
        .kc-author { font-weight: 700; color: var(--primary); font-size: 1rem; margin-bottom: 2px;}
        .kc-title { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700; color: #0f172a; margin-bottom: 10px;}
        .kc-content { font-size: 0.83rem; color: #475569; line-height: 1.6; background: #f8fafc; padding: 14px; border-radius: 8px; margin-bottom: 14px; max-height: 150px; overflow-y: auto; border: 1px solid #e2e8f0; }
        
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); z-index: 9999; display: none; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; }
        #loading-screen.active { display: flex; }

        @media (max-width: 768px) {
            :root { --header-h: 68px; }
            .container { width: 100%; padding: 12px 4vw 16px; }
            .brand-header { padding: 8px 3.5%; }
            .header-greeting { display: none; } 
            .btn-back span { display: none; }
            .btn-back { padding: 9px 11px; }
            .filter-area { flex-direction: column; align-items: stretch; padding: 12px; gap: 10px; }
            .filter-area > div:last-child { display: flex; flex-direction: column; gap: 8px; }
            .btn-word, .btn-pdf { width: 100%; justify-content: center; }
            .karya-grid { grid-template-columns: 1fr; gap: 12px; }
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <i class="fa-solid fa-spinner fa-spin" style="font-size: 4rem; color: #d4af37; margin-bottom: 20px;" id="loading-icon"></i>
        <h2 style="font-family:'Aleo', serif; margin:0; color:#003366;" id="loading-title">Memproses...</h2>
        <p style="color:#64748b;" id="loading-msg">Mohon tunggu sebentar.</p>
    </div>

    <div class="container">

        <header class="brand-header">
            <div class="header-content-wrapper">
                <div class="header-logo-circle">
                    <img id="header-logo" src="https://i.imgur.com/5Srjyo4.png" alt="Logo" crossorigin="anonymous">
                </div>
                <div class="header-info">
                    <h1 class="header-brand-name">Halaman Ujicoba Buku</h1>
                    <p class="header-greeting">Layout Engine V2.3 (Fokus PDF Beres)</p>
                </div>
            </div>
            <a href="/admin/index.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> <span>Dashboard</span></a>
        </header>

        <div class="nav-tabs">
            <button class="tab-btn active"><i class="fa-solid fa-book-open"></i> Karya Masuk (Ujicoba PDF)</button>
        </div>

        <div id="tab-karya" class="admin-card" style="display: block;">
            <h2 class="section-title"><i class="fa-solid fa-box-open"></i> Gudang Karya Siswa & Ekspor PDF Profesional</h2>
            
            <div class="filter-area">
                <div style="flex:1; width: 100%;">
                    <label style="font-size:0.85rem; font-weight:600; color:var(--text-gray); display:block; margin-bottom:5px;">Pilih Event untuk Ditampilkan:</label>
                    <select id="filter-event" class="form-select" onchange="loadSubmissions()">
                        <option value="">Pilih Event...</option>
                    </select>
                </div>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <button class="btn-word" id="btn-export-word" disabled>
                        <i class="fa-solid fa-file-word"></i> Ekspor MS.Word
                    </button>
                    <button class="btn-pdf" onclick="exportToPDFA5()" id="btn-export-pdf" disabled title="Format Buku A5 (Print Ready)">
                        <i class="fa-solid fa-file-pdf"></i> Ekspor Buku PDF
                    </button>
                </div>
            </div>

            <div id="karya-list" class="karya-grid">
                <div style="grid-column: 1/-1; text-align:center; padding: 40px; color:#94a3b8; border:2px dashed #e2e8f0; border-radius:12px;">Pilih event di atas untuk melihat karya yang terkumpul.</div>
            </div>
        </div>

    </div>

    <script type="module">
        import { db, checkAuth } from "../js/firebase-config.js";
        import { collection, getDocs, query, orderBy, where } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let allEvents = [];
        let allSubmissions = [];

        const LOGO_URL = "https://i.imgur.com/5Srjyo4.png";

        // Cache Font Agar Tidak Timeout
        const fontCache = {};

        (async () => {
            const admin = await checkAuth('admin');
            if(!admin) { window.location.href = '../index.html'; return; }
            showLoading("Sinkronisasi Database...");
            await loadEvents(); 
            loadDropdownEvents();
            hideLoading();
        })();

        function showLoading(msg) {
            document.getElementById('loading-msg').innerText = msg;
            document.getElementById('loading-screen').classList.add('active');
        }
        function hideLoading() {
            document.getElementById('loading-screen').classList.remove('active');
        }

        async function loadEvents() {
            try {
                const q = query(collection(db, 'weekly_events'), orderBy('createdAt', 'desc'));
                const snap = await getDocs(q);
                allEvents = [];
                snap.forEach(d => {
                    allEvents.push({id: d.id, ...d.data()});
                });
            } catch(e) { console.error(e); }
        }

        function loadDropdownEvents() {
            const select = document.getElementById('filter-event');
            select.innerHTML = '<option value="">Pilih Event yang Tersedia...</option>';
            allEvents.forEach(e => {
                select.innerHTML += `<option value="${e.id}">${e.judul} (${e.tipe})</option>`;
            });
        }

        window.loadSubmissions = async () => {
            const eventId = document.getElementById('filter-event').value;
            const container = document.getElementById('karya-list');
            const btnPdf = document.getElementById('btn-export-pdf');
            
            if(!eventId) {
                container.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 40px; color:#94a3b8; border:2px dashed #e2e8f0; border-radius:12px;">Pilih event di atas.</div>';
                btnPdf.disabled = true;
                return;
            }

            container.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 40px;"><i class="fa-solid fa-spinner fa-spin"></i> Mencari karya...</div>';
            
            try {
                const q = query(collection(db, 'weekly_submissions'), where('eventId', '==', eventId));
                const snap = await getDocs(q);
                allSubmissions = [];

                if(snap.empty) {
                    container.innerHTML = '<div style="grid-column: 1/-1; text-align:center; background:white; border-radius:12px; border:1px solid #e2e8f0;">Belum ada karya untuk event ini.</div>';
                    btnPdf.disabled = true;
                    return;
                }

                snap.forEach(d => {
                    allSubmissions.push({id: d.id, ...d.data()});
                });
                
                allSubmissions.sort((a,b) => (a.studentName || '').localeCompare(b.studentName || ''));

                container.innerHTML = '';
                btnPdf.disabled = false;

                allSubmissions.forEach((sub, idx) => {
                    container.innerHTML += `
                        <div class="karya-card">
                            <div class="kc-author"><i class="fa-solid fa-user-pen"></i> ${sub.studentName || 'Anonim'}</div>
                            <h3 class="kc-title">${sub.title || '-'}</h3>
                            <div class="kc-content">${(sub.content || '').substring(0, 100)}...</div>
                        </div>
                    `;
                });
            } catch (e) {
                container.innerHTML = '<div style="grid-column: 1/-1; text-align:center; color:#ef4444;">Gagal memuat karya.</div>';
            }
        }

        // ==============================================================================================
        // PDF ENGINE LAYOUT SYSTEM V2.3 (FIXED PAGE BREAKS & BLACK BACKGROUND)
        // ==============================================================================================
        
        function getBase64ImageFromUrl(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = 'Anonymous'; 
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width; canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    resolve(canvas.toDataURL('image/png'));
                };
                img.onerror = () => resolve(null);
                img.src = url;
            });
        }

        async function getFontBase64(url) {
            if (fontCache[url]) return fontCache[url];
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("Gagal: " + url);
                const arrayBuffer = await response.arrayBuffer();
                let binary = '';
                const bytes = new Uint8Array(arrayBuffer);
                for (let i = 0; i < bytes.byteLength; i++) {
                    binary += String.fromCharCode(bytes[i]);
                }
                const base64 = window.btoa(binary);
                fontCache[url] = base64;
                return base64;
            } catch (error) {
                console.error("Gagal Load Font:", error);
                return null;
            }
        }

        window.exportToPDFA5 = async () => {
            if(allSubmissions.length === 0) return;
            showLoading("Memuat Mesin Layout & Font Custom...");

            try {
                const ev = allEvents.find(e => e.id === document.getElementById('filter-event').value);
                const generatedDate = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });

                // 1. FETCH ASSET & FONT
                const [
                    base64Logo, 
                    fontTnrReg, fontTnrBold, fontTnrItalic, fontTnrBoldItalic, fontPlayfairReg
                ] = await Promise.all([
                    getBase64ImageFromUrl(LOGO_URL),
                    getFontBase64('/fonts/times.ttf'),       
                    getFontBase64('/fonts/timesbd.ttf'),     
                    getFontBase64('/fonts/timesi.ttf'),      
                    getFontBase64('/fonts/timesbi.ttf'),     
                    getFontBase64('/fonts/PlayfairDisplay-VariableFont_wght.ttf')
                ]);

                // PROTEKSI FATAL ERROR
                if (!fontTnrReg) {
                    hideLoading();
                    Swal.fire('Font Tidak Ditemukan', 'Harap pastikan file times.ttf dkk sudah ada di folder /fonts/', 'error');
                    return;
                }

                showLoading("Menyusun Anatomi Buku Profesional...");

                // 2. INJEKSI FONT KE PDFMAKE
                pdfMake.vfs = {
                    ...pdfMake.vfs,
                    'times.ttf': fontTnrReg,
                    'timesbd.ttf': fontTnrBold,
                    'timesi.ttf': fontTnrItalic,
                    'timesbi.ttf': fontTnrBoldItalic,
                    'PlayfairDisplay-VariableFont_wght.ttf': fontPlayfairReg || fontTnrReg
                };

                pdfMake.fonts = {
                    Roboto: { normal: 'Roboto-Regular.ttf', bold: 'Roboto-Medium.ttf', italics: 'Roboto-Italic.ttf', bolditalics: 'Roboto-MediumItalic.ttf' },
                    TimesNewRoman: { normal: 'times.ttf', bold: 'timesbd.ttf', italics: 'timesi.ttf', bolditalics: 'timesbi.ttf' },
                    Playfair: { normal: 'PlayfairDisplay-VariableFont_wght.ttf', bold: 'PlayfairDisplay-VariableFont_wght.ttf', italics: 'PlayfairDisplay-VariableFont_wght.ttf', bolditalics: 'PlayfairDisplay-VariableFont_wght.ttf' }
                };

                let namaPenulisCover = "";
                let namaPenulisKDT = "";
                if(allSubmissions.length === 1) {
                    namaPenulisCover = allSubmissions[0].studentName;
                    namaPenulisKDT = allSubmissions[0].studentName;
                } else {
                    const penulisUtama = allSubmissions[0].studentName;
                    namaPenulisCover = `${penulisUtama} dkk.`;
                    namaPenulisKDT = `${penulisUtama}, dkk.`;
                }

                // ==============================================================
                // A. FRONT MATTER & DAFTAR ISI
                // ==============================================================
                
                let pdfContent = [
                    // HALAMAN 1: PRANCIS (Half Title)
                    { text: ev.judul.toUpperCase(), font: 'Playfair', fontSize: 18, bold: true, alignment: 'center', margin: [0, 150, 0, 0], characterSpacing: 2, pageBreak: 'after' },
                    
                    // HALAMAN 2: UU HAK CIPTA
                    { text: '', margin: [0, 300, 0, 0] }, // Spacer untuk menekan tabel ke bawah
                    {
                        table: {
                            widths: ['*'],
                            body: [
                                [
                                    {
                                        stack: [
                                            { text: 'Ketentuan Pidana Hak Cipta', fontSize: 9, bold: true, alignment: 'center', margin: [0, 0, 0, 5] },
                                            { text: 'Sanksi pelanggaran UU No. 28 Tahun 2014 meliputi pidana penjara maksimal 1-10 tahun dan denda mulai dari Rp100 Juta hingga Rp4 Miliar sesuai tingkat pelanggaran ekonomi secara komersial maupun pembajakan.', fontSize: 8, alignment: 'justify' }
                                        ]
                                    }
                                ]
                            ]
                        },
                        layout: { hLineWidth: () => 1, vLineWidth: () => 1, hLineColor: () => '#1e293b', vLineColor: () => '#1e293b', paddingLeft: () => 10, paddingRight: () => 10, paddingTop: () => 10, paddingBottom: () => 10 },
                        pageBreak: 'after'
                    },

                    // HALAMAN 3: JUDUL UTAMA
                    { text: ev.judul.toUpperCase(), font: 'Playfair', fontSize: 24, bold: true, alignment: 'center', margin: [0, 100, 0, 30] },
                    { text: `Oleh:\n${namaPenulisCover}`, font: 'TimesNewRoman', fontSize: 12, italics: true, alignment: 'center', margin: [0, 0, 0, 150] },
                    base64Logo ? { image: base64Logo, width: 50, alignment: 'center', margin: [0,0,0,10] } : {},
                    { text: 'CENDEKIA AKSARA', font: 'TimesNewRoman', fontSize: 11, bold: true, alignment: 'center', characterSpacing: 1, pageBreak: 'after' },

                    // HALAMAN 4: IMPRINT / KDT
                    { text: ev.judul.toUpperCase(), font: 'TimesNewRoman', fontSize: 11, bold: true, margin: [0, 200, 0, 0] },
                    { text: `© ${new Date().getFullYear()} ${namaPenulisKDT}\n\n`, fontSize: 9 },
                    { text: `Penyelaras Aksara: Tim Redaksi Cendekia`, fontSize: 9 },
                    { text: `Desain Sampul: Tim Kreatif CA`, fontSize: 9 },
                    { text: `Penata Letak: Bayu Aji (Layout Engine)\n\n`, fontSize: 9 },
                    { text: `Diterbitkan oleh:\nCENDEKIA AKSARA`, fontSize: 9, bold: true },
                    { text: `CV. Ragam Literasi Indonesia\nTemanggung, Jawa Tengah\nWeb: cendekia-aksara.vercel.app\n\n`, fontSize: 9 },
                    { text: `Terbitan Pertama: ${generatedDate}\n\n`, fontSize: 9 },
                    { text: 'Hak Cipta dilindungi Undang-Undang.\nDilarang mengutip atau memperbanyak sebagian atau seluruh isi buku ini tanpa izin tertulis dari Penerbit.', fontSize: 8, italics: true, alignment: 'justify', pageBreak: 'after' },

                    // HALAMAN 5: DAFTAR ISI
                    { text: 'DAFTAR ISI', font: 'TimesNewRoman', fontSize: 14, bold: true, margin: [0, 10, 0, 20] }
                ];

                // Render Daftar Isi
                const tocRows = allSubmissions.map((sub, idx) => ([
                    { text: String(idx + 1).padStart(2, '0'), fontSize: 10, font: 'TimesNewRoman', margin: [0, 4, 0, 4] },
                    { 
                        stack: [
                            { text: sub.title || 'Tanpa Judul', fontSize: 10, font: 'TimesNewRoman' },
                            { text: sub.studentName || 'Anonim', fontSize: 10, font: 'TimesNewRoman' }
                        ],
                        margin: [0, 4, 0, 4]
                    },
                    { text: '', pageReference: 'anchor_karya_' + idx, fontSize: 10, font: 'TimesNewRoman', alignment: 'right', margin: [0, 4, 0, 4] } 
                ]));
                
                pdfContent.push({
                    table: { widths: [20, '*', 30], body: tocRows },
                    layout: 'noBorders',
                    margin: [0, 0, 0, 20]
                });

                // ==============================================================
                // B. ISI KARYA SISWA (DENGAN HALAMAN HITAM SEBAGAI PEMISAH)
                // ==============================================================
                
                // Menyimpan index di mana halaman pembatas hitam akan digambar
                // (Ini krusial untuk background handler nantinya)
                let blackPageIndices = [];

                allSubmissions.forEach((sub, idx) => {
                    // KITA CATAT: Halaman selanjutnya (setelah pageBreak) akan berwarna hitam!
                    pdfContent.push({ text: '', pageBreak: 'before', style: 'blackMarker' }); 

                    let titleText = (sub.title || 'TANPA JUDUL').toUpperCase();
                    let tSize = 22;
                    if(titleText.length > 50) tSize = 18;
                    
                    // HALAMAN SAMPUL CERITA (TEKS PUTIH)
                    pdfContent.push({
                        id: 'anchor_karya_' + idx, 
                        text: titleText, 
                        font: 'TimesNewRoman', 
                        fontSize: tSize, 
                        bold: true, 
                        color: 'white', 
                        alignment: 'center', 
                        margin: [0, 150, 0, 10] // Atur posisi ke tengah-bawah secara dinamis
                    });
                    
                    pdfContent.push({
                        text: `Oleh: ${sub.studentName || 'Anonim'}`, 
                        font: 'TimesNewRoman', 
                        fontSize: 12, 
                        bold: true, 
                        color: 'white', 
                        alignment: 'center'
                    });

                    // Pindah ke halaman putih untuk isi naskah
                    pdfContent.push({ text: '', pageBreak: 'before' }); 

                    // KONTEN NASKAH
                    const paragraphs = (sub.content || '').split('\n').filter(p => p.trim() !== '');
                    paragraphs.forEach((p, pIndex) => {
                        let textStr = p.trim();
                        // Paragraf kedua dst menjorok
                        if (pIndex !== 0) { textStr = '\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0' + textStr; }

                        pdfContent.push({
                            text: textStr,
                            font: 'TimesNewRoman',
                            alignment: 'justify',
                            margin: [0, 0, 0, 10], 
                            fontSize: 11,
                            lineHeight: 1.4
                        });
                    });
                });

                // ==============================================================
                // C. KONFIGURASI BACKGROUND & PDF 
                // ==============================================================
                
                let isBlackPage = false; // Penanda Switch

                const docDefinition = {
                    pageSize: 'A5',
                    pageMargins: [56.7, 56.7, 56.7, 56.7],

                    // SISTEM BACKGROUND DINAMIS: Mengecek secara realtime saat rendering PDF
                    // Apakah halaman ini memuat node dengan label style 'blackMarker'
                    background: function(currentPage, pageSize) {
                        return {
                            canvas: [
                                // Kita akan menggambar background kotak (putih atau hitam) untuk SELURUH kertas A5
                                {
                                    type: 'rect',
                                    x: 0, y: 0,
                                    w: pageSize.width,
                                    h: pageSize.height,
                                    // Default putih, tapi akan diisi hitam jika logikanya dipicu (lihat update di bawah)
                                    color: '#ffffff'
                                }
                            ]
                        };
                    },

                    footer: function (currentPage) {
                        return {
                            text: currentPage.toString(), 
                            font: 'TimesNewRoman',
                            fontSize: 10,
                            alignment: 'center',
                            margin: [0, 10, 0, 0] 
                        };
                    },

                    content: pdfContent,
                    defaultStyle: { font: 'TimesNewRoman' } 
                };

                // KUNCI BACKGROUND HITAM PDFMAKE
                // PDFMake mengeksekusi fungsi background sebelum halaman benar-benar dibuat.
                // Kita harus merekayasa PDF Content agar background merespon 'blackMarker'
                docDefinition.content.forEach((node, i) => {
                    if (node.style === 'blackMarker') {
                        // Tambahkan properti fillColor untuk mewarnai teks yang tak kasat mata
                        // PDFMake terkadang memiliki trick di mana jika kita membuat 
                        // rectangle background spesifik untuk node tersebut.
                    }
                });

                // CARA PASTI UNTUK BACKGROUND HITAM HALAMAN SPESIFIK:
                // Kita ganti elemen 'blackMarker' dengan rectangle absolute yang besarnya melebihi margin kertas
                // karena PDFMake agak pelit dalam merender background function per halaman.
                docDefinition.content = docDefinition.content.map(node => {
                    if (node.style === 'blackMarker') {
                        return {
                            // Ini akan digambar dari pojok kiri atas halaman menabrak margin!
                            canvas: [
                                {
                                    type: 'rect',
                                    x: -56.7, // Mundurkan sejauh margin kiri
                                    y: -56.7, // Naikkan sejauh margin atas
                                    w: 420,   // Lebar A5
                                    h: 596,   // Tinggi A5
                                    color: '#1e293b' // Gunakan Navy Super Gelap (Bukan murni hitam agar elegan)
                                }
                            ],
                            // Tarik konten (Teks Judul) agar naik kembali ke atas (overlap dengan canvas)
                            margin: [0, 0, 0, -596],
                            pageBreak: 'before' // Paksa halaman baru dulu sebelum ngeblok warna
                        };
                    }
                    return node;
                });

                pdfMake.createPdf(docDefinition).download(`Buku_Profesional_${ev.judul.replace(/\s/g,'_')}.pdf`, () => {
                    hideLoading();
                    Swal.fire('Berhasil!', 'Buku berstandar penerbitan siap dicetak!', 'success');
                });
            } catch (err) {
                console.error(err);
                hideLoading();
                Swal.fire('Gagal', 'Terjadi kesalahan saat menyusun PDF buku: ' + err.message, 'error');
            }
        }
    </script>
</body>
</html>
