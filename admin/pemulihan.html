<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsip & Pemulihan Siswa - Admin</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        :root { --primary: #003366; --bg: #f4f7f6; --text: #333; --danger: #dc3545; --warning: #f59e0b; --success: #10b981; }
        * { box-sizing: border-box; outline: none; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; color: var(--text); padding-bottom: 50px; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 3px solid var(--warning); padding-bottom: 15px; background: #fff; padding: 20px; border-radius: 12px; flex-wrap: wrap; gap:15px; }
        .page-header h2 { margin: 0; color: #555; font-size: 1.6rem; display: flex; align-items: center; gap: 10px; }
        .page-header h2 i { color: var(--warning); }
        
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; transition: 0.2s; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-secondary { background: #f1f5f9; color: #334155; }
        .btn-secondary:hover { background: #e2e8f0; }

        .info-panel { background: #fffbeb; border: 1px solid #fde68a; padding: 15px 20px; border-radius: 12px; margin-bottom: 25px; color: #92400e; display: flex; align-items: center; gap: 10px; font-weight: 500; }
        
        #list-arsip { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 20px; }

        .archive-card { background: white; border: 2px dashed #cbd5e1; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); transition: 0.2s; }
        .archive-card:hover { border-color: #94a3b8; box-shadow: 0 6px 15px rgba(0,0,0,0.08); }
        
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .student-name { font-size: 1.25rem; color: #475569; margin: 0 0 5px 0; font-weight: bold; }
        .student-email { color: #94a3b8; font-size: 0.9rem; }
        
        .reason-box { background: #fef2f2; padding: 10px; border-radius: 8px; border-left: 4px solid #ef4444; color: #991b1b; font-size: 0.85rem; margin-bottom: 20px; }
        
        .action-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .action-row select { padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-weight: bold; }
        .btn-restore { flex: 1; padding: 10px; background: var(--success); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-restore:hover { background: #059669; }
        
        .btn-hard-delete { padding: 10px; background: white; color: var(--danger); border: 2px solid #fca5a5; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .btn-hard-delete:hover { background: var(--danger); color: white; }

        #toast-container { position: fixed; bottom: 30px; right: 30px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { min-width: 250px; padding: 15px 20px; background: #333; color: white; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); display: flex; align-items: center; gap: 12px; opacity: 0; animation: slideIn 0.3s forwards; }
        .toast.success { border-left: 5px solid #10b981; background: #fff; color: #333; }
        .toast.error { border-left: 5px solid #dc3545; background: #fff; color: #333; }
        @keyframes slideIn { to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeOut { to { opacity: 0; transform: translateX(50px); } }

        @media (max-width: 768px) {
            #list-arsip { grid-template-columns: 1fr; }
            .page-header { flex-direction: column; text-align: center; }
            .action-row select, .btn-restore, .btn-hard-delete { width: 100%; flex: unset; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h2><i class="fa-solid fa-trash-arrow-up"></i> Arsip & Pemulihan Data Siswa</h2>
            <a href="siswa.html" class="btn btn-secondary"><i class="fa-solid fa-arrow-left"></i> Kembali ke Data Siswa</a>
        </div>

        <div class="info-panel">
            <i class="fa-solid fa-circle-info"></i>
            Daftar di bawah ini adalah akun siswa yang telah dikeluarkan (baik karena tidak lolos evaluasi otomatis maupun dihapus manual). UID dan biodata mereka masih tersimpan dan dapat dipulihkan ke kelas aktif kapan saja.
        </div>

        <div id="list-arsip">
            <div style="grid-column: 1/-1; text-align: center; padding: 50px; color: #666; background: white; border-radius: 12px;">
                <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 3rem; color: #ccc;"></i>
                <p style="margin-top: 15px; font-weight:bold;">Memuat data arsip...</p>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0", 
            authDomain: "mading-cf676.firebaseapp.com", 
            projectId: "mading-cf676", 
            storageBucket: "mading-cf676.firebasestorage.app", 
            messagingSenderId: "72175203671", 
            appId: "1:72175203671:web:7a0676a55beb64bc96ba12" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (user) { loadArsip(); } 
            else { try { await signInAnonymously(auth); } catch(e) {} }
        });

        async function loadArsip() {
            try {
                const div = document.getElementById('list-arsip');
                // HANYA MENGAMBIL USER DENGAN ROLE 'archived'
                const q = query(collection(db, 'users'), where('role', '==', 'archived'));
                const snap = await getDocs(q);
                
                if (snap.empty) {
                    div.innerHTML = `
                        <div style="grid-column: 1/-1; text-align: center; color: #888; padding: 60px; background:white; border-radius:12px; border:2px dashed #ddd;">
                            <i class="fa-solid fa-box-open" style="font-size: 4rem; margin-bottom: 15px; color:#cbd5e1;"></i>
                            <h3 style="margin:0; color:#64748b;">Arsip Kosong</h3>
                            <p>Tidak ada siswa yang sedang diarsipkan saat ini.</p>
                        </div>`; 
                    return;
                }

                let htmlBuffer = '';
                snap.forEach(d => {
                    const u = { id: d.id, ...d.data() };
                    const lastSem = u.semester || 1;
                    const reason = u.archive_reason || "Dikeluarkan dari sistem (Tidak ada keterangan detail)";

                    htmlBuffer += `
                        <div class="archive-card">
                            <div class="card-header">
                                <div>
                                    <h3 class="student-name">${u.name}</h3>
                                    <div class="student-email"><i class="fa-solid fa-envelope"></i> ${u.email || 'Tanpa Email'}</div>
                                    <div style="margin-top:5px; font-size:0.85rem; font-weight:bold; color:#64748b;">
                                        <i class="fa-solid fa-clock-rotate-left"></i> Terakhir aktif di Semester: ${lastSem}
                                    </div>
                                </div>
                            </div>
                            
                            <div class="reason-box">
                                <strong><i class="fa-solid fa-triangle-exclamation"></i> Alasan Arsip:</strong><br>
                                ${reason}
                            </div>
                            
                            <div class="action-row">
                                <select id="restore-sem-${u.id}">
                                    <option value="1" ${lastSem == 1 ? 'selected' : ''}>Pulihkan ke Sem 1</option>
                                    <option value="2" ${lastSem == 2 ? 'selected' : ''}>Pulihkan ke Sem 2</option>
                                    <option value="3" ${lastSem == 3 ? 'selected' : ''}>Pulihkan ke Sem 3</option>
                                </select>
                                <button class="btn-restore" onclick="window.restoreStudent('${u.id}', '${u.name}')">
                                    <i class="fa-solid fa-rotate-left"></i> Aktifkan
                                </button>
                                <button class="btn-hard-delete" title="Hapus Permanen!" onclick="window.hardDelete('${u.id}', '${u.name}')">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });
                div.innerHTML = htmlBuffer;
            } catch(e) {
                document.getElementById('list-arsip').innerHTML = '<div style="color:red; text-align:center;">Gagal memuat data arsip.</div>';
            }
        }

        // --- FUNGSI PEMULIHAN SISWA (Ubah Role kembali jadi 'siswa') ---
        window.restoreStudent = async (uid, name) => {
            const chosenSem = parseInt(document.getElementById(`restore-sem-${uid}`).value);
            if(confirm(`Pulihkan akun ${name} ke Kelas Aktif (Semester ${chosenSem})?\n\nMereka akan langsung muncul kembali di Data Siswa.`)) {
                try {
                    await updateDoc(doc(db, 'users', uid), { 
                        role: 'siswa', 
                        semester: chosenSem,
                        archive_reason: "" // Bersihkan alasan arsip
                    });
                    showToast(`Berhasil! ${name} dipulihkan ke Sem ${chosenSem}.`, 'success');
                    loadArsip(); // Refresh list
                } catch(e) {
                    showToast("Gagal memulihkan siswa.", 'error');
                }
            }
        };

        // --- FUNGSI HAPUS PERMANEN BILA DIPERLUKAN ---
        window.hardDelete = async (uid, name) => {
            if(confirm(`BAHAYA! Anda yakin ingin MENGHAPUS PERMANEN data dan nilai ${name}?\n\nAksi ini akan menghapus UID secara permanen dari database ini dan tidak bisa dikembalikan.`)) {
                try {
                    await deleteDoc(doc(db, 'users', uid));
                    showToast(`Data ${name} telah dimusnahkan secara permanen.`, 'success');
                    loadArsip();
                } catch(e) {
                    showToast("Gagal menghapus permanen.", 'error');
                }
            }
        };

        function showToast(msg, type='success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i><span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'fadeOut 0.5s forwards';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }
    </script>
</body>
</html>
