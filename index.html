<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cendekia Aksara Edukasi - Memuat Portal...</title>
    
    <link rel="icon" type="image/png" sizes="512x512" href="https://i.imgur.com/5Srjyo4.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #003366;
            --primary-dark: #001f3f;
            --accent: #d4af37;
            --bg-page: #f8fafc;
            --card-bg: #ffffff;
            --border-soft: #e2e8f0;
            --radius-md: 18px;
            --radius-lg: 24px;
            --radius-full: 9999px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Poppins', sans-serif;
            background-color: #0b1329;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(0, 51, 102, 0.25) 0%, transparent 45%);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .mobile-app-wrapper {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            background-color: var(--bg-page);
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
            padding-bottom: 96px;
        }

        @media (min-width: 480px) {
            body { padding: 24px 16px; }
            .mobile-app-wrapper {
                min-height: 900px;
                border-radius: 36px;
                border: 8px solid #1e293b;
                box-shadow: 0 25px 70px -10px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.1);
            }
        }

        /* --- SKELETON SHIMMER EFFECT --- */
        .shimmer {
            background: linear-gradient(90deg, #edf2f7 0%, #f7fafc 50%, #edf2f7 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite linear;
            border-radius: 8px;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .skeleton-header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            border-bottom: 1.5px solid var(--border-soft);
        }
        .skeleton-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .skeleton-logo {
            width: 40px;
            height: 40px;
            border-radius: 12px;
        }
        .skeleton-title-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .skeleton-title {
            width: 120px;
            height: 16px;
        }
        .skeleton-sub {
            width: 80px;
            height: 10px;
        }
        .skeleton-btn {
            width: 70px;
            height: 32px;
            border-radius: var(--radius-full);
        }

        .skeleton-body {
            padding: 20px 18px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .skeleton-search {
            height: 44px;
            border-radius: var(--radius-full);
        }
        .skeleton-hero {
            height: 170px;
            border-radius: var(--radius-lg);
        }
        .skeleton-strip {
            height: 56px;
            border-radius: var(--radius-md);
        }
        .skeleton-section-title {
            width: 130px;
            height: 16px;
            margin-bottom: 4px;
        }
        .skeleton-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .skeleton-card {
            height: 110px;
            border-radius: var(--radius-md);
        }
        .skeleton-promo {
            height: 80px;
            border-radius: var(--radius-md);
        }

        /* BOTTOM NAV SKELETON */
        .skeleton-bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            height: 68px;
            background: white;
            border-top: 1px solid var(--border-soft);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 8px;
        }
        @media (min-width: 480px) {
            .skeleton-bottom-nav {
                border-bottom-left-radius: 32px;
                border-bottom-right-radius: 32px;
                bottom: 24px;
                width: calc(100% - 32px);
                max-width: 414px;
            }
        }
        .skeleton-nav-item {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }

        /* LOADING STATUS BADGE DI TENGAH */
        .loading-status-wrap {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 31, 63, 0.92);
            color: white;
            padding: 14px 22px;
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            z-index: 99;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(212, 175, 55, 0.4);
        }
        .loading-status-wrap i {
            color: var(--accent);
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="mobile-app-wrapper">

        <!-- SKELETON HEADER -->
        <div class="skeleton-header">
            <div class="skeleton-brand">
                <div class="shimmer skeleton-logo"></div>
                <div class="skeleton-title-box">
                    <div class="shimmer skeleton-title"></div>
                    <div class="shimmer skeleton-sub"></div>
                </div>
            </div>
            <div class="shimmer skeleton-btn"></div>
        </div>

        <!-- SKELETON BODY -->
        <div class="skeleton-body">
            <div class="shimmer skeleton-search"></div>
            <div class="shimmer skeleton-hero"></div>
            <div class="shimmer skeleton-strip"></div>
            
            <div class="shimmer skeleton-section-title"></div>
            <div class="skeleton-grid">
                <div class="shimmer skeleton-card"></div>
                <div class="shimmer skeleton-card"></div>
                <div class="shimmer skeleton-card"></div>
                <div class="shimmer skeleton-card"></div>
            </div>

            <div class="shimmer skeleton-promo"></div>
        </div>

        <!-- INDIKATOR STATUS PENGECEKAN SESI -->
        <div class="loading-status-wrap" id="statusBadge">
            <i class="fa-solid fa-circle-notch"></i>
            <span>Menyiapkan ruang belajar...</span>
        </div>

        <!-- SKELETON BOTTOM NAV -->
        <div class="skeleton-bottom-nav">
            <div class="shimmer skeleton-nav-item"></div>
            <div class="shimmer skeleton-nav-item"></div>
            <div class="shimmer skeleton-nav-item"></div>
            <div class="shimmer skeleton-nav-item"></div>
            <div class="shimmer skeleton-nav-item"></div>
        </div>

    </div>

    <!-- LOGIKA GATEKEEPER & ROUTER SEPERSKIAN DETIK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0", 
            authDomain: "mading-cf676.firebaseapp.com", 
            projectId: "mading-cf676", 
            storageBucket: "mading-cf676.firebasestorage.app", 
            messagingSenderId: "72175203671", 
            appId: "1:72175203671:web:7a0676a55beb64bc96ba12" 
        };

        const checkTimeout = setTimeout(() => {
            // Fallback cepat: Jika dalam 400ms pengecekan belum ada hasil, arahkan langsung ke /home/
            routeUser(null);
        }, 500);

        function routeUser(userStatus) {
            clearTimeout(checkTimeout);
            
            // 1. Cek penyimpanan lokal
            const localUser = localStorage.getItem('cendekia_user') || localStorage.getItem('user_status');
            const localPackage = localStorage.getItem('user_package') || 'home';

            if (!userStatus && !localUser) {
                // Pengguna Baru / Belum login -> Arahkan ke tampilan umum /home/
                window.location.replace('/home/');
                return;
            }

            // 2. Pengguna Terdaftar -> Arahkan ke modul sistemnya masing-masing
            const pkg = userStatus?.paket || localPackage;

            if (pkg === 'free' || pkg === 'mem-free') {
                window.location.replace('/mem-free/');
            } else if (pkg === '5k' || pkg === 'mem-5k') {
                window.location.replace('/mem-5k/');
            } else if (pkg === '10k' || pkg === '15k' || pkg === 'pro' || pkg === 'mem-pro') {
                window.location.replace('/mem-pro/');
            } else {
                // Default siswa kelas / program belajar terbimbing
                window.location.replace('/dashboard/index.html');
            }
        }

        try {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    try {
                        const snap = await getDoc(doc(db, 'users', user.uid));
                        if (snap.exists()) {
                            routeUser(snap.data());
                            return;
                        }
                    } catch(e) {}
                    routeUser({ uid: user.uid, role: 'siswa' });
                } else {
                    routeUser(null);
                }
            });
        } catch(e) {
            routeUser(null);
        }
    </script>

</body>
</html>
