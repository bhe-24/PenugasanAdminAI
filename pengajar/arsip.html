<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsip Mengajar - Cendekia Aksara</title>
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Aleo:wght@700&family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>

    <style>
        /* --- 1. GLOBAL & RESET --- */
        :root { 
            --nav-bg: #003366;       
            --nav-border: #d4af37;   
            --primary: #003366; 
            --primary-light: #005a9c;
            --accent: #d4af37;
            --accent-dark: #b45309;
            --bg-color: #f8fafc; 
            --text-dark: #1e293b; 
            --text-gray: #64748b; 
        }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent;}
        
        body { 
            font-family: 'Poppins', sans-serif; background-color: var(--bg-color); 
            margin: 0; color: var(--text-dark); padding-bottom: 50px; padding-top: 80px; overflow-x: hidden;
        }
        .container { max-width: 1000px; width: 95%; margin: 0 auto; padding: 15px; position: relative;}

        /* --- 2. FIXED NAVBAR --- */
        .top-navbar {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
            background: var(--nav-bg); border-bottom: 3px solid var(--nav-border);
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 20px; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .nav-brand { display: flex; align-items: center; gap: 12px; }
        .nav-brand img { 
            width: 40px; height: 40px; border-radius: 50%; 
            background: white; padding: 2px; border: 2px solid var(--nav-border);
        }
        .nav-brand h1 { 
            font-family: 'Aleo', serif; font-size: 1.3rem; 
            color: white; margin: 0; font-weight: 700; letter-spacing: 0.5px;
        }

        .btn-back-nav {
            background: rgba(255,255,255,0.1); color: white; text-decoration: none;
            padding: 8px 16px; border-radius: 50px; font-weight: 600; font-size: 0.85rem;
            transition: 0.3s; display: inline-flex; align-items: center; gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .btn-back-nav:hover { background: white; color: var(--primary); }

        /* --- 3. HERO BANNER --- */
        .hero-banner {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border-radius: 16px; padding: 25px; color: white;
            display: flex; flex-direction: column; justify-content: center;
            box-shadow: 0 10px 20px rgba(0, 51, 102, 0.15);
            margin-bottom: 25px; position: relative; overflow: hidden;
        }
        .hero-banner::after {
            content: '\f07b'; font-family: "Font Awesome 6 Free"; font-weight: 900;
            position: absolute; right: -10px; top: -20px; font-size: 8rem;
            color: rgba(212, 175, 55, 0.1); transform: rotate(-15deg); pointer-events: none;
        }
        .hero-title { font-size: 1.4rem; font-weight: 700; margin: 0 0 5px 0; color: var(--accent); z-index: 2; display: flex; align-items: center; gap: 10px;}
        .hero-subtitle { font-size: 0.9rem; color: #cbd5e1; margin: 0 0 15px 0; z-index: 2; line-height: 1.5;}
        
        .badge-osis {
            display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; 
            border-radius: 50px; font-size: 0.8rem; font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: white; 
            box-shadow: 0 2px 8px rgba(212, 175, 55, 0.4); width: fit-content; z-index: 2;
        }

        /* --- 4. TABLE CARD --- */
        .admin-card { background: white; border-radius: 16px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid #e2e8f0; margin-bottom: 30px; overflow-x: auto;}
        .section-title { font-family: 'Aleo', serif; color: var(--primary); font-size: 1.2rem; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; border-bottom: 2px dashed #f1f5f9; padding-bottom: 15px; }

        .report-table { width: 100%; border-collapse: collapse; min-width: 700px; }
        .report-table th, .report-table td { border: 1px solid #cbd5e1; padding: 12px 15px; text-align: left; font-size: 0.9rem; }
        .report-table th { background: var(--primary); color: white; font-weight: 600; font-family: 'Aleo', serif; letter-spacing: 0.5px;}
        .report-table tr { transition: 0.3s; }
        .report-table tr:nth-child(even) { background: #f8fafc; }
        .report-table tr:hover { background: #f1f5f9; }
        
        .btn-print { background: #fee2e2; color: #991b1b; padding: 8px 12px; border-radius: 8px; border: 1px solid #fca5a5; cursor: pointer; transition: 0.3s; font-size: 0.9rem; display: inline-flex; justify-content: center; align-items: center; gap: 5px; font-family: 'Poppins'; font-weight: 600;}
        .btn-print:hover { background: #ef4444; color: white; }

        /* LOADING */
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--nav-bg); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; transition: 0.4s; }
        #loading-screen h3 { font-family: 'Poppins', sans-serif; font-size: 1.1rem; font-weight: 400; color: #cbd5e1; margin: 0 0 10px 0;}

        /* MOBILE */
        @media (max-width: 768px) {
            .nav-brand h1 { font-size: 1.1rem; }
            .btn-back-nav span { display: none; }
            .admin-card { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- LOADING SCREEN -->
    <div id="loading-screen">
        <i class="fa-solid fa-folder-open fa-bounce" style="font-size: 3rem; margin-bottom: 20px; color: var(--accent);"></i>
        <h3 id="loading-msg">Membuka Laci Arsip...</h3>
    </div>

    <!-- NAVBAR FIXED -->
    <header class="top-navbar">
        <div class="nav-brand">
            <img src="https://i.imgur.com/5Srjyo4.png" alt="Logo">
            <h1>Ruang Pengajar</h1>
        </div>
        <a href="index.html" class="btn-back-nav">
            <i class="fa-solid fa-arrow-left"></i> <span>Dasbor</span>
        </a>
    </header>

    <main class="container" style="display: none;" id="main-content">
        
        <!-- HERO BANNER RUANGAN -->
        <div class="hero-banner">
            <h2 class="hero-title"><i class="fa-solid fa-folder-open"></i> Arsip Jurnal & Presensi</h2>
            <p class="hero-subtitle">Tinjau kembali histori mengajar Anda dan unduh salinan PDF laporan presensi kelas sebelumnya.</p>
            <div class="badge-osis"><i class="fa-solid fa-user-tie"></i> Pengajar: <span id="pengajar-name-badge">Memuat...</span></div>
        </div>

        <div class="admin-card">
            <h2 class="section-title"><i class="fa-solid fa-clock-rotate-left"></i> Histori Sesi Kelas</h2>
            
            <table class="report-table">
                <thead>
                    <tr>
                        <th>Tanggal</th>
                        <th>Kelas / Semester</th>
                        <th>Mata Pelajaran & Topik</th>
                        <th>Durasi</th>
                        <th style="text-align: center;">Cetak PDF</th>
                    </tr>
                </thead>
                <tbody id="arsip-tbody">
                    <!-- Data akan dimuat dengan JS -->
                </tbody>
            </table>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, doc, getDoc, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0", 
            authDomain: "mading-cf676.firebaseapp.com", 
            projectId: "mading-cf676", 
            storageBucket: "mading-cf676.firebasestorage.app", 
            messagingSenderId: "72175203671", 
            appId: "1:72175203671:web:7a0676a55beb64bc96ba12" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let records = [];

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, 'users', user.uid));
                if (userDoc.exists() && userDoc.data().role === 'pengajar') {
                    currentUser = { uid: user.uid, ...userDoc.data() };
                    
                    // Set Name in Hero Banner
                    document.getElementById('pengajar-name-badge').innerText = currentUser.name || "Pengajar";

                    document.getElementById('loading-screen').style.opacity = '0';
                    setTimeout(() => {
                        document.getElementById('loading-screen').style.display = 'none';
                        document.getElementById('main-content').style.display = 'block';
                        loadArsip();
                    }, 400);
                } else {
                    window.location.href = '../index.html';
                }
            } else {
                window.location.href = '../index.html';
            }
        });

        async function loadArsip() {
            const tbody = document.getElementById('arsip-tbody');
            try {
                const q = query(collection(db, 'arsipPresensi'), where('pengajarId', '==', currentUser.uid), orderBy('createdAt', 'desc'));
                const snap = await getDocs(q);
                tbody.innerHTML = '';
                records = [];

                if(snap.empty) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 20px; color:#94a3b8; font-style: italic;">Belum ada riwayat mengajar yang terekam di database.</td></tr>';
                    return;
                }

                snap.forEach(d => {
                    const data = d.data();
                    records.push({id: d.id, ...data});
                    
                    const displayClass = data.className || 'Kelas Reguler';
                    
                    tbody.innerHTML += `
                        <tr>
                            <td style="font-weight: 600; color: #64748b; white-space: nowrap;"><i class="fa-regular fa-calendar-check"></i> ${data.tanggal}</td>
                            <td><strong style="color: var(--primary);">${displayClass}</strong><br><span style="font-size: 0.8rem; color:#64748b;">Semester ${data.semester}</span></td>
                            <td><strong style="color: var(--text-dark);">${data.matkul}</strong><br><span style="font-size: 0.8rem; color:#64748b;">${data.materi}</span></td>
                            <td style="font-weight: 700; color: #0284c7; white-space: nowrap;">${data.durasi} Menit</td>
                            <td style="text-align: center;">
                                <button onclick="reprintPDF('${d.id}')" class="btn-print" title="Cetak Ulang PDF">
                                    <i class="fa-solid fa-file-pdf"></i> Cetak
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch(e) { 
                console.error(e);
                Swal.fire('Error', 'Gagal memuat arsip data. Pastikan koneksi internet stabil.', 'error');
            }
        }

        window.reprintPDF = (id) => {
            const data = records.find(r => r.id === id);
            if(!data) return;

            const tableBody = [[{text:'No', style:'th'}, {text:'Nama Siswa', style:'th'}, {text:'Status / Kehadiran', style:'th'}]];
            let i = 1;
            Object.values(data.presensi).sort((a,b)=>a.name.localeCompare(b.name)).forEach(s => {
                let color = '#ef4444'; // default red
                if (s.status === 'Hadir') color = '#10b981';
                else if (s.status === 'Izin') color = '#f59e0b';
                else if (s.status.includes('Bimbingan')) color = '#0284c7';

                tableBody.push([{text: i++, alignment:'center'}, s.name, {text: s.status, color, bold:true, alignment:'center'}]);
            });

            const displayClass = data.className || 'Kelas Reguler';

            const docDefinition = {
                pageSize: 'A4',
                content: [
                    { text: 'SALINAN LAPORAN PRESENSI & JURNAL KELAS', style: 'header' },
                    { text: 'CENDEKIA AKSARA', style: 'subheader' },
                    { canvas: [{ type: 'line', x1: 0, y1: 0, x2: 515, y2: 0, lineWidth: 2, lineColor: '#d4af37' }] },
                    { text: `\nPengajar: ${data.pengajarName}`, bold:true, color: '#1e293b' },
                    { text: `Kelas: ${displayClass} (Semester ${data.semester})`, color: '#475569' },
                    { text: `Mata Pelajaran: ${data.matkul}`, color: '#475569' },
                    { text: `Waktu: ${data.tanggal} (${data.jamMulai} - ${data.jamSelesai} WIB)`, color: '#475569' },
                    { text: `Durasi: ${data.durasi} Menit`, color: '#475569' },
                    { text: `Materi Pokok: ${data.materi}\n\n`, color: '#475569' },
                    { table: { headerRows:1, widths:['auto', '*', 'auto'], body:tableBody }, layout:'lightHorizontalLines' }
                ],
                styles: {
                    header: { fontSize: 16, bold: true, alignment: 'center', color: '#003366' },
                    subheader: { fontSize: 12, alignment: 'center', margin: [0, 5, 0, 10], color: '#64748b' },
                    th: { bold: true, fillColor: '#f1f5f9', alignment: 'center', margin: [0,5,0,5] }
                }
            };
            pdfMake.createPdf(docDefinition).download(`Salinan_Presensi_${displayClass.replace(/\s/g,'_')}.pdf`);
        };
    </script>
</body>
</html>
