<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Revisi Tulisan - Member 10K Cendekia</title>
    
    <link rel="icon" type="image/png" sizes="512x512" href="https://i.imgur.com/5Srjyo4.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/mem-10k/central.css">
</head>
<body>

    <div class="mobile-app-wrapper">

        <header class="app-header">
            <div style="display:flex; align-items:center; gap:10px;">
                <a href="/mem-10k/berkarya.html" class="btn-header-back" title="Kembali">
                    <i data-lucide="arrow-left" style="width:18px; height:18px;"></i>
                </a>
                <div>
                    <h1 class="header-brand-title" style="display:flex; align-items:center; gap:6px;">
                        <i data-lucide="file-pen-line" style="width:18px; height:18px; color:#059669;"></i> Revisi Tulisan
                    </h1>
                    <div class="header-brand-sub">Penyempurnaan Diksi &amp; Ejaan</div>
                </div>
            </div>
            <button type="button" class="btn-primary-challenge" style="padding:6px 12px; font-size:0.72rem; width:auto;" onclick="runRevisionAudit()">
                <i data-lucide="search" style="width:13px; height:13px;"></i> Telaah Draf
            </button>
        </header>

        <main class="app-body">

            <div style="background:white; border-radius:var(--radius-md); padding:16px; border:1px solid var(--border-soft); box-shadow:var(--shadow-sm);">
                <div style="font-size:0.72rem; color:var(--text-muted); font-weight:700; margin-bottom:8px;">
                    Tempelkan Naskah yang Ingin Direvisi:
                </div>
                <textarea id="rawDraft" class="editor-textarea" style="min-height:200px;" placeholder="Tempelkan paragraf naskahmu di sini untuk mendeteksi kata berulang, kalimat terlalu panjang, atau pemborosan kata..."></textarea>
            </div>

            <!-- HASIL DIAGNOSTIK REVISI -->
            <div id="revisionAuditBox" style="background:#f8fafc; border-radius:var(--radius-md); padding:16px; border:1.5px solid var(--border-soft); display:none;">
                <strong style="font-size:0.86rem; color:var(--primary); display:block; margin-bottom:8px;">
                    <i data-lucide="clipboard-check" style="width:16px; height:16px; display:inline-block; vertical-align:middle; color:#059669;"></i> Laporan Diagnostik Sistem:
                </strong>
                <div id="auditNotes" style="font-size:0.74rem; color:var(--text-body); line-height:1.5;"></div>
            </div>

            <div class="app-footer-copyright">
                &copy; 2026 PT Cendekia Aksara Edukasi. Seluruh Hak Cipta Dilindungi.
            </div>

        </main>

    </div>

    <script src="/mem-10k/central.js"></script>
    <script>
        function runRevisionAudit() {
            const text = document.getElementById('rawDraft').value.trim();
            if (text.length < 15) {
                alert('Masukkan teks naskah minimal 15 karakter.');
                return;
            }

            const box = document.getElementById('revisionAuditBox');
            const notes = document.getElementById('auditNotes');
            box.style.display = 'block';

            // Deteksi pola umum
            const pleonasms = ['agar supaya', 'sangat sekali', 'adalah merupakan', 'seperti misalnya'];
            let foundPleonasms = [];
            pleonasms.forEach(p => {
                if (text.toLowerCase().includes(p)) foundPleonasms.push(p);
            });

            let html = `<b>Jumlah Kata:</b> ${text.split(/\s+/).length} Kata.<br><br>`;
            if (foundPleonasms.length > 0) {
                html += `<span style="color:#dc2626;"><b>Ditemukan Pemborosan Kata (Pleonasme):</b></span><br>`;
                foundPleonasms.forEach(p => {
                    html += `&bull; Frasa "<i>${p}</i>" dapat disederhanakan menjadi salah satunya saja.<br>`;
                });
            } else {
                html += `<span style="color:#059669;"><b>Hemat Kata:</b> Tidak terdeteksi frasa mubazir umum. Pilihan katamu sudah cukup efisien.</span><br>`;
            }

            html += `<br><b>Saran Perbaikan Struktur:</b><br>&bull; Pastikan tanda petik ("...") pada dialog diapit tanda koma di bagian dalam sebelum kutipan ditutup.<br>&bull; Bervariasikan panjang kalimat agar narasi terdengar berirama dan tidak monoton.`;

            notes.innerHTML = html;
            CendekiaApp.addXP(15, 'Telaah Revisi Draf');
            if (window.lucide) lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', () => {
            CendekiaApp.renderBottomNav('berkarya');

            const user = CendekiaApp.getUser();
            });
    </script>
</body>
</html>
