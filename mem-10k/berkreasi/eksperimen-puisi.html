<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eksperimen Puisi - Member 10K Cendekia</title>
    
    <link rel="icon" type="image/png" sizes="512x512" href="https://i.imgur.com/5Srjyo4.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/mem-10k/central.css">
</head>
<body>

    <div class="mobile-app-wrapper">

        <header class="app-header">
            <div style="display:flex; align-items:center; gap:10px;">
                <a href="/mem-10k/berkreasi.html" class="btn-header-back" title="Kembali">
                    <i data-lucide="arrow-left" style="width:18px; height:18px;"></i>
                </a>
                <div>
                    <h1 class="header-brand-title" style="display:flex; align-items:center; gap:6px;">
                        <i data-lucide="feather" style="width:18px; height:18px; color:#d4af37;"></i> Eksperimen Puisi
                    </h1>
                    <div class="header-brand-sub">Generator Larik &amp; Rima Acak</div>
                </div>
            </div>
            <span class="badge-tier-5k">Kreativitas Kata</span>
        </header>

        <main class="app-body">

            <div style="background:white; border-radius:var(--radius-md); padding:16px; border:1px solid var(--border-soft); box-shadow:var(--shadow-sm); text-align:center;">
                <div style="font-size:0.72rem; color:var(--text-muted); font-weight:700;">Tiga Kata Diksi Pemicu:</div>
                <div id="wordTrio" style="display:flex; justify-content:center; gap:8px; margin:12px 0;">
                    <span style="background:#fff8e7; color:#b89124; font-weight:800; padding:4px 12px; border-radius:var(--radius-full); font-size:0.75rem;">Hujan</span>
                    <span style="background:#fff8e7; color:#b89124; font-weight:800; padding:4px 12px; border-radius:var(--radius-full); font-size:0.75rem;">Lentera</span>
                    <span style="background:#fff8e7; color:#b89124; font-weight:800; padding:4px 12px; border-radius:var(--radius-full); font-size:0.75rem;">Sunyi</span>
                </div>

                <div id="poemGenerated" style="font-family:'Poppins', serif; font-style:italic; font-size:0.88rem; color:#451a03; line-height:1.7; background:#fffdf5; padding:16px; border-radius:var(--radius-sm); border:1px solid var(--accent); margin-bottom:14px;">
                    "Di batas hening malam merayap<br>
                    hujan mengetuk kaca berderap<br>
                    lentera tua bergoyang perlahan<br>
                    menemani sunyi dalam penantian."
                </div>

                <div style="display:flex; gap:8px;">
                    <button type="button" class="btn-primary-challenge" style="flex:1; background:#d4af37; color:#001f3f;" onclick="rerollPoem()">
                        <i data-lucide="shuffle" style="width:15px; height:15px;"></i> Acak Bait Lain
                    </button>
                    <button type="button" class="btn-modal-secondary" style="width:auto;" onclick="savePoemExperiment()">
                        <i data-lucide="bookmark" style="width:15px; height:15px;"></i> Simpan
                    </button>
                </div>
            </div>

            <div style="background:white; border-radius:var(--radius-md); padding:16px; border:1px solid var(--border-soft); text-align:center;">
                <button type="button" class="btn-primary-challenge" onclick="sendToPoemEditor()">
                    <i data-lucide="pen-tool" style="width:15px; height:15px;"></i> Buka di Studio Puisi
                </button>
            </div>

            <div class="app-footer-copyright">
                &copy; 2026 PT Cendekia Aksara Edukasi. Seluruh Hak Cipta Dilindungi.
            </div>

        </main>

    </div>

    <script src="/mem-10k/central.js"></script>
    <script>
        const trios = [
            { words: ["Hujan", "Lentera", "Sunyi"], poem: "Di batas hening malam merayap<br>hujan mengetuk kaca berderap<br>lentera tua bergoyang perlahan<br>menemani sunyi dalam penantian." },
            { words: ["Angin", "Daun", "Kenangan"], poem: "Ketika angin menyapu dahan rapuh<br>selembar daun kering luruh mengaduh<br>di atas tanah kenangan rebah<br>menyimpan kisah yang tak sempat sudah." },
            { words: ["Ombak", "Karang", "Jejak"], poem: "Debur ombak mengikis waktu<br>pada batu karang yang membisu<br>setiap jejak yang kau titipkan<br>kini tenggelam dalam lautan." }
        ];

        let tIndex = 0;

        function rerollPoem() {
            tIndex = (tIndex + 1) % trios.length;
            const cur = trios[tIndex];

            const trioDiv = document.getElementById('wordTrio');
            trioDiv.innerHTML = cur.words.map(w => `<span style="background:#fff8e7; color:#b89124; font-weight:800; padding:4px 12px; border-radius:var(--radius-full); font-size:0.75rem;">${w}</span>`).join('');
            document.getElementById('poemGenerated').innerHTML = `"${cur.poem}"`;
        }

        function savePoemExperiment() {
            const cur = trios[tIndex];
            CendekiaApp.saveIdea({
                title: 'Bait: ' + cur.words.join(' - '),
                content: cur.poem.replace(/<br>/g, '\n'),
                category: 'Eksperimen Puisi'
            });
            alert('Bait puisi tersimpan di Arsip Ide!');
        }

        function sendToPoemEditor() {
            window.location.href = '/mem-10k/berkarya/menulis-puisi.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            CendekiaApp.renderBottomNav('beranda');
        });
    </script>
</body>
</html>
