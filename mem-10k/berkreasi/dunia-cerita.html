<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dunia Cerita - Member 10K Cendekia</title>
    
    <link rel="icon" type="image/png" sizes="512x512" href="https://i.imgur.com/5Srjyo4.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/mem-10k/central.css">
</head>
<body>

    <div class="mobile-app-wrapper">

        <header class="app-header">
            <div style="display:flex; align-items:center; gap:10px;">
                <a href="/mem-10k/berkreasi.html" class="btn-header-back" title="Kembali">
                    <i data-lucide="arrow-left" style="width:18px; height:18px;"></i>
                </a>
                <div>
                    <h1 class="header-brand-title" style="display:flex; align-items:center; gap:6px;">
                        <i data-lucide="globe" style="width:18px; height:18px; color:var(--primary);"></i> Dunia Cerita
                    </h1>
                    <div class="header-brand-sub">Worldbuilding &amp; Eksplorasi Latar</div>
                </div>
            </div>
            <button type="button" class="btn-primary-challenge" style="padding:6px 12px; font-size:0.72rem; width:auto;" onclick="saveWorld()">
                <i data-lucide="save" style="width:13px; height:13px;"></i> Simpan
            </button>
        </header>

        <main class="app-body">

            <div style="background:white; border-radius:var(--radius-md); padding:16px; border:1px solid var(--border-soft); box-shadow:var(--shadow-sm);">
                <div style="margin-bottom:10px;">
                    <label style="font-size:0.68rem; font-weight:700; color:var(--text-muted); display:block; margin-bottom:4px;">Nama Kota / Semesta Cerita:</label>
                    <input type="text" id="wName" value="Kota Pelabuhan Arungbatu" style="width:100%; border:1.5px solid var(--border-soft); border-radius:var(--radius-sm); padding:8px 10px; font-size:0.8rem; outline:none; font-family:inherit;">
                </div>

                <div style="margin-bottom:10px;">
                    <label style="font-size:0.68rem; font-weight:700; color:var(--text-muted); display:block; margin-bottom:4px;">Atmosfer &amp; Iklim Khas:</label>
                    <input type="text" id="wClimate" value="Kabut garam tebal setiap senja dengan deru ombak menabrak tebing karang hitam" style="width:100%; border:1.5px solid var(--border-soft); border-radius:var(--radius-sm); padding:8px 10px; font-size:0.8rem; outline:none; font-family:inherit;">
                </div>

                <div style="margin-bottom:10px;">
                    <label style="font-size:0.68rem; font-weight:700; color:var(--text-muted); display:block; margin-bottom:4px;">Aturan / Pantangan Unik Warga:</label>
                    <textarea id="wRule" style="width:100%; border:1.5px solid var(--border-soft); border-radius:var(--radius-sm); padding:8px 10px; font-size:0.8rem; outline:none; font-family:inherit; min-height:60px;">Dilarang menyalakan lentera kaca di dermaga barat setelah matahari tenggelam sempurna.</textarea>
                </div>

                <div style="margin-bottom:10px;">
                    <label style="font-size:0.68rem; font-weight:700; color:var(--text-muted); display:block; margin-bottom:4px;">Misteri Terbesar yang Terkubur:</label>
                    <textarea id="wMystery" style="width:100%; border:1.5px solid var(--border-soft); border-radius:var(--radius-sm); padding:8px 10px; font-size:0.8rem; outline:none; font-family:inherit; min-height:60px;">Bangkai kapal uap raksasa yang karam 50 tahun lalu konon masih membunyikan peluitnya tiap purnama.</textarea>
                </div>

                <button type="button" class="btn-primary-challenge" style="width:100%;" onclick="saveWorld()">
                    <i data-lucide="bookmark" style="width:14px; height:14px;"></i> Simpan Latar Dunia ke Arsip
                </button>
            </div>

            <div class="app-footer-copyright">
                &copy; 2026 PT Cendekia Aksara Edukasi. Seluruh Hak Cipta Dilindungi.
            </div>

        </main>

    </div>

    <script src="/mem-10k/central.js"></script>
    <script>
        function saveWorld() {
            const name = document.getElementById('wName').value.trim() || 'Dunia Baru';
            const climate = document.getElementById('wClimate').value.trim();
            const rule = document.getElementById('wRule').value.trim();
            const mystery = document.getElementById('wMystery').value.trim();

            const text = `Dunia: ${name}\nAtmosfer: ${climate}\nAturan: ${rule}\nMisteri: ${mystery}`;
            CendekiaApp.saveIdea({
                title: 'Latar: ' + name,
                content: text,
                category: 'Dunia Cerita'
            });
            alert('Latar dunia berhasil disimpan ke Arsip Ide!');
        }

        document.addEventListener('DOMContentLoaded', () => {
            CendekiaApp.renderBottomNav('beranda');
        });
    </script>
</body>
</html>
