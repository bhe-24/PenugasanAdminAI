<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tebak Sastra - Member 10K Cendekia</title>
    
    <link rel="icon" type="image/png" sizes="512x512" href="https://i.imgur.com/5Srjyo4.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/vfs_fonts.js"></script>
    <link rel="stylesheet" href="/mem-10k/central.css">

    <style>
        .quote-box {
            background: #f8fafc; border-radius: var(--radius-md); padding: 16px;
            font-size: 0.82rem; font-style: italic; color: #1e293b; line-height: 1.6;
            border-left: 3px solid #059669; margin: 14px 0 16px;
        }
        .ans-btn {
            display: block; width: 100%; text-align: left; padding: 11px 14px;
            border-radius: var(--radius-md); border: 1.5px solid var(--border-soft);
            background: #ffffff; font-size: 0.8rem; font-weight: 600; color: var(--text-dark);
            margin-bottom: 8px; cursor: pointer; transition: all 0.2s;
        }
        .ans-btn:hover { border-color: #059669; background: #ecfdf5; }
        .ans-btn.correct { background: #ecfdf5; border-color: #059669; color: #065f46; font-weight: 800; }
        .ans-btn.wrong { background: #fef2f2; border-color: #dc2626; color: #991b1b; }
    </style>
</head>
<body>

    <div class="mobile-app-wrapper">

        <header class="app-header">
            <div style="display:flex; align-items:center; gap:10px;">
                <a href="/mem-10k/bermain.html" class="btn-header-back" title="Kembali ke Menu Bermain">
                    <i data-lucide="arrow-left" style="width:18px; height:18px;"></i>
                </a>
                <div>
                    <h1 class="header-brand-title" style="display:flex; align-items:center; gap:6px;">
                        <i data-lucide="book-open" style="width:18px; height:18px; color:#059669;"></i> Tebak Sastra
                    </h1>
                    <div class="header-brand-sub" id="sastraSubMeta">10 Kutipan Sastra &bull; Reset Jam 00:00 WIB</div>
                </div>
            </div>
            <div style="display:flex; align-items:center; gap:6px;">
                <span id="modeBadgePill" style="font-size:0.65rem; font-weight:800; padding:4px 8px; border-radius:var(--radius-full); background:#ede9fe; color:#6d28d9;">Santai</span>
                <div style="background:#d1fae5; color:#065f46; font-size:0.72rem; font-weight:800; padding:4px 10px; border-radius:var(--radius-full);">
                    Skor: <span id="gameScore">0</span>
                </div>
            </div>
        </header>

        <main class="app-body">

            <div id="gameLoadingState" style="text-align:center; padding:50px 20px; background:white; border-radius:var(--radius-md); border:1px solid var(--border-soft);">
                <i data-lucide="loader" style="width:32px; height:32px; animation:spin 1s linear infinite; margin-bottom:12px; color:var(--primary);"></i>
                <h3 style="font-size:0.95rem; font-weight:800; color:var(--primary); margin-bottom:4px;">Menyiapkan Tebak Sastra...</h3>
                <p id="loadingSubtitle" style="font-size:0.75rem; color:var(--text-muted);">Menyeleksi 10 butir soal dari Bank Soal anti-repetisi...</p>
            </div>

            <div id="gameContainer" style="background:white; border-radius:var(--radius-md); padding:16px; border:1px solid var(--border-soft); box-shadow:var(--shadow-sm); display:none;">
                <div style="display:flex; justify-content:space-between; align-items:center; font-size:0.72rem; color:var(--text-muted); font-weight:700;">
                    <span>Soal <span id="roundIdx">1</span> dari <span id="roundTotal">10</span></span>
                    <span style="color:#059669;"><i data-lucide="award" style="width:13px; height:13px; display:inline-block; vertical-align:middle;"></i> +20 XP</span>
                </div>

                <div class="quote-box" id="quoteText">...</div>
                <div style="font-size:0.82rem; font-weight:800; color:var(--primary); margin-bottom:12px;" id="sastraQuestion">...</div>
                <div id="authorOptions"></div>
                <div id="sastraFeedback" style="margin-top:14px; display:none; padding:12px; border-radius:var(--radius-sm); font-size:0.76rem; line-height:1.45;"></div>
            </div>

            <div class="app-footer-copyright">
                &copy; 2026 PT Cendekia Aksara Edukasi. Seluruh Hak Cipta Dilindungi.
            </div>
        </main>

    </div>

    <script src="/mem-10k/central.js"></script>
    <script>
        let sastraRounds = [];
        let rIndex = 0;
        let isRoundAnswered = false;
        let score = 0;
        let playedRecords = [];
        let currentMode = 'santai';
        let qStartTime = Date.now();
        let locked = false;

        async function initGameEngine() {
            const loadingState = document.getElementById('gameLoadingState');
            const gameContainer = document.getElementById('gameContainer');
            const urlParams = new URLSearchParams(window.location.search);
            currentMode = urlParams.get('mode') || localStorage.getItem('cendekia_active_game_mode') || 'santai';

            const pill = document.getElementById('modeBadgePill');
            if (pill) pill.textContent = currentMode.charAt(0).toUpperCase() + currentMode.slice(1);

            const completed = CendekiaApp.getGameResult('tebak_sastra');
            if (completed) {
                loadingState.style.display = 'none';
                gameContainer.style.display = 'block';
                showCompletedScreen(completed);
                return;
            }

            await CendekiaApp.ensureDailyGame('tebak_sastra', {
                mode: currentMode,
                onReady: (items, meta) => {
                    loadingState.style.display = 'none';
                    gameContainer.style.display = 'block';
                    sastraRounds = items || [];

                    const draft = (meta && meta.draftData) || CendekiaApp.getGameDraft('tebak_sastra');
                    if (draft && draft.currentIndex > 0 && draft.currentIndex < sastraRounds.length) {
                        rIndex = draft.currentIndex;
                        score = draft.score || 0;
                        playedRecords = draft.playedRecords || [];
                        document.getElementById('gameScore').textContent = score;
                        setTimeout(() => CendekiaApp.showEncouragementToast(`Melanjutkan Tebak Sastra ke-${rIndex + 1}! ✍️`), 400);
                    } else {
                        CendekiaApp.saveGameDraft('tebak_sastra', {
                            questions: sastraRounds,
                            currentIndex: 0,
                            score: 0,
                            playedRecords: [],
                            mode: currentMode
                        });
                    }
                    loadRound();
                }
            });
        }

        function loadRound() {
            isRoundAnswered = false;
            if (rIndex >= sastraRounds.length) { finishGameRound(); return; }
            locked = false;
            qStartTime = Date.now();
            const cur = sastraRounds[rIndex];
            document.getElementById('roundIdx').textContent = rIndex + 1;
            document.getElementById('roundTotal').textContent = sastraRounds.length;
            document.getElementById('quoteText').textContent = `"${cur.quote || cur.kutipan || ''}"`;
            document.getElementById('sastraQuestion').textContent = cur.question || cur.q || 'Siapakah penulis / gaya bahasa pada kutipan di atas?';
            document.getElementById('sastraFeedback').style.display = 'none';

            const optWrap = document.getElementById('authorOptions');
            optWrap.innerHTML = '';
            (cur.options || []).forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'ans-btn';
                btn.textContent = `${String.fromCharCode(65 + i)}. ${opt}`;
                btn.onclick = () => selectAnswer(i, btn);
                optWrap.appendChild(btn);
            });
            if (window.lucide) lucide.createIcons();
        }

        function selectAnswer(chosenIdx, btnEl) {
            if (locked) return;
            locked = true;
            const cur = sastraRounds[rIndex];
            const correctIdx = cur.answer !== undefined ? cur.answer : (cur.correctIndex || 0);
            const isCorrect = chosenIdx === correctIdx;
            const opts = cur.options || [];

            document.querySelectorAll('.ans-btn').forEach((b, i) => {
                b.disabled = true;
                if (i === correctIdx) b.classList.add('correct');
                else if (i === chosenIdx && !isCorrect) b.classList.add('wrong');
            });

            if (isCorrect) {
                const fast = (Date.now() - qStartTime) / 1000 <= 8;
                const pts = fast ? 25 : 20;
                score += pts;
                document.getElementById('gameScore').textContent = score;
                CendekiaApp.addXP(pts, fast ? 'Tebak Sastra Bonus Cepat' : 'Tebak Sastra Tepat');
            }

            playedRecords.push({
                q: `"${cur.quote || ''}" — ${cur.question || ''}`,
                isCorrect,
                selectedText: opts[chosenIdx] || '-',
                correctText: opts[correctIdx] || '-',
                exp: cur.exp || cur.explanation || ''
            });

            CendekiaApp.saveGameDraft('tebak_sastra', {
                questions: sastraRounds,
                currentIndex: rIndex + 1,
                score,
                playedRecords,
                mode: currentMode
            });

            const fb = document.getElementById('sastraFeedback');
            fb.style.display = 'block';
            fb.style.background = isCorrect ? '#ecfdf5' : '#fef2f2';
            fb.style.color = isCorrect ? '#065f46' : '#991b1b';
            fb.style.border = `1px solid ${isCorrect ? '#a7f3d0' : '#fecaca'}`;
            fb.innerHTML = `
                <strong>${isCorrect ? 'Tepat Sekali! 🎉' : 'Belum Tepat'}</strong><br>
                ${cur.exp || `Jawaban benar: ${opts[correctIdx] || '-'}`}<br><br>
                <button type="button" class="btn-primary-challenge" style="padding:7px 14px; font-size:0.75rem;" onclick="nextRound()">
                    ${rIndex + 1 < sastraRounds.length ? 'Soal Berikutnya &rarr;' : 'Lihat Hasil &amp; Evaluasi &rarr;'}
                </button>
            `;
        }

        function nextRound() {
            rIndex++;
            loadRound();
        }

        async function finishGameRound() {
            const total = sastraRounds.length || 10;
            const correctCount = playedRecords.filter(r => r.isCorrect).length;
            const finalScore = Math.min(100, Math.round((correctCount / total) * 100));
            const resultData = { score: finalScore, correctCount, totalCount: total, xpEarned: score, questions: playedRecords, mode: currentMode };
            await CendekiaApp.saveGameResult('tebak_sastra', resultData);
            CendekiaApp.clearGameDraft('tebak_sastra');
            CendekiaApp.completeChallenge('tc_3');
            showCompletedScreen(resultData);
        }

        function showCompletedScreen(data) {
            const container = document.getElementById('gameContainer');
            const total = data.totalCount || 10;
            const correct = data.correctCount || 0;
            const wrong = total - correct;
            const records = data.questions || [];

            let reviewHtml = records.map((item, idx) => `
                <div style="background:white; border-radius:var(--radius-sm); border:1px solid ${item.isCorrect ? '#a7f3d0' : '#fecaca'}; padding:12px; margin-bottom:10px;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
                        <span style="font-size:0.7rem; font-weight:800; background:var(--primary); color:white; padding:2px 8px; border-radius:4px;">Soal #${idx + 1}</span>
                        <span style="font-size:0.68rem; font-weight:800; color:${item.isCorrect ? '#059669' : '#dc2626'};">${item.isCorrect ? 'Benar ✓' : 'Salah ✗'}</span>
                    </div>
                    <div style="font-size:0.75rem; color:var(--text-body); margin-bottom:6px;">${item.q}</div>
                    <div style="font-size:0.72rem; background:${item.isCorrect ? '#f0fdf4' : '#fef2f2'}; padding:6px 10px; border-radius:6px; margin-bottom:5px; color:${item.isCorrect ? '#166534' : '#991b1b'};">
                        ${item.isCorrect ? `<b>Jawaban Anda:</b> ${item.selectedText} ✓` : `<b>Jawaban Anda:</b> ${item.selectedText} &bull; <b>Kunci:</b> ${item.correctText}`}
                    </div>
                    <div style="font-size:0.7rem; color:var(--text-muted); font-style:italic;">${item.exp || ''}</div>
                </div>
            `).join('');

            let vocabHtml = records.map(item => `
                <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:10px 12px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:3px;">
                        <strong style="font-size:0.84rem; color:var(--primary);">${item.correctText}</strong>
                        <span style="font-size:0.62rem; font-weight:700; color:#059669; background:#d1fae5; padding:2px 6px; border-radius:4px;">Khazanah Sastra</span>
                    </div>
                    <div style="font-size:0.72rem; color:var(--text-body); line-height:1.4;">${item.exp || '-'}</div>
                </div>
            `).join('');

            container.innerHTML = `
                <div style="text-align:center; padding:14px 6px 18px; border-bottom:1px solid #e2e8f0; margin-bottom:16px;">
                    <div style="width:76px; height:76px; border-radius:50%; background:#ecfdf5; color:#059669; font-size:1.85rem; font-weight:800; display:flex; align-items:center; justify-content:center; margin:0 auto 10px; border:3px solid #a7f3d0;">${data.score || 0}</div>
                    <h2 style="font-size:1.12rem; font-weight:800; color:var(--primary); margin-bottom:4px;">Hasil Tebak Sastra</h2>
                    <div style="font-size:0.74rem; color:#059669; font-weight:700; margin-bottom:12px;">Selesai Dikerjakan Hari Ini &bull; Mode: <b>${data.mode || 'Santai'}</b></div>
                    <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px;">
                        <div style="background:#f8fafc; padding:9px 6px; border-radius:8px; border:1px solid #e2e8f0;"><div style="font-size:0.66rem; color:var(--text-muted);">Benar</div><div style="font-size:1rem; font-weight:800; color:#059669;">${correct}</div></div>
                        <div style="background:#f8fafc; padding:9px 6px; border-radius:8px; border:1px solid #e2e8f0;"><div style="font-size:0.66rem; color:var(--text-muted);">Salah</div><div style="font-size:1rem; font-weight:800; color:#dc2626;">${wrong}</div></div>
                        <div style="background:#f8fafc; padding:9px 6px; border-radius:8px; border:1px solid #e2e8f0;"><div style="font-size:0.66rem; color:var(--text-muted);">XP</div><div style="font-size:1rem; font-weight:800; color:#7c3aed;">+${data.xpEarned || 0}</div></div>
                    </div>
                    <button type="button" class="btn-primary-challenge" style="width:100%; padding:11px; margin-bottom:8px;" onclick="downloadSastraPDF()">
                        <i data-lucide="file-down" style="width:16px; height:16px;"></i> Unduh Laporan Evaluasi &amp; Kartu Nilai (PDF)
                    </button>
                    <div style="font-size:0.7rem; color:var(--text-muted);">Reset kembali jam <strong>00:00 WIB</strong> (<span class="resetCountdownText">--:--:--</span>)</div>
                </div>
                <h3 style="font-size:0.86rem; font-weight:800; color:var(--primary); margin-bottom:10px;">Lembar Pembahasan Soal (${total} Butir)</h3>
                ${reviewHtml}
                <h3 style="font-size:0.86rem; font-weight:800; color:var(--primary); margin:16px 0 10px;">Koleksi Khazanah &amp; Istilah Sastra</h3>
                <div style="display:flex; flex-direction:column; gap:8px;">${vocabHtml}</div>
            `;
            if (window.lucide) lucide.createIcons();
            const tick = () => document.querySelectorAll('.resetCountdownText').forEach(el => el.textContent = CendekiaApp.formatCountdownToMidnightWIB());
            tick(); setInterval(tick, 1000);
        }

        window.downloadSastraPDF = () => {
            const res = CendekiaApp.getGameResult('tebak_sastra');
            if (res) CendekiaApp.downloadEvaluationPDF({ ...res, title: 'Laporan Evaluasi Pembelajaran - Tebak Sastra (Member 10K)' }, CendekiaApp.getUser());
        };

        document.addEventListener('DOMContentLoaded', () => {
            CendekiaApp.renderBottomNav('bermain');
            initGameEngine();
        });
    </script>
</body>
</html>
