<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menulis Novel - Member Free Cendekia</title>
    
    <link rel="icon" type="image/png" sizes="512x512" href="https://i.imgur.com/5Srjyo4.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/mem-free/central.css">
</head>
<body>

    <div class="mobile-app-wrapper">

        <header class="app-header">
            <div style="display:flex; align-items:center; gap:10px;">
                <a href="/mem-free/berkarya.html" class="btn-header-back" title="Kembali">
                    <i data-lucide="arrow-left" style="width:18px; height:18px;"></i>
                </a>
                <div>
                    <h1 class="header-brand-title" style="display:flex; align-items:center; gap:6px;">
                        <i data-lucide="book-copy" style="width:18px; height:18px; color:var(--purple);"></i> Menulis Novel
                    </h1>
                    <div class="header-brand-sub">Manajemen Bab &amp; Sinopsis Utama</div>
                </div>
            </div>
            <button type="button" class="btn-primary-challenge" style="padding:6px 12px; font-size:0.72rem; width:auto;" onclick="saveNovelChapter()">
                <i data-lucide="save" style="width:13px; height:13px;"></i> Simpan Bab
            </button>
        </header>

        <main class="app-body">

            <!-- INFO NOVEL -->
            <div style="background:white; border-radius:var(--radius-md); padding:16px; border:1px solid var(--border-soft); box-shadow:var(--shadow-sm);">
                <input type="text" id="novelBookTitle" placeholder="Judul Buku Novel..." style="width:100%; border:none; border-bottom:2px solid var(--border-soft); padding:6px 0; font-size:1.15rem; font-weight:800; color:var(--primary); outline:none; margin-bottom:12px;">

                <div style="display:grid; grid-template-columns:1fr 2fr; gap:8px; margin-bottom:12px;">
                    <select id="chapterNumber" style="padding:8px; border-radius:var(--radius-sm); border:1px solid var(--border-soft); font-size:0.76rem; font-weight:700;">
                        <option value="1">Bab 1</option>
                        <option value="2">Bab 2</option>
                        <option value="3">Bab 3</option>
                        <option value="4">Bab 4</option>
                    </select>
                    <input type="text" id="chapterTitle" placeholder="Sub-Judul Bab Ini..." style="padding:8px 12px; border-radius:var(--radius-sm); border:1px solid var(--border-soft); font-size:0.76rem; outline:none;">
                </div>

                <textarea id="chapterContent" class="editor-textarea" style="min-height:240px;" placeholder="Tuliskan naskah bab ini... Gambarkan latar, percakapan tokoh, dan eskalasi konflik bab."></textarea>
            </div>

            <!-- TARGET KATA -->
            <div style="background:#f8fafc; border-radius:var(--radius-md); padding:14px; border:1px solid var(--border-soft);">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                    <span style="font-size:0.74rem; font-weight:800; color:var(--primary);">Target Bab Standar: 1.000 Kata</span>
                    <span style="font-size:0.72rem; color:var(--text-muted);" id="chapWordCounter">0 / 1.000</span>
                </div>
                <div class="hero-xp-bar-bg" style="background:#e2e8f0; height:6px;">
                    <div id="chapProgressBar" class="hero-xp-bar-fill" style="width:0%; background:var(--purple);"></div>
                </div>
            </div>

            <div class="app-footer-copyright">
                &copy; 2026 PT Cendekia Aksara Edukasi. Seluruh Hak Cipta Dilindungi.
            </div>

        </main>

    </div>

    <script src="/mem-free/central.js"></script>
    <script>
        const textarea = document.getElementById('chapterContent');
        textarea.addEventListener('input', () => {
            const words = textarea.value.trim() ? textarea.value.trim().split(/\s+/).length : 0;
            document.getElementById('chapWordCounter').textContent = `${words} / 1.000`;
            const pct = Math.min(100, Math.round((words / 1000) * 100));
            document.getElementById('chapProgressBar').style.width = pct + '%';
        });

        function saveNovelChapter() {
            const book = document.getElementById('novelBookTitle').value.trim() || 'Novel Tanpa Judul';
            const chapNum = document.getElementById('chapterNumber').value;
            const chapSub = document.getElementById('chapterTitle').value.trim() || `Bab ${chapNum}`;
            const text = textarea.value.trim();

            if (!text) {
                alert('Tuliskan naskah bab terlebih dahulu.');
                return;
            }

            const title = `${book} - Bab ${chapNum}: ${chapSub}`;
            CendekiaApp.saveWork({
                title,
                body: text,
                genre: 'novel',
                words: text.split(/\s+/).length
            });

            CendekiaApp.addXP(25, 'Menulis Bab Novel');
            alert(`Naskah Bab ${chapNum} berhasil disimpan ke Karyaku!`);
            window.location.href = '/mem-free/berkarya/karyaku.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            CendekiaApp.renderBottomNav('berkarya');

            const user = CendekiaApp.getUser();
            if (user.tier === 'Member Free' || !user.tier || user.tier === 'free') {
                const main = document.querySelector('.app-body');
                if (main) {
                    main.innerHTML = `
                        <div style="background:white; border-radius:var(--radius-lg); padding:36px 20px; border:1.5px dashed #cbd5e1; text-align:center; box-shadow:var(--shadow-sm); margin-top:10px;">
                            <div style="width:60px; height:60px; border-radius:50%; background:#fef3c7; color:#b45309; display:flex; align-items:center; justify-content:center; margin:0 auto 12px;">
                                <i data-lucide="lock" style="width:30px; height:30px;"></i>
                            </div>
                            <span style="font-size:0.65rem; font-weight:800; background:#fef3c7; color:#b45309; padding:3px 10px; border-radius:var(--radius-full); display:inline-block; margin-bottom:8px;">
                                Akses Eksklusif Member 5K
                            </span>
                            <h3 style="font-size:1.1rem; font-weight:800; color:var(--primary); margin-bottom:8px;">
                                Studio Menulis Novel Terkunci
                            </h3>
                            <p style="font-size:0.75rem; color:var(--text-body); line-height:1.5; max-width:320px; margin:0 auto 20px;">
                                Fitur Menulis Novel dilengkapi manajemen multi-bab berjenjang, pemantau target ribuan kata, dan struktur sinopsis panjang yang khusus dibuka bagi <b>Member 5K</b>.
                            </p>
                            <div style="display:flex; flex-direction:column; gap:10px; max-width:280px; margin:0 auto;">
                                <a href="/mem-free/langganan.html?pkg=5k" class="btn-primary-challenge" style="text-decoration:none; justify-content:center; padding:12px; background:linear-gradient(135deg, #003366 0%, #001f3f 100%);">
                                    <i data-lucide="sparkles" style="width:16px; height:16px;"></i> Tingkatkan ke Member 5K (Rp 5.000)
                                </a>
                                <a href="/mem-free/berkarya.html" style="font-size:0.75rem; color:var(--text-muted); text-decoration:none; font-weight:700; padding:6px;">
                                    &larr; Kembali ke Studio Berkarya
                                </a>
                            </div>
                        </div>
                    `;
                    if (window.lucide) lucide.createIcons();
                }
            }
        });
    </script>
</body>
</html>
