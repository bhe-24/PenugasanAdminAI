<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menulis Drama - Member Free Cendekia</title>
    
    <link rel="icon" type="image/png" sizes="512x512" href="https://i.imgur.com/5Srjyo4.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/mem-free/central.css">
</head>
<body>

    <div class="mobile-app-wrapper">

        <header class="app-header">
            <div style="display:flex; align-items:center; gap:10px;">
                <a href="/mem-free/berkarya.html" class="btn-header-back" title="Kembali">
                    <i data-lucide="arrow-left" style="width:18px; height:18px;"></i>
                </a>
                <div>
                    <h1 class="header-brand-title" style="display:flex; align-items:center; gap:6px;">
                        <i data-lucide="clapperboard" style="width:18px; height:18px; color:var(--danger);"></i> Menulis Drama
                    </h1>
                    <div class="header-brand-sub">Naskah Lakon &amp; Dialog Panggung</div>
                </div>
            </div>
            <button type="button" class="btn-primary-challenge" style="padding:6px 12px; font-size:0.72rem; width:auto;" onclick="saveDramaScript()">
                <i data-lucide="save" style="width:13px; height:13px;"></i> Simpan
            </button>
        </header>

        <main class="app-body">

            <div style="background:white; border-radius:var(--radius-md); padding:16px; border:1px solid var(--border-soft); box-shadow:var(--shadow-sm);">
                <input type="text" id="dramaTitle" placeholder="Judul Naskah Lakon..." style="width:100%; border:none; border-bottom:2px solid var(--border-soft); padding:6px 0; font-size:1.15rem; font-weight:800; color:var(--primary); outline:none; margin-bottom:12px;">

                <!-- TOMBOL FORMAT CEPAT DIALOG -->
                <div style="display:flex; gap:6px; margin-bottom:8px; overflow-x:auto; padding-bottom:4px;">
                    <button type="button" class="btn-modal-secondary" style="padding:4px 10px; font-size:0.68rem;" onclick="insertFormat('BABAK I: ')">+ Babak</button>
                    <button type="button" class="btn-modal-secondary" style="padding:4px 10px; font-size:0.68rem;" onclick="insertFormat('TOKOH: (Petunjuk laku) Dialog...')">+ Dialog</button>
                    <button type="button" class="btn-modal-secondary" style="padding:4px 10px; font-size:0.68rem;" onclick="insertFormat('(Lampu panggung perlahan meredup) ')">+ Latar</button>
                </div>

                <textarea id="dramaContent" class="editor-textarea" style="min-height:260px;" placeholder="BABAK I&#10;ADEGAN 1&#10;&#10;LATAR: Ruang tengah rumah tua tempo dulu. Hujan gerimis di luar jendela.&#10;&#10;DANU: (Berdiri memandangi pigura usang) Kau yakin dia akan menepati janjinya?&#10;&#10;RATNA: (Tanpa menoleh) Dia tidak pernah mengingkari kata-katanya, Danu."></textarea>
            </div>

            <div class="app-footer-copyright">
                &copy; 2026 PT Cendekia Aksara Edukasi. Seluruh Hak Cipta Dilindungi.
            </div>

        </main>

    </div>

    <script src="/mem-free/central.js"></script>
    <script>
        function insertFormat(text) {
            const ta = document.getElementById('dramaContent');
            ta.value += '\n\n' + text;
            ta.focus();
        }

        function saveDramaScript() {
            const title = document.getElementById('dramaTitle').value.trim() || 'Naskah Lakon Tanpa Judul';
            const body = document.getElementById('dramaContent').value.trim();

            if (!body) {
                alert('Tuliskan naskah drama terlebih dahulu.');
                return;
            }

            CendekiaApp.saveWork({
                title,
                body,
                genre: 'drama',
                words: body.split(/\s+/).length
            });

            CendekiaApp.addXP(25, 'Menulis Naskah Drama');
            alert('Naskah Lakon berhasil disimpan ke Karyaku!');
            window.location.href = '/mem-free/berkarya/karyaku.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            CendekiaApp.renderBottomNav('berkarya');

            const user = CendekiaApp.getUser();
            if (user.tier === 'Member Free' || !user.tier || user.tier === 'free') {
                const main = document.querySelector('.app-body');
                if (main) {
                    main.innerHTML = `
                        <div style="background:white; border-radius:var(--radius-lg); padding:36px 20px; border:1.5px dashed #cbd5e1; text-align:center; box-shadow:var(--shadow-sm); margin-top:10px;">
                            <div style="width:60px; height:60px; border-radius:50%; background:#fef3c7; color:#b45309; display:flex; align-items:center; justify-content:center; margin:0 auto 12px;">
                                <i data-lucide="lock" style="width:30px; height:30px;"></i>
                            </div>
                            <span style="font-size:0.65rem; font-weight:800; background:#fef3c7; color:#b45309; padding:3px 10px; border-radius:var(--radius-full); display:inline-block; margin-bottom:8px;">
                                Akses Eksklusif Member 5K
                            </span>
                            <h3 style="font-size:1.1rem; font-weight:800; color:var(--primary); margin-bottom:8px;">
                                Menulis Drama Terkunci
                            </h3>
                            <p style="font-size:0.75rem; color:var(--text-body); line-height:1.5; max-width:320px; margin:0 auto 20px;">
                                Format dialog skenario teater, pembabakan adegan pementasan, dan didaskalia petunjuk lakon merupakan fitur eksklusif <b>Member 5K</b>.
                            </p>
                            <div style="display:flex; flex-direction:column; gap:10px; max-width:280px; margin:0 auto;">
                                <a href="/mem-free/langganan.html?pkg=5k" class="btn-primary-challenge" style="text-decoration:none; justify-content:center; padding:12px; background:linear-gradient(135deg, #003366 0%, #001f3f 100%);">
                                    <i data-lucide="sparkles" style="width:16px; height:16px;"></i> Tingkatkan ke Member 5K (Rp 5.000)
                                </a>
                                <a href="/mem-free/berkarya.html" style="font-size:0.75rem; color:var(--text-muted); text-decoration:none; font-weight:700; padding:6px;">
                                    &larr; Kembali ke Studio Berkarya
                                </a>
                            </div>
                        </div>
                    `;
                    if (window.lucide) lucide.createIcons();
                }
            }
        });
    </script>
</body>
</html>
