<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menulis Artikel - Member Free Cendekia</title>
    
    <link rel="icon" type="image/png" sizes="512x512" href="https://i.imgur.com/5Srjyo4.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/mem-free/central.css">
</head>
<body>

    <div class="mobile-app-wrapper">

        <header class="app-header">
            <div style="display:flex; align-items:center; gap:10px;">
                <a href="/mem-free/berkarya.html" class="btn-header-back" title="Kembali">
                    <i data-lucide="arrow-left" style="width:18px; height:18px;"></i>
                </a>
                <div>
                    <h1 class="header-brand-title" style="display:flex; align-items:center; gap:6px;">
                        <i data-lucide="file-text" style="width:18px; height:18px; color:var(--primary);"></i> Menulis Artikel
                    </h1>
                    <div class="header-brand-sub">Esai Sastra &amp; Opini Populer</div>
                </div>
            </div>
            <button type="button" class="btn-primary-challenge" style="padding:6px 12px; font-size:0.72rem; width:auto;" onclick="saveArticle()">
                <i data-lucide="save" style="width:13px; height:13px;"></i> Simpan
            </button>
        </header>

        <main class="app-body">

            <div style="background:white; border-radius:var(--radius-md); padding:16px; border:1px solid var(--border-soft); box-shadow:var(--shadow-sm);">
                <input type="text" id="artTitle" placeholder="Judul Artikel / Esai..." style="width:100%; border:none; border-bottom:2px solid var(--border-soft); padding:6px 0; font-size:1.15rem; font-weight:800; color:var(--primary); outline:none; margin-bottom:12px;">

                <div style="font-size:0.7rem; color:var(--text-muted); margin-bottom:8px;">
                    <i data-lucide="check-circle" style="width:12px; height:12px; display:inline-block; vertical-align:middle; color:#059669;"></i> Struktur Dianjurkan: Pernyataan Tesis &rarr; Argumen Bukti &rarr; Simpulan Kritis
                </div>

                <textarea id="artContent" class="editor-textarea" style="min-height:260px;" placeholder="Tuliskan esai atau artikel literasimu di sini... Tuangkan sudut pandang orisinalmu mengenai suatu buku, fenomena bahasa, atau bedah karya sastra."></textarea>
            </div>

            <div class="app-footer-copyright">
                &copy; 2026 PT Cendekia Aksara Edukasi. Seluruh Hak Cipta Dilindungi.
            </div>

        </main>

    </div>

    <script src="/mem-free/central.js"></script>
    <script>
        function saveArticle() {
            const title = document.getElementById('artTitle').value.trim() || 'Artikel Tanpa Judul';
            const body = document.getElementById('artContent').value.trim();

            if (!body) {
                alert('Tuliskan naskah artikel terlebih dahulu.');
                return;
            }

            CendekiaApp.saveWork({
                title,
                body,
                genre: 'artikel',
                words: body.split(/\s+/).length
            });

            CendekiaApp.addXP(20, 'Menulis Artikel/Esai');
            alert('Artikel berhasil disimpan ke Karyaku!');
            window.location.href = '/mem-free/berkarya/karyaku.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            CendekiaApp.renderBottomNav('berkarya');
        });
    </script>
</body>
</html>
