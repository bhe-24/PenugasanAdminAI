<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pengetahuan Khusus - Member Free Cendekia</title>
    
    <link rel="icon" type="image/png" sizes="512x512" href="https://i.imgur.com/5Srjyo4.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- LUCIDE ICONS CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/mem-free/central.css">

    <style>
        .module-card {
            background: white; border-radius: var(--radius-md); padding: 18px;
            border: 1px solid var(--border-soft); box-shadow: var(--shadow-sm); margin-bottom: 14px;
        }
        .module-badge {
            display: inline-flex; align-items: center; gap: 4px; font-size: 0.65rem; font-weight: 800;
            padding: 3px 10px; border-radius: var(--radius-full); background: #ede9fe; color: #7c3aed; margin-bottom: 10px;
        }
        .module-title { font-size: 1.05rem; font-weight: 800; color: var(--primary); margin-bottom: 8px; line-height: 1.4; }
        .module-summary {
            background: #faf5ff; border-left: 3px solid #7c3aed; padding: 10px 14px;
            border-radius: 0 var(--radius-xs) var(--radius-xs) 0; font-size: 0.76rem;
            color: #5b21b6; font-weight: 600; line-height: 1.5; margin-bottom: 14px;
        }
        .module-content {
            font-size: 0.78rem; color: var(--text-body); line-height: 1.65; white-space: pre-line;
            margin-bottom: 14px;
        }
        .example-box {
            background: #f8fafc; border: 1px solid var(--border-soft); padding: 12px 14px;
            border-radius: var(--radius-sm); font-size: 0.74rem; color: #334155; margin-bottom: 16px;
        }
        .empty-state-card {
            background: white; border-radius: var(--radius-md); padding: 40px 20px;
            border: 1px dashed #cbd5e1; text-align: center; margin: 20px 0;
        }
        .empty-icon-circle {
            width: 60px; height: 60px; border-radius: 50%; background: #f1f5f9; color: var(--text-muted);
            display: flex; align-items: center; justify-content: center; margin: 0 auto 14px;
        }
    </style>
</head>
<body>

    <div class="mobile-app-wrapper">

        <!-- HEADER -->
        <header class="app-header">
            <div style="display:flex; align-items:center; gap:10px;">
                <a href="/mem-free/belajar.html" class="btn-header-back" title="Kembali ke Menu Belajar">
                    <i data-lucide="arrow-left" style="width:18px; height:18px;"></i>
                </a>
                <div>
                    <h1 class="header-brand-title" style="display:flex; align-items:center; gap:6px;">
                        <i data-lucide="graduation-cap" style="width:18px; height:18px; color:#7c3aed;"></i> Pengetahuan Khusus
                    </h1>
                    <div class="header-brand-sub">Stilistika Sastra &amp; Eksplorasi Diksi</div>
                </div>
            </div>
            <span class="badge-tier-free">+25 XP Baca</span>
        </header>

        <main class="app-body">

            <!-- CONTAINER MATERI DINAMIS -->
            <div id="materialContentArea">
                <div id="loadingState" style="text-align:center; padding:50px 20px; color:var(--text-muted);">
                    <i data-lucide="loader" style="width:28px; height:28px; animation:spin 1s linear infinite; margin-bottom:10px;"></i>
                    <div style="font-size:0.8rem; font-weight:600;">Memeriksa bahan ajar dari sistem kurikulum...</div>
                </div>
            </div>

            <!-- COPYRIGHT FOOTER -->
            <div class="app-footer-copyright">
                &copy; 2026 PT Cendekia Aksara Edukasi. Seluruh Hak Cipta Dilindungi.
            </div>

        </main>

    </div>

    <!-- ENGINE SCRIPTS -->
    <script src="/mem-free/central.js"></script>
    <script>
        const CATEGORY_ID = 'pengetahuan-khusus';

        async function loadCategoryMaterial() {
            const container = document.getElementById('materialContentArea');

            try {
                const material = await CendekiaApp.getMaterialByCategory(CATEGORY_ID);

                if (!material || !material.content || material.content.trim().length === 0) {
                    container.innerHTML = `
                        <div class="empty-state-card">
                            <div class="empty-icon-circle">
                                <i data-lucide="graduation-cap" style="width:28px; height:28px;"></i>
                            </div>
                            <h3 style="font-size:0.95rem; font-weight:800; color:var(--primary); margin-bottom:6px;">
                                Bahan Ajar Belum Tersedia
                            </h3>
                            <p style="font-size:0.75rem; color:var(--text-muted); line-height:1.5; max-width:280px; margin:0 auto 16px;">
                                Materi pembelajaran untuk kategori ini belum diunggah oleh Admin. Silakan periksa kembali nanti setelah Admin menerbitkan modul baru.
                            </p>
                            <a href="/mem-free/belajar.html" class="btn-primary-challenge" style="display:inline-flex; width:auto; padding:8px 18px; font-size:0.75rem;">
                                <i data-lucide="arrow-left" style="width:14px; height:14px;"></i> Kembali ke Menu Belajar
                            </a>
                        </div>
                    `;
                } else {
                    const updatedStr = material.updatedAt ? new Date(material.updatedAt).toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' }) : 'Terbaru';
                    
                    let html = `
                        <div class="module-card">
                            <span class="module-badge">
                                <i data-lucide="graduation-cap" style="width:12px; height:12px;"></i> Modul Kurikulum &bull; ${updatedStr}
                            </span>
                            <h2 class="module-title">${material.title || 'Materi Pengetahuan Khusus'}</h2>
                    `;

                    if (material.summary) {
                        html += `
                            <div class="module-summary">
                                <strong>Ringkasan Esensial:</strong><br>
                                ${material.summary}
                            </div>
                        `;
                    }

                    html += `
                        <div class="module-content">
                            ${material.content}
                        </div>
                    `;

                    if (material.examples) {
                        html += `
                            <div class="example-box">
                                <strong style="color:var(--primary); display:block; margin-bottom:4px;">
                                    <i data-lucide="lightbulb" style="width:13px; height:13px; display:inline-block; vertical-align:middle;"></i> Contoh / Kasus Penerapan:
                                </strong>
                                <div style="white-space:pre-line;">${material.examples}</div>
                            </div>
                        `;
                    }

                    html += `
                        <button type="button" id="btnFinishRead" class="btn-primary-challenge" style="margin-top:10px;" onclick="completeReading()">
                            <i data-lucide="check-circle-2" style="width:16px; height:16px;"></i> Tandai Telah Selesai Membaca (+25 XP)
                        </button>
                    </div>`;

                    container.innerHTML = html;
                }
            } catch (err) {
                console.error("Gagal memuat materi:", err);
                container.innerHTML = `
                    <div class="empty-state-card" style="border-color:#fca5a5;">
                        <div class="empty-icon-circle" style="background:#fee2e2; color:#ef4444;">
                            <i data-lucide="alert-circle" style="width:28px; height:28px;"></i>
                        </div>
                        <h3 style="font-size:0.95rem; font-weight:800; color:#ef4444; margin-bottom:6px;">Gagal Memuat Materi</h3>
                        <p style="font-size:0.75rem; color:var(--text-muted);">${err.message}</p>
                    </div>
                `;
            }

            if (window.lucide) lucide.createIcons();
        }

        let hasEarnedReadingXP = false;
        function completeReading() {
            if (hasEarnedReadingXP) return;
            hasEarnedReadingXP = true;
            CendekiaApp.addXP(25, 'Menyelesaikan Bacaan: Pengetahuan Khusus');
            const btn = document.getElementById('btnFinishRead');
            if (btn) {
                btn.disabled = true;
                btn.style.background = '#059669';
                btn.innerHTML = '<i data-lucide="check" style="width:16px; height:16px;"></i> Berhasil Diselesaikan (+25 XP Diperoleh)';
                if (window.lucide) lucide.createIcons();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            CendekiaApp.renderBottomNav('belajar');
            loadCategoryMaterial();
        });
    </script>
</body>
</html>
