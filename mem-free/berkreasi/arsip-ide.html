<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arsip Ide - Member Free Cendekia</title>
    
    <link rel="icon" type="image/png" sizes="512x512" href="https://i.imgur.com/5Srjyo4.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/mem-free/central.css">

    <style>
        .idea-card-item {
            background: white; border-radius: var(--radius-md); padding: 14px;
            border: 1px solid var(--border-soft); box-shadow: var(--shadow-sm); margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="mobile-app-wrapper">

        <header class="app-header">
            <div style="display:flex; align-items:center; gap:10px;">
                <a href="/mem-free/berkreasi.html" class="btn-header-back" title="Kembali">
                    <i data-lucide="arrow-left" style="width:18px; height:18px;"></i>
                </a>
                <div>
                    <h1 class="header-brand-title" style="display:flex; align-items:center; gap:6px;">
                        <i data-lucide="archive" style="width:18px; height:18px; color:#dc2626;"></i> Arsip Ide
                    </h1>
                    <div class="header-brand-sub">Bank Gagasan &amp; Percikan Kreatif</div>
                </div>
            </div>
            <a href="/mem-free/berkreasi/pemantik-ide.html" class="btn-primary-challenge" style="padding:6px 12px; font-size:0.72rem; width:auto; text-decoration:none;">
                <i data-lucide="plus" style="width:13px; height:13px;"></i> Cari Ide
            </a>
        </header>

        <main class="app-body">

            <div id="ideasListContainer"></div>

            <div class="app-footer-copyright">
                &copy; 2026 PT Cendekia Aksara Edukasi. Seluruh Hak Cipta Dilindungi.
            </div>

        </main>

    </div>

    <script src="/mem-free/central.js"></script>
    <script>
        function renderIdeas() {
            const ideas = CendekiaApp.getIdeas();
            const container = document.getElementById('ideasListContainer');
            container.innerHTML = '';

            if (!ideas || ideas.length === 0) {
                container.innerHTML = `
                    <div style="background:white; border-radius:var(--radius-md); padding:28px 16px; border:1px dashed var(--border-medium); text-align:center;">
                        <i data-lucide="lightbulb" style="width:36px; height:36px; color:var(--text-light); margin-bottom:8px;"></i>
                        <strong style="font-size:0.9rem; color:var(--primary); display:block;">Belum Ada Ide Tersimpan</strong>
                        <p style="font-size:0.72rem; color:var(--text-muted); margin:4px 0 14px;">Gunakan Pemantik Ide atau What If untuk menyimpan gagasan ceritamu.</p>
                        <a href="/mem-free/berkreasi/pemantik-ide.html" class="btn-primary-challenge" style="display:inline-flex; width:auto; text-decoration:none;">
                            Jelajahi Pemantik Ide
                        </a>
                    </div>
                `;
            } else {
                ideas.forEach(idea => {
                    const card = document.createElement('div');
                    card.className = 'idea-card-item';
                    card.innerHTML = `
                        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;">
                            <span style="font-size:0.65rem; font-weight:800; background:#f1f5f9; color:var(--primary); padding:2px 8px; border-radius:var(--radius-full);">
                                ${idea.category || 'Ide Kreatif'}
                            </span>
                            <span style="font-size:0.65rem; color:var(--text-muted);">${new Date(idea.createdAt).toLocaleDateString('id-ID')}</span>
                        </div>
                        <p style="font-size:0.76rem; color:var(--text-body); line-height:1.45; margin-bottom:10px;">${idea.content}</p>
                        <div style="display:flex; gap:8px;">
                            <a href="/mem-free/berkarya/ruang-menulis.html?idea=${encodeURIComponent(idea.content)}" class="btn-primary-challenge" style="padding:6px 12px; font-size:0.7rem; text-decoration:none;">
                                <i data-lucide="pen-tool" style="width:12px; height:12px;"></i> Tulis Naskah Ini
                            </a>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }
            if (window.lucide) lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', () => {
            CendekiaApp.renderBottomNav('beranda');
            renderIdeas();
        });
    </script>
</body>
</html>
