<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>What If? - Member Free Cendekia</title>
    
    <link rel="icon" type="image/png" sizes="512x512" href="https://i.imgur.com/5Srjyo4.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/mem-free/central.css">
</head>
<body>

    <div class="mobile-app-wrapper">

        <header class="app-header">
            <div style="display:flex; align-items:center; gap:10px;">
                <a href="/mem-free/berkreasi.html" class="btn-header-back" title="Kembali">
                    <i data-lucide="arrow-left" style="width:18px; height:18px;"></i>
                </a>
                <div>
                    <h1 class="header-brand-title" style="display:flex; align-items:center; gap:6px;">
                        <i data-lucide="git-branch" style="width:18px; height:18px; color:var(--secondary);"></i> What If?
                    </h1>
                    <div class="header-brand-sub">Eksplorasi Skenario Pengandaian</div>
                </div>
            </div>
            <span class="badge-tier-free">Imajinasi Liar</span>
        </header>

        <main class="app-body">

            <div style="background:white; border-radius:var(--radius-md); padding:18px; border:1px solid var(--border-soft); box-shadow:var(--shadow-sm); text-align:center;">
                <span style="font-size:0.68rem; font-weight:800; background:#e0f2fe; color:#0284c7; padding:3px 10px; border-radius:var(--radius-full); display:inline-block; margin-bottom:8px;">
                    Eksperimen Pemikiran:
                </span>
                
                <div id="whatIfQuestion" style="font-size:0.96rem; font-weight:800; color:var(--primary); line-height:1.5; margin:14px 0; min-height:55px; padding:12px; background:#f0f9ff; border-radius:var(--radius-sm); border:1px solid #bae6fd;">
                    "Bagaimana jika setiap manusia hanya dijatah sejuta kata untuk diucapkan seumur hidupnya, dan sisa kuota itu tertera jelas di pergelangan tangan?"
                </div>

                <div style="display:flex; gap:8px;">
                    <button type="button" class="btn-primary-challenge" style="flex:1;" onclick="randomWhatIf()">
                        <i data-lucide="shuffle" style="width:15px; height:15px;"></i> Acak Pengandaian Baru
                    </button>
                    <button type="button" class="btn-modal-secondary" style="width:auto;" onclick="saveWhatIf()">
                        <i data-lucide="bookmark" style="width:15px; height:15px;"></i> Simpan
                    </button>
                </div>
            </div>

            <!-- PROYEK TULISAN -->
            <div style="background:white; border-radius:var(--radius-md); padding:16px; border:1px solid var(--border-soft); text-align:center;">
                <button type="button" class="btn-primary-challenge" style="background:#0284c7;" onclick="developWhatIf()">
                    <i data-lucide="pen-tool" style="width:15px; height:15px;"></i> Kembangkan Jadi Cerita di Ruang Menulis
                </button>
            </div>

            <div class="app-footer-copyright">
                &copy; 2026 PT Cendekia Aksara Edukasi. Seluruh Hak Cipta Dilindungi.
            </div>

        </main>

    </div>

    <script src="/mem-free/central.js"></script>
    <script>
        const whatIfList = [
            "Bagaimana jika setiap manusia hanya dijatah sejuta kata untuk diucapkan seumur hidupnya, dan sisa kuota itu tertera jelas di pergelangan tangan?",
            "Bagaimana jika bayanganmu di cermin suatu malam menolak mengikuti gerakan tubuhmu dan mulai menulis pesan di kaca berembun?",
            "Bagaimana jika seluruh perpustakaan di dunia mendadak kehilangan semua huruf di halamannya kecuali buku-buku dongeng anak-anak?",
            "Bagaimana jika hujan yang turun tidak membawa air, melainkan aroma kenangan dari orang-orang yang telah tiada?",
            "Bagaimana jika musik dilarang berbunyi di muka bumi karena getarannya mampu membuka gerbang dimensi lain?"
        ];

        let currentQ = whatIfList[0];

        function randomWhatIf() {
            currentQ = whatIfList[Math.floor(Math.random() * whatIfList.length)];
            document.getElementById('whatIfQuestion').textContent = `"${currentQ}"`;
        }

        function saveWhatIf() {
            CendekiaApp.saveIdea({
                title: 'What If: ' + currentQ.substring(0, 30) + '...',
                content: currentQ,
                category: 'What If'
            });
            alert('Skenario What If berhasil disimpan ke Arsip!');
        }

        function developWhatIf() {
            window.location.href = `/mem-free/berkarya/ruang-menulis.html?idea=${encodeURIComponent('Skenario: ' + currentQ)}`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            CendekiaApp.renderBottomNav('beranda');
        });
    </script>
</body>
</html>
