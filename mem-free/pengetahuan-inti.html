<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pengetahuan Inti - Member Free Cendekia</title>
    
    <link rel="icon" type="image/png" sizes="512x512" href="https://i.imgur.com/5Srjyo4.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- LUCIDE ICONS CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/mem-free/central.css">

    <style>
        .module-card {
            background: white; border-radius: var(--radius-md); padding: 18px;
            border: 1px solid var(--border-soft); box-shadow: var(--shadow-sm); margin-bottom: 14px;
        }
        .module-badge {
            display: inline-flex; align-items: center; gap: 4px; font-size: 0.65rem; font-weight: 800;
            padding: 3px 10px; border-radius: var(--radius-full); background: #fef3c7; color: #b45309; margin-bottom: 10px;
        }
        .module-title { font-size: 1.05rem; font-weight: 800; color: var(--primary); margin-bottom: 8px; line-height: 1.4; }
        .module-summary {
            background: #fffbeb; border-left: 3px solid #b45309; padding: 10px 14px;
            border-radius: 0 var(--radius-xs) var(--radius-xs) 0; font-size: 0.76rem;
            color: #92400e; font-weight: 600; line-height: 1.5; margin-bottom: 14px;
        }
        .module-content {
            font-size: 0.78rem; color: var(--text-body); line-height: 1.65; white-space: pre-line;
            margin-bottom: 14px;
        }
        .example-box {
            background: #f8fafc; border: 1px solid var(--border-soft); padding: 12px 14px;
            border-radius: var(--radius-sm); font-size: 0.74rem; color: #334155; margin-bottom: 16px;
        }
        .empty-state-card {
            background: white; border-radius: var(--radius-md); padding: 40px 20px;
            border: 1px dashed #cbd5e1; text-align: center; margin: 20px 0;
        }
        .empty-icon-circle {
            width: 60px; height: 60px; border-radius: 50%; background: #f1f5f9; color: var(--text-muted);
            display: flex; align-items: center; justify-content: center; margin: 0 auto 14px;
        }
    </style>
</head>
<body>

    <div class="mobile-app-wrapper">

        <!-- HEADER -->
        <header class="app-header">
            <div style="display:flex; align-items:center; gap:10px;">
                <a href="/mem-free/belajar.html" class="btn-header-back" title="Kembali ke Menu Belajar">
                    <i data-lucide="arrow-left" style="width:18px; height:18px;"></i>
                </a>
                <div>
                    <h1 class="header-brand-title" style="display:flex; align-items:center; gap:6px;">
                        <i data-lucide="book-marked" style="width:18px; height:18px; color:#b45309;"></i> Pengetahuan Inti
                    </h1>
                    <div class="header-brand-sub">Struktur Narasi &amp; Penokohan</div>
                </div>
            </div>
            <span class="badge-tier-free" style="background:#fef3c7; color:#b45309; font-weight:800;">
                <i data-lucide="book-marked" style="width:12px; height:12px; display:inline-block; vertical-align:middle; margin-right:2px;"></i> Akses Bebas
            </span>
        </header>

        <main class="app-body">

            <!-- CONTAINER MATERI DINAMIS -->
            <div id="materialContentArea">
                <div id="loadingState" style="text-align:center; padding:50px 20px; color:var(--text-muted);">
                    <i data-lucide="loader" style="width:28px; height:28px; animation:spin 1s linear infinite; margin-bottom:10px;"></i>
                    <div style="font-size:0.8rem; font-weight:600;">Memeriksa bahan ajar dari sistem kurikulum...</div>
                </div>
            </div>

            <!-- COPYRIGHT FOOTER -->
            <div class="app-footer-copyright">
                &copy; 2026 PT Cendekia Aksara Edukasi. Seluruh Hak Cipta Dilindungi.
            </div>

        </main>

    </div>

    <!-- ENGINE SCRIPTS -->
    <script src="/js/notifikasi.js"></script>
    <script src="/mem-free/central.js"></script>
    <script>
        const CATEGORY_ID = 'pengetahuan-inti';

        async function loadCategoryMaterial() {
            const container = document.getElementById('materialContentArea');
            const urlParams = new URLSearchParams(window.location.search);
            const requestedId = urlParams.get('id') || null;

            try {
                const material = await CendekiaApp.getMaterialByCategory(CATEGORY_ID, requestedId);

                if (!material || !material.content || material.content.trim().length === 0) {
                    container.innerHTML = `
                        <div class="empty-state-card">
                            <div class="empty-icon-circle">
                                <i data-lucide="book-marked" style="width:28px; height:28px;"></i>
                            </div>
                            <h3 style="font-size:0.95rem; font-weight:800; color:var(--primary); margin-bottom:6px;">
                                Bahan Ajar Belum Tersedia
                            </h3>
                            <p style="font-size:0.75rem; color:var(--text-muted); line-height:1.5; max-width:280px; margin:0 auto 16px;">
                                Materi pembelajaran untuk kategori ini belum diunggah oleh Admin. Silakan periksa kembali nanti setelah Admin menerbitkan modul baru.
                            </p>
                            <a href="/mem-free/belajar.html" class="btn-primary-challenge" style="display:inline-flex; width:auto; padding:8px 18px; font-size:0.75rem;">
                                <i data-lucide="arrow-left" style="width:14px; height:14px;"></i> Kembali ke Menu Belajar
                            </a>
                        </div>
                    `;
                } else {
                    const updatedStr = material.updatedAt ? new Date(material.updatedAt).toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' }) : 'Terbaru';
                    const words = ((material.content || '') + ' ' + (material.summary || '')).split(/\s+/).filter(Boolean).length;
                    const readTime = Math.max(1, Math.ceil(words / 140));
                    const rollMeta = material._rollingMeta || { index: 1, total: 1 };
                    const rollingPill = rollMeta.total > 1
                        ? `<span class="module-badge" style="background:#e0f2fe; color:#0284c7; margin-bottom:0;"><i data-lucide="shuffle" style="width:11px; height:11px;"></i> Rolling Hari Ini (#${rollMeta.index}/${rollMeta.total})</span>`
                        : '';

                    let html = `
                        <div class="module-card">
                            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; margin-bottom:10px;">
                                <div style="display:flex; flex-wrap:wrap; gap:6px; align-items:center;">
                                    <span class="module-badge" style="margin-bottom:0;">
                                        <i data-lucide="book-marked" style="width:12px; height:12px;"></i> Modul Kurikulum &bull; ${updatedStr}
                                    </span>
                                    ${rollingPill}
                                </div>
                                <span style="font-size:0.7rem; color:var(--text-muted); font-weight:600;">
                                    <i data-lucide="clock" style="width:12px; height:12px; display:inline-block; vertical-align:middle;"></i> ~${readTime} Menit Baca
                                </span>
                            </div>
                            <h2 class="module-title">${material.title || 'Materi Pengetahuan Inti'}</h2>
                    `;

                    if (material.summary) {
                        html += `
                            <div class="module-summary">
                                <strong>Ringkasan Esensial:</strong><br>
                                ${material.summary}
                            </div>
                        `;
                    }

                    // TOOLBAR PENGATUR FONT
                    html += `
                        <div class="reading-toolbar">
                            <span><i data-lucide="eye" style="width:13px; height:13px; display:inline-block; vertical-align:middle; margin-right:3px;"></i> Tampilan Terstruktur AI</span>
                            <div class="reading-font-btns">
                                <span>Ukuran Teks:</span>
                                <button type="button" class="btn-font-size" onclick="adjustFontSize(-1)" title="Perkecil Huruf">A-</button>
                                <button type="button" class="btn-font-size" onclick="adjustFontSize(1)" title="Perbesar Huruf">A+</button>
                            </div>
                        </div>
                    `;

                    // RENDER ISI MATERI TERSTRUKTUR DENGAN HELPER AI RENDERER
                    html += `
                        <div class="module-content" id="moduleContentText">
                            ${CendekiaApp.renderFormattedMaterial(material.content)}
                        </div>
                    `;

                    if (material.examples) {
                        html += `
                            <div class="example-box">
                                <strong style="color:var(--primary); display:block; margin-bottom:6px;">
                                    <i data-lucide="lightbulb" style="width:14px; height:14px; display:inline-block; vertical-align:middle; color:#f59e0b;"></i> Contoh / Kasus Penerapan:
                                </strong>
                                <div style="font-size:0.78rem; line-height:1.6; color:#334155;">
                                    ${CendekiaApp.renderFormattedMaterial(material.examples)}
                                </div>
                            </div>
                        `;
                    }

                    html += `
                        <button type="button" id="btnFinishRead" class="btn-primary-challenge" style="margin-top:14px;" onclick="completeReading('${encodeURIComponent(material.title || 'Materi Pengetahuan Inti')}')">
                            <i data-lucide="check-circle-2" style="width:16px; height:16px;"></i> Tandai Telah Selesai Membaca Modul Ini
                        </button>
                    </div>`;

                    container.innerHTML = html;

                    // Support direct-link via ?id=...
                    const urlParams = new URLSearchParams(window.location.search);
                    if (urlParams.get('id')) {
                        const targetCard = document.querySelector('.module-card');
                        if (targetCard) {
                            setTimeout(() => {
                                targetCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
                                targetCard.style.outline = '2px solid #b45309';
                                targetCard.style.transition = 'outline 0.3s ease';
                                setTimeout(() => { targetCard.style.outline = 'none'; }, 2000);
                            }, 300);
                        }
                    }
                }
            } catch (err) {
                console.error("Gagal memuat materi:", err);
                container.innerHTML = `
                    <div class="empty-state-card" style="border-color:#fca5a5;">
                        <div class="empty-icon-circle" style="background:#fee2e2; color:#ef4444;">
                            <i data-lucide="alert-circle" style="width:28px; height:28px;"></i>
                        </div>
                        <h3 style="font-size:0.95rem; font-weight:800; color:#ef4444; margin-bottom:6px;">Gagal Memuat Materi</h3>
                        <p style="font-size:0.75rem; color:var(--text-muted);">${err.message}</p>
                    </div>
                `;
            }

            if (window.lucide) lucide.createIcons();
        }

        let currentFontScale = 0;
        window.adjustFontSize = function(delta) {
            currentFontScale = Math.max(-2, Math.min(3, currentFontScale + delta));
            const content = document.getElementById('moduleContentText');
            if (!content) return;
            const baseSize = 0.8 + (currentFontScale * 0.08);
            content.style.fontSize = baseSize + 'rem';
            const items = content.querySelectorAll('.mat-point-text, .mat-paragraph, .mat-callout-body');
            items.forEach(el => el.style.fontSize = baseSize + 'rem');
        };

        function completeReading(encodedTitle) {
            const rawTitle = encodedTitle ? decodeURIComponent(encodedTitle) : 'Materi Pengetahuan Inti';
            CendekiaApp.recordMaterialRead(CATEGORY_ID, rawTitle);
            const btn = document.getElementById('btnFinishRead');
            if (btn) {
                btn.style.background = '#059669';
                btn.innerHTML = '<i data-lucide="check" style="width:16px; height:16px;"></i> Telah Selesai Dibaca ✓ (Bisa Dibaca Kapan Saja)';
                if (window.lucide) lucide.createIcons();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            CendekiaApp.renderBottomNav('belajar');
            loadCategoryMaterial();
        });
    </script>
</body>
</html>
