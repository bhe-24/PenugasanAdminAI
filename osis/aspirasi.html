<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kotak Aspirasi - OSIS Cendekia</title>
    
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Aleo:wght@700&family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tambahkan SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <style>
        /* --- 1. GLOBAL & RESET --- */
        :root { 
            --nav-bg: #0f172a;       
            --nav-border: #d4af37;   
            --primary: #003366; 
            --gold: #d4af37;
            --aspirasi: #dc2626;     
            --aspirasi-dark: #b91c1c;
            --bg-color: #f8fafc; 
            --text-dark: #1e293b; 
            --text-gray: #64748b; 
        }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent;}
        
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; color: var(--text-dark); 
            padding-bottom: 50px; 
            padding-top: 80px; 
        }
        .container { max-width: 1100px; width: 95%; margin: 0 auto; padding: 15px; position: relative;}

        /* --- 2. FIXED NAVBAR --- */
        .top-navbar {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
            background: var(--nav-bg); border-bottom: 3px solid var(--nav-border);
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 20px; box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .nav-brand { display: flex; align-items: center; gap: 12px; }
        .nav-brand img { 
            width: 40px; height: 40px; border-radius: 50%; 
            background: white; padding: 2px; border: 2px solid var(--nav-border);
        }
        .nav-brand h1 { 
            font-family: 'Aleo', serif; font-size: 1.3rem; 
            color: var(--nav-border); margin: 0; font-weight: 700; letter-spacing: 0.5px;
        }

        .btn-back-nav {
            background: rgba(255,255,255,0.1); color: white; text-decoration: none;
            padding: 8px 16px; border-radius: 50px; font-weight: 600; font-size: 0.85rem;
            transition: 0.3s; display: inline-flex; align-items: center; gap: 6px;
            border: 1px solid rgba(212, 175, 55, 0.4);
        }
        .btn-back-nav:hover { background: var(--nav-border); color: var(--nav-bg); }

        /* --- 3. HERO BANNER --- */
        .hero-banner {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-radius: 16px; padding: 25px; color: white;
            display: flex; flex-direction: column; justify-content: center;
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.15);
            margin-bottom: 25px; position: relative; overflow: hidden;
        }
        
        .hero-banner::after {
            content: '\f4b6'; font-family: "Font Awesome 6 Free"; font-weight: 900;
            position: absolute; right: -10px; top: -20px; font-size: 8rem;
            color: rgba(220, 38, 38, 0.1); transform: rotate(-15deg); pointer-events: none;
        }

        .hero-title { font-size: 1.4rem; font-weight: 700; margin: 0 0 5px 0; color: #f87171; z-index: 2; display: flex; align-items: center; gap: 10px;}
        .hero-subtitle { font-size: 0.9rem; color: #cbd5e1; margin: 0 0 15px 0; z-index: 2; line-height: 1.5;}
        
        .badge-osis {
            display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; 
            border-radius: 50px; font-size: 0.8rem; font-weight: 700;
            background: linear-gradient(135deg, var(--aspirasi), var(--aspirasi-dark)); color: white; 
            box-shadow: 0 2px 8px rgba(220, 38, 38, 0.4); width: fit-content; z-index: 2;
        }

        /* --- 4. GRID ASPIRASI --- */
        .aspirasi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }

        .aspirasi-card {
            background: white; border-radius: 16px; padding: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03); border: 1px solid #e2e8f0;
            display: flex; flex-direction: column; transition: 0.3s;
            position: relative; overflow: hidden;
        }
        .aspirasi-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(220, 38, 38, 0.08); border-color: #fca5a5; }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px dashed #e2e8f0; }
        .sender-info h3 { margin: 0 0 5px 0; font-size: 1.1rem; color: var(--primary); display: flex; align-items: center; gap: 8px; font-family: 'Aleo', serif;}
        .sender-info p { margin: 0; font-size: 0.8rem; color: var(--text-gray); }

        .badge { padding: 4px 10px; border-radius: 50px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .cat-akademik { background: #e0e7ff; color: #4338ca; }
        .cat-fasilitas { background: #ffedd5; color: #b45309; }
        .cat-osis { background: #fce7f3; color: #be185d; }
        .cat-lainnya { background: #f1f5f9; color: #475569; }

        .status-pending { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
        .status-proses { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
        .status-selesai { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }

        .aspirasi-msg { font-size: 0.95rem; color: var(--text-dark); line-height: 1.6; margin-bottom: 20px; font-style: italic; background: #f8fafc; padding: 15px; border-radius: 8px; border-left: 3px solid #cbd5e1; }

        .action-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-action {
            flex: 1; border: none; padding: 10px; border-radius: 8px;
            font-size: 0.85rem; font-weight: 600; font-family: 'Poppins'; cursor: pointer;
            transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 5px;
        }
        .btn-proses { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
        .btn-proses:hover { background: #dbeafe; }
        .btn-selesai { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
        .btn-selesai:hover { background: #dcfce7; }

        .reply-section {
            margin-top: auto; padding-top: 15px; border-top: 1px dashed #e2e8f0;
        }
        .reply-section label {
            display: block; font-size: 0.85rem; font-weight: 600; color: var(--primary); margin-bottom: 8px;
        }
        .reply-input {
            width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px;
            font-family: 'Poppins', sans-serif; font-size: 0.85rem; resize: vertical; min-height: 60px;
            margin-bottom: 10px; box-sizing: border-box; background: #f8fafc; transition: 0.3s;
        }
        .reply-input:focus { border-color: var(--primary); background: white; outline: none; }
        .btn-reply {
            width: 100%; background: #0f172a; color: white; border: none; padding: 10px; border-radius: 8px;
            font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 5px;
        }
        .btn-reply:hover { background: var(--primary); }

        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--nav-bg); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; transition: 0.4s; }
        #loading-screen h3 { font-family: 'Poppins', sans-serif; font-size: 1.1rem; font-weight: 400; color: #cbd5e1; margin: 0 0 10px 0;}
        
        @media (min-width: 768px) {
            .container { padding: 25px; }
        }

        @media (max-width: 600px) {
            .nav-brand h1 { font-size: 1.1rem; }
            .btn-back-nav span { display: none; }
            .hero-title { font-size: 1.2rem; }
            .aspirasi-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <i class="fa-solid fa-box-open fa-bounce" style="font-size: 3rem; margin-bottom: 20px; color: var(--aspirasi);"></i>
        <h3 id="load-title">Membuka Kotak Suara...</h3>
    </div>

    <!-- NAVBAR FIXED -->
    <header class="top-navbar">
        <div class="nav-brand">
            <img src="https://i.imgur.com/5Srjyo4.png" alt="Logo">
            <h1>Markas OSIS</h1>
        </div>
        <a href="monitoring.html" class="btn-back-nav">
            <i class="fa-solid fa-arrow-left"></i> <span>Kembali ke Monitoring</span>
        </a>
    </header>

    <main class="container" style="display: none;" id="main-content">
        
        <div class="hero-banner">
            <h2 class="hero-title"><i class="fa-solid fa-envelope-open-text"></i> Kotak Aspirasi Siswa</h2>
            <p class="hero-subtitle">Tinjau keluhan, saran, dan masukan dari siswa Cendekia Aksara untuk dievaluasi oleh pengurus.</p>
            <div class="badge-osis"><i class="fa-solid fa-user-shield"></i> Tim Peninjau: <span id="admin-name-badge">Memuat...</span></div>
        </div>

        <div id="aspirasi-grid" class="aspirasi-grid">
            <div style="grid-column: 1/-1; text-align: center; padding: 50px; color: #94a3b8;">
                <i class="fa-solid fa-spinner fa-spin" style="font-size: 2rem;"></i><br><br>Memuat data aspirasi...
            </div>
        </div>

    </main>

    <!-- Script SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="module">
        import { db, checkAuth } from "/js/firebase-config.js";
        import { collection, query, orderBy, getDocs, doc, updateDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const formatDate = (dateStr) => {
            if (!dateStr) return "-";
            const date = new Date(dateStr.toDate ? dateStr.toDate() : dateStr);
            return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        };

        // --- FUNGSI ONESIGNAL PUSH NOTIFICATION ---
        window.kirimNotifikasiOneSignal = async (judul, pesan, urlTujuan) => {
            try {
                const res = await fetch("/api/notif", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ judul, pesan, urlTujuan, jenis: "aspirasi" })
                });

                let result = null;
                try { result = await res.json(); } catch (_) { }

                if (!res.ok || result?.success === false) {
                    console.error("❌ Notifikasi GAGAL dikirim OneSignal:", res.status, result);
                    return { ok: false, status: res.status, detail: result };
                }

                const recipients = result?.data?.recipients;
                if (recipients === 0) {
                    console.warn("⚠️ OneSignal menerima permintaan, tapi 0 penerima.");
                    return { ok: true, recipients: 0, detail: result };
                }

                console.log("✅ Notifikasi terkirim ke OneSignal. Penerima:", recipients, result);
                return { ok: true, recipients, detail: result };
            } catch (error) {
                console.error("❌ Gagal menghubungi endpoint /api/notif:", error);
                return { ok: false, status: null, detail: error.message };
            }
        };

        (async () => {
            const userData = await checkAuth('siswa');
            
            if(userData) {
                if (userData.is_osis !== true) {
                    alert("Akses Ditolak! Hanya Pengurus OSIS yang diizinkan.");
                    window.location.href = '/dashboard/index.html';
                    return;
                }

                document.getElementById('admin-name-badge').innerText = userData.name;

                document.getElementById('loading-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loading-screen').style.display = 'none';
                    document.getElementById('main-content').style.display = 'block';
                    loadAspirasi();
                }, 400);
            }
        })();

        async function loadAspirasi() {
            const container = document.getElementById('aspirasi-grid');
            try {
                const q = query(collection(db, 'aspirasi'), orderBy('timestamp', 'desc'));
                const snap = await getDocs(q);

                container.innerHTML = '';
                
                if(snap.empty) {
                    container.innerHTML = `
                        <div style="grid-column: 1/-1; text-align: center; padding: 60px; background: white; border-radius: 16px; border: 2px dashed #cbd5e1;">
                            <i class="fa-solid fa-box-open" style="font-size: 4rem; color: #e2e8f0; margin-bottom: 15px;"></i>
                            <h3 style="color: #64748b; margin: 0; font-family: 'Aleo', serif;">Kotak Aspirasi Kosong</h3>
                            <p style="color: #94a3b8; font-size: 0.9rem;">Belum ada masukan atau keluhan dari siswa saat ini.</p>
                        </div>
                    `;
                    return;
                }

                let htmlBuffer = '';
                snap.forEach(documentSnapshot => {
                    const data = documentSnapshot.data();
                    const id = documentSnapshot.id;
                    
                    let statusBadge = '';
                    let btnHtml = '';
                    
                    if (data.status === 'pending' || !data.status) {
                        statusBadge = `<span class="badge status-pending"><i class="fa-solid fa-circle-exclamation"></i> Belum Diproses</span>`;
                        btnHtml = `
                            <button class="btn-action btn-proses" onclick="updateStatus('${id}', 'proses', '${data.senderId}')"><i class="fa-solid fa-spinner"></i> Tandai Diproses</button>
                            <button class="btn-action btn-selesai" onclick="updateStatus('${id}', 'selesai', '${data.senderId}')"><i class="fa-solid fa-check-double"></i> Tandai Selesai</button>
                        `;
                    } else if (data.status === 'proses') {
                        statusBadge = `<span class="badge status-proses"><i class="fa-solid fa-gears"></i> Sedang Diproses</span>`;
                        btnHtml = `<button class="btn-action btn-selesai" onclick="updateStatus('${id}', 'selesai', '${data.senderId}')" style="width: 100%;"><i class="fa-solid fa-check-double"></i> Tandai Selesai</button>`;
                    } else if (data.status === 'selesai') {
                        statusBadge = `<span class="badge status-selesai"><i class="fa-solid fa-check-circle"></i> Selesai Ditangani</span>`;
                        btnHtml = `<button class="btn-action" style="width: 100%; background: #f1f5f9; color: #94a3b8; cursor: default;" disabled>Tindakan Selesai</button>`;
                    }

                    let catClass = 'cat-lainnya';
                    if(data.kategori === 'Akademik/Kurikulum') catClass = 'cat-akademik';
                    if(data.kategori === 'Fasilitas Web') catClass = 'cat-fasilitas';
                    if(data.kategori === 'Kritik untuk OSIS') catClass = 'cat-osis';

                    const senderName = data.isAnonim ? 'Siswa Rahasia (Anonim)' : (data.senderName || 'Siswa');
                    const senderIcon = data.isAnonim ? '<i class="fa-solid fa-user-secret"></i>' : '<i class="fa-solid fa-user"></i>';
                    const currentBalasan = data.balasanOsis || '';

                    htmlBuffer += `
                        <div class="aspirasi-card">
                            <div class="card-header">
                                <div class="sender-info">
                                    <h3>${senderIcon} ${senderName}</h3>
                                    <p><i class="fa-regular fa-clock"></i> ${formatDate(data.timestamp)}</p>
                                </div>
                                <span class="badge ${catClass}">${data.kategori || 'Umum'}</span>
                            </div>
                            
                            <div class="aspirasi-msg">
                                "${data.pesan}"
                            </div>
                            
                            <div style="margin-bottom: 15px;">
                                ${statusBadge}
                            </div>

                            <div class="action-group">
                                ${btnHtml}
                            </div>
                            
                            <!-- KOLOM BALASAN OSIS -->
                            <div class="reply-section">
                                <label><i class="fa-solid fa-reply"></i> Balasan OSIS:</label>
                                <textarea id="reply-${id}" class="reply-input" placeholder="Tuliskan jawaban atau tanggapan untuk siswa ini...">${currentBalasan}</textarea>
                                <button class="btn-reply" onclick="kirimBalasan('${id}', this, '${data.senderId}')">
                                    <i class="fa-solid fa-paper-plane"></i> Simpan Balasan
                                </button>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = htmlBuffer;

            } catch (error) {
                console.error(error);
                container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #ef4444; background: white; padding: 20px; border-radius: 10px;">Gagal memuat data aspirasi. Pastikan koneksi internet stabil.</div>`;
            }
        }

        // FUNGSI UPDATE STATUS MANUAL & KIRIM NOTIFIKASI
        window.updateStatus = async (id, newStatus, senderId) => {
            try {
                await updateDoc(doc(db, 'aspirasi', id), {
                    status: newStatus
                });
                
                // Buat Notifikasi Database & OneSignal Push
                if(senderId) {
                    let statusText = newStatus === 'proses' ? 'Sedang Diproses' : 'Selesai Ditangani';
                    let pesanNotif = `Aspirasi yang kamu kirimkan ke OSIS sekarang berstatus: ${statusText}.`;
                    
                    await addDoc(collection(db, 'notifications'), {
                        userId: senderId,
                        title: 'Status Aspirasi Diperbarui 🔔',
                        message: pesanNotif,
                        isRead: false,
                        timestamp: serverTimestamp(),
                        link: '/siswa/aspirasi.html'
                    });

                    // KIRIM PUSH NOTIFICATION ONESIGNAL
                    await window.kirimNotifikasiOneSignal(
                        "Status Aspirasi Diperbarui 🔔",
                        pesanNotif,
                        "/siswa/aspirasi.html"
                    );
                }

                Swal.fire({
                    icon: 'success',
                    title: 'Status Diperbarui',
                    text: 'Status aspirasi diubah. Siswa pengirim telah menerima notifikasi.',
                    timer: 2000,
                    showConfirmButton: false
                });
                
                loadAspirasi();

            } catch (e) {
                Swal.fire('Error', 'Gagal memperbarui status: ' + e.message, 'error');
            }
        };

        // FUNGSI KIRIM BALASAN OSIS & KIRIM NOTIFIKASI
        window.kirimBalasan = async (id, btnElement, senderId) => {
            const inputEl = document.getElementById(`reply-${id}`);
            const balasan = inputEl.value.trim();

            if (!balasan) {
                Swal.fire('Peringatan', 'Harap isi kolom balasan terlebih dahulu sebelum menyimpan.', 'warning');
                return;
            }

            const originalText = btnElement.innerHTML;
            btnElement.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...';
            btnElement.disabled = true;

            try {
                await updateDoc(doc(db, 'aspirasi', id), {
                    balasanOsis: balasan,
                    waktuBalasan: serverTimestamp(),
                    status: 'selesai' // Otomatis selesai karena dibalas
                });
                
                // Buat Notifikasi Balasan Database & OneSignal Push
                if(senderId) {
                    let pesanNotif = `Pengurus OSIS telah memberikan tanggapan untuk aspirasi kamu. Cek sekarang!`;

                    await addDoc(collection(db, 'notifications'), {
                        userId: senderId,
                        title: 'Balasan Baru dari OSIS 📩',
                        message: pesanNotif,
                        isRead: false,
                        timestamp: serverTimestamp(),
                        link: '/siswa/aspirasi.html'
                    });

                    // KIRIM PUSH NOTIFICATION ONESIGNAL
                    await window.kirimNotifikasiOneSignal(
                        "Balasan Baru dari OSIS 📩",
                        pesanNotif,
                        "/siswa/aspirasi.html"
                    );
                }

                Swal.fire({
                    icon: 'success',
                    title: 'Terkirim',
                    text: 'Balasan berhasil disimpan. Notifikasi OneSignal telah dikirim ke perangkat siswa pengirim.',
                    confirmButtonColor: '#003366'
                });
                
                loadAspirasi(); 

            } catch (e) {
                Swal.fire('Error', 'Gagal menyimpan balasan: ' + e.message, 'error');
                btnElement.innerHTML = originalText;
                btnElement.disabled = false;
            }
        };
    </script>
</body>
</html>
