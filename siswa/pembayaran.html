<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keuangan - Cendekia Aksara</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }
        :root { 
            --primary: #003366; --accent: #4361ee; --bg: #f4f6f9; 
            /* Variabel Warna Mode Normal */
            --hdr-bg1: #001f3f; --hdr-bg2: #003366; --btn-pay: #f59e0b;
        }
        
        /* MODE DENDA WITHDRAWAL (Akan aktif lewat JS) */
        body.mode-withdrawal {
            --hdr-bg1: #991b1b; --hdr-bg2: #dc3545; --primary: #991b1b; --btn-pay: #dc3545;
        }

        body { background-color: var(--bg); font-family: 'Outfit', sans-serif; color: #333; margin: 0; padding-bottom: 40px; }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }

        /* HEADER */
        .page-header {
            background: linear-gradient(135deg, var(--hdr-bg1) 0%, var(--hdr-bg2) 100%);
            color: white; padding: 25px 30px; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; overflow: hidden; flex-wrap: wrap; gap: 15px;
            position: sticky; top: 20px; z-index: 1000; transition: background 0.3s;
        }
        .header-content-wrapper { display: flex; align-items: center; gap: 20px; z-index: 2; position: relative; }
        .header-logo-circle {
            width: 70px; height: 70px; background: white; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); flex-shrink: 0; overflow: hidden;
            color: var(--primary); font-size: 2rem;
        }
        .header-logo-circle img { width: 75%; height: auto; object-fit: contain; }
        
        body.mode-withdrawal .header-logo-circle img { display: none; }
        body:not(.mode-withdrawal) .header-logo-circle i { display: none; }

        .header-content h1 { margin: 0; font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 700; line-height: 1.2; letter-spacing: 0.5px;}
        .header-content p { margin: 5px 0 0; opacity: 0.9; font-size: 0.9rem; color: #cbd5e1; }
        
        .btn-back {
            background: rgba(255,255,255,0.15); color: white; text-decoration: none;
            padding: 10px 18px; border-radius: 50px; font-weight: 600; backdrop-filter: blur(5px);
            transition: 0.3s; display: flex; align-items: center; gap: 8px; font-size: 0.85rem;
            border: 1px solid rgba(255,255,255,0.3); z-index: 2;
        }
        .btn-back:hover { background: white; color: var(--primary); }

        /* CONTENT GRID */
        .content-grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 25px; }

        .card {
            background: white; border-radius: 20px; padding: 25px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.03); border: 1px solid #eef2f6; height: fit-content;
        }

        /* PROFILE */
        .profile-section { text-align: center; }
        .avatar-circle {
            width: 80px; height: 80px; background: #e0f2fe; color: var(--primary);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 2.5rem; margin: 0 auto 15px; transition: 0.3s;
        }
        body.mode-withdrawal .avatar-circle { background: #fee2e2; color: #dc3545; }

        .st-name { font-size: 1.2rem; font-weight: 700; margin: 0; color: #1e293b; }
        .st-id { color: #64748b; font-size: 0.9rem; margin-top: 5px; }
        
        .info-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: #64748b; }
        .info-val { font-weight: 600; color: #334155; }

        /* BILL HEADER */
        .bill-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; gap: 10px; }
        .bill-label { font-size: 0.8rem; color: #64748b; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .bill-amount { font-size: 2.2rem; font-weight: 800; color: var(--primary); line-height: 1; margin: 5px 0; transition: 0.3s;}
        
        .status-badge { padding: 6px 12px; border-radius: 50px; font-weight: 700; font-size: 0.75rem; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; height: fit-content; }
        .st-unpaid { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca;}
        .st-paid { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0;}
        .st-waiting { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd;}
        .st-danger { background: #7f1d1d; color: white; border: 1px solid #450a0a;} /* Khusus Denda */

        /* DETAILS */
        .details-box { background: #f8fafc; border-radius: 12px; padding: 15px; margin: 20px 0; border: 1px solid #f1f5f9; }
        .detail-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem; color: #475569; }
        .detail-row.denda { color: #b91c1c; font-weight: 600; }
        .detail-total { border-top: 2px dashed #cbd5e1; margin-top: 10px; padding-top: 10px; font-weight: 700; color: #1e293b; font-size: 1rem; }

        .info-banner { border-radius: 12px; padding: 14px 16px; font-size: 0.85rem; margin-bottom: 18px; display: flex; gap: 10px; align-items: flex-start; line-height: 1.5; }
        .info-banner.blue { background: #e0f2fe; color: #0c4a6e; border: 1px solid #bae6fd; }
        .info-banner.red { background: #fee2e2; color: #7f1d1d; border: 1px solid #fecaca; }
        .info-banner i { margin-top: 2px; }

        /* ACTION BUTTONS */
        .action-area { margin-top: 25px; display: flex; flex-direction: column; gap: 10px; }
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }

        .btn-action {
            display: flex; width: 100%; padding: 14px; border: none; border-radius: 12px;
            font-size: 0.95rem; font-weight: 700; cursor: pointer; text-align: center; text-decoration: none;
            justify-content: center; align-items: center; gap: 8px; transition: 0.2s;
        }
        .btn-action:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        .btn-pay { background: var(--btn-pay); color: white; }
        .btn-pay:hover { filter: brightness(0.9); }
        .btn-receipt { background: var(--primary); color: white; }
        .btn-waiting { background: #cbd5e1; color: #475569; cursor: default; }

        /* MODAL QRIS */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 2000; display: none; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s; }
        .modal-overlay.active { display: flex; opacity: 1; }
        
        .modal-box { background: white; padding: 25px; border-radius: 20px; width: 90%; max-width: 380px; text-align: center; transform: scale(0.8); transition: transform 0.3s; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .modal-overlay.active .modal-box { transform: scale(1); }
        .close-modal { position: absolute; right: 15px; top: 15px; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #999; }

        /* MODAL CUSTOM ALERT */
        #modal-notification .modal-box { border-top: 5px solid var(--primary); }
        #modal-notification.success .modal-box { border-top-color: #10b981; }
        #modal-notification.error .modal-box { border-top-color: #ef4444; }

        /* LOADING */
        #modal-loading { background: rgba(255,255,255,0.9); }

        @media (max-width: 768px) {
            .container { padding: 0 0 20px 0; } 
            .page-header { border-radius: 0 0 25px 25px; margin: 0 0 20px 0; padding: 25px 20px; flex-direction: column; align-items: flex-start; text-align: left; top: 0; }
            .content-grid { grid-template-columns: 1fr; gap: 20px; padding: 0 20px; }
            .btn-back { width: 100%; justify-content: center; margin-top: 5px; }
        }
    </style>
</head>

    <div class="container" id="main-content">
        <header class="page-header" id="header-bg">
            <div class="header-content-wrapper">
                <div class="header-logo-circle">
                    <img src="https://i.imgur.com/5Srjyo4.png" alt="Logo Cendekia Aksara">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
                <div class="header-content">
                    <h1 id="page-title">Keuangan Siswa</h1>
                    <p id="page-subtitle">Kelola tagihan dan administrasi akademik Anda.</p>
                </div>
            </div>
            <a href="/dashboard/index.html" class="btn-back" id="btn-kembali">
                <i class="fa-solid fa-arrow-left"></i> <span id="kembali-text">Dashboard Utama</span>
            </a>
        </header>

        <div class="content-grid">
            <div class="card profile-section">
                <div class="avatar-circle" id="profile-icon"><i class="fa-solid fa-user-graduate"></i></div>
                <h2 class="st-name" id="st-name">Memuat...</h2>
                <p class="st-id" id="st-uid">ID: -</p>
                <div style="margin-top: 25px; text-align: left;">
                    <div class="info-row"><span class="info-label">Semester</span><span class="info-val" id="header-sem">-</span></div>
                    <div class="info-row"><span class="info-label">Status Akademik</span><span class="info-val" id="status-akademik" style="color:#166534;">Aktif</span></div>
                </div>
            </div>

            <div class="card">
                <div class="bill-header">
                    <div>
                        <div class="bill-label" id="label-tagihan">Total Kewajiban</div>
                        <div class="bill-amount" id="amount-display">Rp -</div>
                    </div>
                    <div id="status-badge" class="status-badge st-unpaid">Memuat...</div>
                </div>
                <div id="info-banner-area"></div>
                <div class="details-box" id="rincian-list"></div>
                <div id="action-area" class="action-area"></div>
            </div>
        </div>
    </div>

    <!-- MODAL NOTIFICATION CUSTOM -->
    <div id="modal-notification" class="modal-overlay">
        <div class="modal-box">
            <div id="noti-icon" class="modal-icon-lg"></div>
            <h3 id="noti-title" class="modal-h3">Notifikasi</h3>
            <p id="noti-msg" class="modal-p"></p>
            <button class="btn-action btn-receipt" onclick="closeAllModals()">Tutup</button>
        </div>
    </div>

    <!-- MODAL LOADING -->
    <div id="modal-loading" class="modal-overlay">
        <div class="modal-box" style="width:auto; padding:30px;">
            <i class="fa-solid fa-circle-notch fa-spin" style="font-size:3rem; color:var(--primary);"></i>
            <p style="margin-top:15px; font-weight:600;">Sedang memproses...</p>
        </div>
    </div>

    <script type="module">
        import { db, checkAuth } from "./js/firebase-config.js";
        import { collection, query, where, getDocs, doc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        const urlParams = new URLSearchParams(window.location.search);
        const fromInkubasi = urlParams.get('ref') === 'inkubasi';
        const isWithdrawal = urlParams.get('type') === 'withdrawal';
        const withdrawalPenalty = parseInt(urlParams.get('penalty')) || 0;
        const activeDays = parseInt(urlParams.get('days')) || 0;
        
        const btnKembali = document.getElementById('btn-kembali');
        const textKembali = document.getElementById('kembali-text');
        
        if (btnKembali && textKembali) {
            if (isWithdrawal) {
                btnKembali.href = '/siswa/cuti.html';
                textKembali.innerText = 'Batal & Kembali';
            } else if (fromInkubasi) {
                btnKembali.href = '/dashboard/inkubasi.html';
                textKembali.innerText = 'Ruang Inkubasi'; 
            } else {
                btnKembali.href = '/dashboard/index.html'; 
                textKembali.innerText = 'Dashboard Utama';
            }
        }

        // Terapkan Mode Merah Jika Withdrawal
        if (isWithdrawal) {
            document.body.classList.add('mode-withdrawal');
            document.getElementById('page-title').innerText = "Denda Pengunduran Diri";
            document.getElementById('page-subtitle').innerText = "Mohon selesaikan kewajiban administratif Anda.";
            document.getElementById('status-akademik').innerText = "Proses Berhenti";
            document.getElementById('status-akademik').style.color = "#dc3545";
        }

        let currentUser = null;
        let unsubscribePayment = null;

        function tanggalIndo(d) {
            return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        window.showCustomModal = (type, title, message) => {
            const modal = document.getElementById('modal-notification');
            const icon = document.getElementById('noti-icon');
            const titleEl = document.getElementById('noti-title');
            const msgEl = document.getElementById('noti-msg');

            modal.classList.remove('success', 'error');
            modal.classList.add(type);

            if (type === 'success') icon.innerHTML = '<i class="fa-solid fa-circle-check" style="color:#10b981;"></i>';
            else if (type === 'error') icon.innerHTML = '<i class="fa-solid fa-circle-xmark" style="color:#ef4444;"></i>';
            else icon.innerHTML = '<i class="fa-solid fa-circle-info" style="color:#0ea5e9;"></i>';

            titleEl.innerText = title;
            msgEl.innerText = message;
            modal.classList.add('active');
        };

        window.showQRIS = async (amount, label, dbFieldStatus, dbFieldAmount, dbFieldStage) => {
            document.getElementById('modal-loading').classList.add('active');
            const uniqueCode = Math.floor(Math.random() * 500) + 1;
            const finalAmount = amount + uniqueCode;

            try {
                let payload = {};
                payload[dbFieldStatus] = 'waiting';
                payload[dbFieldAmount] = finalAmount;
                if (dbFieldStage) payload[dbFieldStage] = label;

                await updateDoc(doc(db, 'users', currentUser.uid), payload);

                // Update Local State
                currentUser[dbFieldStatus] = 'waiting';
                currentUser[dbFieldAmount] = finalAmount;
                if (dbFieldStage) currentUser[dbFieldStage] = label;

                document.getElementById('qris-amount').innerText = "Rp " + finalAmount.toLocaleString('id-ID');
                document.getElementById('qris-title').innerText = label + " (+ Kode Unik)";
                document.getElementById('modal-loading').classList.remove('active');
                document.getElementById('modal-qris').classList.add('active');
                
                setWaitingUI(dbFieldAmount, label);

                if (unsubscribePayment) unsubscribePayment();
                unsubscribePayment = onSnapshot(doc(db, "users", currentUser.uid), (docSnap) => {
                    const data = docSnap.data();
                    if (data[dbFieldStatus] === 'verified' || data[dbFieldStatus] === 'Lunas') {
                        if (unsubscribePayment) unsubscribePayment();
                        handlePaymentSuccess(isWithdrawal);
                    }
                });

            } catch(e) {
                document.getElementById('modal-loading').classList.remove('active');
                showCustomModal('error', 'Gagal', 'Sistem pembayaran sedang sibuk.');
            }
        };

        window.reopenPendingPayment = (dbFieldAmount, label) => {
            const amount = currentUser[dbFieldAmount] || 0;
            document.getElementById('qris-amount').innerText = "Rp " + amount.toLocaleString('id-ID');
            document.getElementById('qris-title').innerText = label + " (+ Kode Unik)";
            document.getElementById('modal-qris').classList.add('active');
        };

        function handlePaymentSuccess(isWd) {
            closeAllModals();
            if (isWd) {
                showCustomModal('success', 'Akun Dinonaktifkan', 'Denda berhasil dilunasi. Akun Anda telah dinonaktifkan secara permanen.');
                setTimeout(() => { window.location.href = '../index.html'; }, 3500);
            } else {
                showCustomModal('success', 'Berhasil', 'PEMBAYARAN BERHASIL TERDETEKSI! Halaman akan diperbarui.');
                setTimeout(() => { location.reload(); }, 2500);
            }
        }

        window.closeAllModals = () => {
            document.querySelectorAll('.modal-overlay').forEach(el => el.classList.remove('active'));
        };

        (async () => {
            currentUser = await checkAuth('siswa');
            if(currentUser) {
                const rawSem = currentUser.semester || 1;
                const sem = parseInt(String(rawSem).replace(/\D/g, '')) || 1;
                
                if (isWithdrawal) {
                    renderWithdrawalMode(currentUser);
                } else {
                    renderData(currentUser, sem);
                }
            }
        })();

        function setWaitingUI(dbFieldAmount, label) {
            const badge = document.getElementById('status-badge');
            const actionArea = document.getElementById('action-area');
            if(badge) { 
                badge.className = 'status-badge st-waiting'; 
                badge.innerHTML = '<i class="fa-solid fa-clock"></i> MENUNGGU VERIFIKASI'; 
            }
            if(actionArea) { 
                actionArea.innerHTML = `
                    <button onclick="reopenPendingPayment('${dbFieldAmount}', '${label}')" class="btn-action btn-pay" style="background: #0ea5e9; color: white;">
                        <i class="fa-solid fa-qrcode"></i> Lihat Kode Bayar
                    </button>
                    <button onclick="location.reload()" class="btn-action btn-waiting" style="background: #f1f5f9; color: #475569;">
                        <i class="fa-solid fa-rotate-right"></i> Muat Ulang Halaman
                    </button>
                `; 
            }
        }

        // =========================================================
        // MODE 1: DENDA WITHDRAWAL
        // =========================================================
        function renderWithdrawalMode(user) {
            document.getElementById('header-sem').innerText = "Berhenti";
            document.getElementById('st-name').innerText = user.name;
            document.getElementById('st-uid').innerText = user.uid.substring(0,6).toUpperCase();
            
            const badge = document.getElementById('status-badge');
            const amountEl = document.getElementById('amount-display');
            const detailsEl = document.getElementById('rincian-list');
            const actionArea = document.getElementById('action-area');
            const bannerArea = document.getElementById('info-banner-area');

            // Cek jika sedang menunggu pembayaran denda
            if (user.wd_paymentStatus === 'waiting') {
                setWaitingUI('wd_pendingAmount', 'Denda Pengunduran Diri');
                amountEl.innerText = "Rp " + (user.wd_pendingAmount || 0).toLocaleString('id-ID');
                
                // Pasang listener
                onSnapshot(doc(db, "users", user.uid), (docSnap) => {
                    if (docSnap.data().wd_paymentStatus === 'verified') handlePaymentSuccess(true);
                });
                return;
            }

            // Hitung Biaya Denda
            const BIAYA_HAPUS_AKUN = 25000;
            const BIAYA_LAYANAN = 5000;
            const dendaTotal = withdrawalPenalty + BIAYA_HAPUS_AKUN + BIAYA_LAYANAN;

            document.getElementById('label-tagihan').innerText = "DENDA ADMINISTRATIF";
            amountEl.innerText = "Rp " + dendaTotal.toLocaleString('id-ID');
            badge.className = 'status-badge st-danger'; 
            badge.innerHTML = '<i class="fa-solid fa-ban"></i> WAJIB LUNAS';

            detailsEl.innerHTML = `
                <div class="detail-row"><span>Kompensasi Waktu Aktif (${activeDays} hari)</span><span>Rp ${withdrawalPenalty.toLocaleString('id-ID')}</span></div>
                <div class="detail-row"><span>Biaya Penghapusan Database</span><span>Rp ${BIAYA_HAPUS_AKUN.toLocaleString('id-ID')}</span></div>
                <div class="detail-row"><span>Biaya Layanan Admin</span><span>Rp ${BIAYA_LAYANAN.toLocaleString('id-ID')}</span></div>
                <div class="detail-row detail-total"><span>TOTAL DENDA FINAL</span><span style="color:#dc3545;">Rp ${dendaTotal.toLocaleString('id-ID')}</span></div>
            `;
            
            bannerArea.innerHTML = `<div class="info-banner red"><i class="fa-solid fa-triangle-exclamation"></i><span>Sesuai ketentuan, Anda wajib melunasi denda ini untuk menyelesaikan proses pengunduran diri. Setelah lunas, akun dan data Anda akan dibekukan/dihapus dari sistem.</span></div>`;
            actionArea.innerHTML = `<button onclick="showQRIS(${dendaTotal}, 'Denda Pengunduran Diri', 'wd_paymentStatus', 'wd_pendingAmount', null)" class="btn-action" style="background:#dc3545; color:white;"><i class="fa-solid fa-qrcode"></i> Bayar Denda Sekarang</button>`;
        }

        // =========================================================
        // MODE 2: TAGIHAN NORMAL (Uang Ujian / Semester 3)
        // =========================================================
        async function renderData(user, sem) {
            document.getElementById('header-sem').innerText = "Semester " + sem;
            document.getElementById('st-name').innerText = user.name;
            document.getElementById('st-uid').innerText = user.uid.substring(0,6).toUpperCase();

            const badge = document.getElementById('status-badge');
            const amountEl = document.getElementById('amount-display');
            const detailsEl = document.getElementById('rincian-list');
            const actionArea = document.getElementById('action-area');
            const bannerArea = document.getElementById('info-banner-area');

            if (sem < 3) {
                if (user.paymentStatus === 'waiting' && user.statusPembayaran !== 'Lunas') {
                    setWaitingUI('pendingAmount', 'Uang Ujian');
                    amountEl.innerText = "Rp " + (user.pendingAmount || 0).toLocaleString('id-ID');
                    
                    onSnapshot(doc(db, "users", user.uid), (docSnap) => {
                        if (docSnap.data().paymentStatus === 'verified' || docSnap.data().statusPembayaran === 'Lunas') handlePaymentSuccess(false);
                    });
                    return;
                }

                const q = query(collection(db, 'exams'), where('status', '==', 'active'));
                const snap = await getDocs(q);
                const count = snap.size;
                const totalBayar = count * 1000;

                document.getElementById('label-tagihan').innerText = "TAGIHAN UJIAN";
                amountEl.innerText = "Rp " + totalBayar.toLocaleString('id-ID');
                detailsEl.innerHTML = `<div class="detail-row"><span>Biaya Per Mapel</span><span>Rp 1.000</span></div><div class="detail-row"><span>Jumlah Mapel</span><span>${count}</span></div><div class="detail-row detail-total"><span>TOTAL TAGIHAN</span><span>Rp ${totalBayar.toLocaleString('id-ID')}</span></div>`;

                if (user.statusPembayaran === 'Lunas') {
                    badge.className = 'status-badge st-paid'; badge.innerHTML = '<i class="fa-solid fa-check"></i> LUNAS';
                    actionArea.innerHTML = `<a href="kwitansi.html" class="btn-action btn-receipt"><i class="fa-solid fa-file-invoice"></i> Lihat Kwitansi</a>`;
                } else {
                    badge.className = 'status-badge st-unpaid'; badge.innerHTML = 'BELUM BAYAR';
                    if(totalBayar > 0) {
                        actionArea.innerHTML = `<button onclick="showQRIS(${totalBayar}, 'Uang Ujian', 'paymentStatus', 'pendingAmount', null)" class="btn-action btn-pay"><i class="fa-solid fa-qrcode"></i> Bayar Sekarang</button>`;
                    } else {
                        actionArea.innerHTML = `<div style="text-align:center; color:#64748b; font-size:0.9rem; margin-top:10px;"><i class="fa-solid fa-circle-check"></i> Tidak ada tagihan ujian aktif.</div>`;
                    }
                }
                return;
            }

            // SEMESTER 3 LOGIC (Disembunyikan agar kode tidak terlalu panjang, gunakan logika Anda yang lama jika perlu)
            amountEl.innerText = "Semester 3";
        }
    </script>
</body>
</html>
